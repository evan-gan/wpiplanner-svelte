    description: "Cat. IThis course provides in-depth coverage of processes used in wastewater treatment. Topics include: review of water quality standards, wastewater characteristics, application of biochemical oxygen demand, sources and effects of pollution, physical, chemical, and biological wastewater treatment processes, and waste sludge management.Recommended background: CE 3059 and ES 3004."
