  - courseId: IMGD|2002
    description: "This course prepares students with the knowledge and critical frameworks necessary to understand the technical, social, and historical underpinnings of contemporary artificial intelligence. Through activities, discussions, and design projects, students will develop a critical AI literacy: the ability to interpret, question, and communicate about AI and its function and future in the designed world. Students will learn about common myths and misconceptions about AI and reflect upon how their understanding of AI shapes their adoption of it personally and professionally. Through project work, students will propose interventions that can develop critical AI literacy in broader society beyond the classroom. Topics include the history of artificial intelligence and how it rose to prominence, human perception and misperceptions of AI, social and environmental impacts of AI, and the origins of data and its implications for AI design. Category: Cat II. Recommended Background: None"
    clauses: []
    noCreditWith: []
  - courseId: IMGD|2030
    description: "This course serves as an introduction to game audio, where the basics of audio theory and production are discussed along with practical applications for use in game development. Topics may include music, sound effects, dialogue, soundscape design, digital signal processing, basic audio engine principles, and the aesthetic vs. technical considerations in game audio production. Lab exercises may include an introduction to audio editing and mixing, dynamics and effects processing, creating and timing sound effects to character animations, mixing for cinematics, and audio integration using a 3D engine. Recommended background: IMGD 1000 and IMGD 1001. This course assumes no prior knowledge of audio production."
    clauses:
