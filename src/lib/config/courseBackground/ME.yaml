  - courseId: ME|1520
    description: "Cat. IIThis course explores science and engineering issues associated with equipment andtechnique for alpine skiing, particularly racing. A diverse group of technical subjectsrelated to engineering mechanics are discussed: tribology, beams, rigid body motion,material science, machining and biomechanics. Specifically we will examine:ski-snow interactions, technique for gliding, turning and stepping, selection of linein racing; equipment design, testing and performance; and ski injuries. We will alsoaddress issues in the epidemiology of skiing injuries, the calculation of the cost of skiinjuries to society, the impact of ski equipment technology on litigation and theimpact of litigation on equipment and trail design.This course will be offered in 2020-21, and in alternating years thereafter."
    clauses: []
    noCreditWith: []
  - courseId: ME|5001
    description: A study of important numerical and computational methods for solving engineering science problems. The course will include methods for solving linear and nonlinear equations, interpolation strategies, evaluating integrals, and solving ordinary and partial differential equations. Finite difference methods will be developed in full for the solution of partial differential equations. The course materials emphasize the systematic generation of numerical methods for elliptic, parabolic, and hyperbolic problems, and the analysis of their stability, accuracy, and convergence properties. The student will be required to write and run computer programs. Students cannot receive credit for this course if they have taken the Special Topics (ME 593M) version of the same course or ME 515.
    clauses: []
    noCreditWith:
      - ME|515
  - courseId: ME|5108
    description: "(2 credits) The course provides the theory and practice of computational fluid dynamics at an entry graduate level. Topics covered include: classification of partial differential equations (PDEs) in fluid dynamics and characteristics; finite difference schemes on structured grids; temporal discretization schemes; consistency, stability and error analysis of finite difference schemes; explicit and implicit finite differencing schemes for linear hyperbolic, parabolic, elliptic, and non-linear PDEs in fluid dynamics; direct and iterative solution methods for algebraic systems. The course requires completion of several projects using MATLAB."
    clauses: []
    noCreditWith: []
  - courseId: ME|5200
    description: The course provides fundamentals for vibration analysis of linear discrete and continuous dynamic systems, A vibrating system is first modeled mathematically as an initial value problem (IVP) or a boundary-initial value problem (BIVP) by the Newton-D’Alembert method and/or the Lagrange energy approach and then solved for various types of system. Explicit solutions for dynamic response of a linear single-degree-of-freedom (SDOF) system, both damped and undamped, is derived for free-vibration caused by the initial conditions and forced vibration caused by different excitations. Modal analysis is presented to solve for vibration response of both multi-degreeof-freedom (MDOF) systems and continuous systems with distributed parameters. As the basis of modal analysis, the natural frequencies and vibration modes of a linear dynamic system are obtained in advance by solving an associated generalized eigenvalue problem and the orthogonal properties of the vibration modes with respect to the stiffness and mass matrices are strictly proved. Computational methods for vibration analysis are introduced. Applications include but are not limited to cushion design of falling packages, vehicles traveling on a rough surface, multi-story building subjected to seismic and wind loading, and vibration analysis of bridges subjected to traffic loading. Students cannot receive credit for this course if they have taken the Special Topics (ME 593V) version of the same course or ME522.
    clauses: []
    noCreditWith:
      - ME|522
  - courseId: ME|5202
    description: "Basic concepts and general principles of classical kinematics and dynamics of particles, systems of particles and rigid bodies are presented with application to engineering problems with complicated three-dimensional kinematics and dynamics. Derivation of the governing equations of motion using Principle of Virtual Work and Lagrange equations is described together with the direct Newton approach. Applications include: swings-effect and its use in engineering, illustrating in particular limit cycles and their stability and reversed-swings control of vibrations of pendulum; various examples of gyroscopic effects; and especially introductory rotor dynamics including transverse vibrations (whirling) and potential instability of rotating shafts. Students cannot receive credit for this course if they have taken the Special Topics (ME 593D) version of the same cours"
    clauses: []
    noCreditWith: []
