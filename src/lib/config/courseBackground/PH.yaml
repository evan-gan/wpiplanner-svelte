    description: "Cat. II This course covers physics of the solar system and exo-planetary systems. Topics introduced will include the sun, moons and planets; the interplanetary space environment; gravitational interplay, planet atmospheres, surfaces and interiors; interplanetary travel, exploration and habitation; challenges of terraforming, comparison of planetary environments to Earth’s biosphere; and the conditions required to support life. Recommended background: a working knowledge of mechanics (PH 1110 or 1111), electrodynamics (PH 1120 or 1121), modern physics (PH 1130), and differential and integral calculus (MA 1021 and MA 1022).This course will be offered in 2020-21, and in alternating years thereafter."
