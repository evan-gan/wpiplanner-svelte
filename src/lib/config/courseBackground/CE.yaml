    description: "Cat. IFoundation engineering is a study of the applications of the principles of soil mechanics and structural theory to the analysis, design and construction of foundations for engineering works with the emphasis on the soil engineering aspects of soil structure interaction. Subsurface exploration techniques, design of rigid and flexible retaining structures, and design of, shallow and deep foundations are considered. Although the course deals mainly with aspects of the design of buildings and bridges, certain parts of the course (design of temporary trench bracing, for example) are very relevant to construction engineering.Recommended background: CE 3041.Suggested background: CE 3008."
