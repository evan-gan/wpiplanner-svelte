  - courseId: SP|3523
    description: "An introduction to various aspects of life in Latin American countries from early times to the present. Focusing on Latin America's social and political development, the course will reveal the unity and diversity that characterize contemporary Latin American culture. Typical topics for study include the Pre-Columbian civilizations and their cultural legacy, the conquistadores and the colonial period, the independence movements, the search for and the definition of American identity, the twentieth-century dictatorships, the move toward democracy, gender and race identities, religious practices, etc. This course satisfies the Inquiry Seminar to complete the HUA requirement in Spanish and would also count toward International and Global Studies and Latin American and Caribbean studies. In addition, this course would benefit students interested in WPI’s Project Centers in Latin America and the Caribbean. This course is taught at an advanced level of Spanish. This course will be offered in 2026-2027, and in alternating years thereafter. Recommended background: Intermediate Advanced Spanish I and II"
