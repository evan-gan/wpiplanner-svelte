  - courseId: BME|322X
    description: "This course introduces how artificial intelligence (AI) is used in biomedical engineering by examining clinically-relevant AI modules and end-to-end systems. The course emphasizes the engineering workflow required to build, validate, and communicate biomedical AI solutions that operate on biosignals (e.g., ECG, EMG, EEG), medical images (e.g., CT, MRI, ultrasound), and multimodal clinical datasets. Students will learn to implement and evaluate AI-enabled pipelines that produce actionable system outputs using a consistent schema across signals and imaging (e.g., risk_score, alarm, quality, and review_flag). Emphasis is placed on reproducibility, responsible validation, reliability (quality gating and human review workflows), and clear reporting, using hands-on laboratories and applied case studies relevant to digital health and clinical decision support. Case studies are educational and emphasize responsible evaluation, reporting, and workflow design rather than deployment in clinical care. The course is designed for junior-level undergraduate students in biomedical engineering and related fields who want practical, career-relevant skills in biomedical AI, computational medicine, and clinical translation. Recommended Background: General knowledge of: Undergraduate-level calculus (e.g., MA 1021/MA 1022, or equivalent) and basic linear algebra (e.g., MA 2071, or equivalent), introductory probability/statistics (e.g., MA 2610, MA 2611, or MA 2621, or equivalent), programming experience obtained through CS 1004, BME 1004, or equivalent. Prior exposure to biomedical data analysis, such as topics covered in BME 2211, is recommended."
