  - courseId: CH|4120
    description: "Cat. I Oriented around biological membranes, this course begins with a description of lipids and proteins forming biomembranes. Permeability and the mechanism of transmembrane mass transport are presented. Transport of electrons and redox equivalents is explained within the context of aerobic production of ATP and plant photosynthesis. Finally the transport of information across biomembranes in signal transduction and neurotransmission are discussed. Recommended background: Knowledge of organic chemistry fundamentals as well as concepts including protein structure and folding, catalytic mechanics, enzyme kinetics, and ATP synthesis and hydrolysis mechanisms. See CH 2310, BB 2550, and CH 4110 or equivalent."
