  - courseId: MA|2621
    description: "Cat. I This course is designed to introduce the student to probability. Topics to be covered are: basic probability theory including Bayes theorem; discrete and continuous random variables; special distributions including the Bernoulli, Binomial, Geometric, Poisson, Uniform, Normal, Exponential, Chisquare, Gamma, Weibull, and Beta distributions; multivariate distributions; conditional and marginal distributions; independence; expectation; transformations of univariate random variables. Recommended background: MA 1024."
