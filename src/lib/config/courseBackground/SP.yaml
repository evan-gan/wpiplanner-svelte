  - courseId: SP|2522
    description: Intermediate Spanish II will provide students with the structures, vocabulary, and cultural context to help them elevate their communication skills in Spanish from the intermediate to advanced levels. By interacting with authentic materials, students will be prepared to perform more complex and diverse linguistic tasks, such as interpreting and discussing literary and cultural readings, and short films to recognize and celebrate the contributions of artists, writers, and filmmakers to the cultural diversity of the Spanish-speaking world. Students will be able to use the language creatively in longer sentences to express preferences and opinions and exchange information in conversations and presentations. This course is closed to native speakers of Spanish and heritage speakers except with written permission from the instructor. Recommended background 2522
