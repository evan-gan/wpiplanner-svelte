department: INTL
entries:
  - courseId: INTL|2100
    description: Cat. I This course examines the major theoretical and methodological approaches that characterize global studies . Since the end of the Cold War, new forms of transnational integration, interdependence and conflict have been considered examples of globalization . Yet this period is not the first to undergo such transformation, and the “global” is often experienced in disparate ways around the world . This course examines the diverse ways of understanding globalization in the past and present . No prior background is required . Especially appropriate for students interested in any of WPI’s global Project Centers .
    clauses: []
    noCreditWith: []
  - courseId: INTL|2110
    description: "Cat. II What is justice during an era of globalization? What are the rights and responsibilities of individuals, groups, nations, or supranational organizations in a world of profound inequalities of wealth or disparities of power? This course takes an interdisciplinary approach to historical, literary, religious, and ethical debates about global justice as well as the political and practical responses by various actors in the global South and North. Themes will vary each time the course is taught and may include globalization and distributive justice, climate justice, migration, citizenship, cosmopolitanism, human rights, ideology, reparations, racial or gender equity, nationalism and internationalism, and global democracy. No prior background required. Recommended background: None. This course will be offered in 2020-21, and in alternating years thereafter."
    clauses: []
    noCreditWith: []
  - courseId: INTL|2210
    description: "TikTok, WeChat, Tai chi, anime, K-dramas, Hello Kitty, C-pop, yin and yang, Pokémon, manga. All of these have become part of global culture, but where did they come from and what meaning do they hold as cultural phenomena? In this class, we will explore topics in the popular cultures of East Asia to better understand the influences that have shaped the region’s contemporary societies and their cultures. Focus will be on one or a combination of the following: China, Japan, Taiwan, Hong Kong, or Korea. Students will study various media and genres of popular culture, which could include films, songs, dramas, advertisements, video games, manga, and anime, to explore the larger societal, political, and cultural issues behind them, situating popular culture within historical contexts, transnational currents, and exchanges when appropriate. Students may not receive credit for HU 2340 and INTL 2210. This course may be repeated for different topics. No prior knowledge of Asian history or culture is required for this class. This course will be offered in academic years ending in even numbers."
    clauses: []
    noCreditWith:
      - HU|2340
  - courseId: INTL|2320
    description: "Cat. II Latin America and the Caribbean are center stage in discussions about the inequalities and injustices of our current global ecological crisis. This course offers a two-fold approach. 1) It examines historical and contemporary processes producing—and contesting—environmental injustices in Latin America and the Caribbean Basin. 2) It analyzes the role of this region in the politics and policy of global environmental inequalities, including the region’s relationship with the United States, China, and other major international actors in issues such as climate change and sustainable development. This course is especially appropriate for students interested in environment and sustainability issues and international/global affairs, and for students who expect to complete their HUA, IQP, and/or MQP at WPI Project centers in Latin America or the Caribbean. Recommended background: None"
    clauses: []
    noCreditWith: []
  - courseId: INTL|2420
    description: "This interdisciplinary course takes a thematic approach to the Middle East, North Africa and Mediterranean region. Themes and topics will vary each time the course is taught, and may include religion and culture, national, ethnic and linguistic identities, the Mediterranean as a contact zone, U.S. political and economic involvement in the region, postcolonialism, war and conflict, migration, forced displacement and refugees, human rights, religious freedom, popular culture, the politics of Islam and secularism, the regional intersections of Judaism, Christianity, and Islam, representations of Islam and other religions in visual culture, gender and media, and the circulation of U.S. culture. Examples and case studies will include locations where WPI has programs in this diverse and dynamic region. No prior background required. Recommended background: None. This course will be offered in academic years ending in even numbers."
    clauses: []
    noCreditWith: []
  - courseId: INTL|2510
    description: "Cat. II This interdisciplinary course takes a thematic approach to contemporary Europe, especially since the establishment of European Union’s single market and common currency. Topics and themes will vary each time the course is taught and may include expansion of the EU and Euro, the impact of the free movement of goods, capital, services and people, migration and refugees, populist and nationalist movements, uneven development between regions within Europe, postcolonial relations with other parts of the world, and debates over national heritage and cultural change. Examples and case studies will include locations where WPI has programs in Europe. No prior background is required. Recommended background: None. This course will be offered in 2020-21, and in alternating years thereafter."
    clauses: []
    noCreditWith: []
  - courseId: INTL|2910
    description: "INTL 2910: Topics in Global Studies (Cat. I) This seminar course takes an interdisciplinary approach to historical and contemporary topics in global studies. Topics vary each year and may include international development, global inequality and justice, global public health, war and terrorism, international organizations and governance, humanitarianism and human rights, travel and tourism, the Anthropocene, climate change. This course may be repeated for different topics . No prior background is required. Especially appropriate for students interested in any of WPI’s global Project Centers."
    clauses: []
    noCreditWith: []
