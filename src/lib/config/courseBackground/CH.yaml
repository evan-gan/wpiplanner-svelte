  - courseId: CH|516
    description: We will establish fundamental principles of both light-matter interactions and electron spectroscopies. Emphases include rotational, vibrational, and electronic spectroscopies, photoelectron spectroscopies, near-field versus far-field methods, lab versus synchrotron methods, and practical applications.
