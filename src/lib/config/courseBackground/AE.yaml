  - courseId: AE|4510
    description: "This course introduces students to design of aircraft systems. Students complete a conceptual design of an aircraft in a term-long project. Students are exposed to the aircraft design process, and must establish design specifications, develop and analyze alternative designs, and optimize their designs to meet mission requirements. Students work together in teams to apply material learned in the areas of aerodynamics, aerospace materials, structures, propulsion, flight mechanics, and stability and control, to the preliminary design of an aircraft. The project requirements are selected to reflect real-life aircraft mission requirements, and teams are required to design systems which incorporate appropriate engineering standards and multiple realistic constraints. The teams present their design in a final report and oral presentation. Recommended background: aerodynamics (AE 3120 or equivalent), aerospace structures (AE 3420 or equivalent), air breathing propulsion (AE 4210 or equivalent), aircraft dynamics and control (AE 4310 or equivalent). Students may not receive credit for both AE 4510 and AE 4770."
