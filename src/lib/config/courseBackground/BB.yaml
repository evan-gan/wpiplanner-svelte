  - courseId: BB|4900
    description: "BB 4900 Advanced Topics in Biology and Biotechnology (Cat. I; 1/3 unit) These classes will serve as integrative experiences for students majoring in Biology & Biotechnology. The course will help students integrate concepts from other courses in the curriculum, practice skills of critical analysis, and evaluate and communicate scientific information effectively. The specific theme of each offering will center around a current topic of biological interest, and may include such areas as genomics, cancer, environmental problems, and synthetic biology. Recommended Background: Prior to enrolling in the course, a student should have completed all of the BB course distribution requirements for BBT majors at the 1000 and 2000 level, or should seek advice from the course instructor. Topics will be announced prior to registration in the year preceding the course offering. Only one offering of BB 4900 can count toward BBT major distribution requirements, although additional offerings may be taken as free electives."
