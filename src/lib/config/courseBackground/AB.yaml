  - courseId: AB|1533
    description: "Cat. I This course is a continuation of AB 1532. Emphasis will be on building and strengthening receptive and productive skills in both Modern Standard Arabic and Darija, the Arabic dialect spoken in Morocco. Grammatical structures covered in the previous courses along with new structures will be part of class activities as well as homework assignments. Cultural aspects of Arabic-speaking countries will be introduced through course materials including commonly used vocabulary and expressions. Recommended background: AB1531 & AB1532 or instructor approval; this course is closed to native speakers of Arabic and heritage speakers except with written permission from the instructor."
