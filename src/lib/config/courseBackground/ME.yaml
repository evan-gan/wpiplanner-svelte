  - courseId: ME|500
    description: "The emphasis of this course is on the modeling of physical phenomena encountered in typical engineering problems, and on interpreting solutions in terms of the governing physics. In this manner, the course will expose students to a range of techniques that are useful to practicing engineers and researchers. Physical examples will be drawn from fluid mechanics, dynamics, stability problems, and structural mechanics. The course will introduce analytical techniques as they are required to study such phenomena. Depending on the examples chosen, the techniques covered may include partial differential equations, power series, Fourier series, Fourier integrals, including cases of sustained nonperiodic processes which require incorporating probabilistic approach into dynamics, Green’s Functions, Sturm-Liouville theory and linear algebra. (Prerequisites: differential equations at the undergraduate level.) Students cannot receive credit for this course if they have taken ME 5000."
    clauses: []
    noCreditWith: []
  - courseId: ME|514
    description: "This course is an introduction to graduate-level fluid dynamics. Specific learning outcomes include deriving and understanding the governing equations of fluid mechanics; applying basic equations of fluid motion to understand inviscid fluids, Newtonian fluids, and incompressible fluids; analyzing potential flows using stream functions and potential functions; deriving exact solutions of fluid equations for special flow cases; and introducing the concept of boundary layers and deriving similarity solutions for boundary layer equations. (Prerequisites: undergraduate-level fluid dynamics.) Students cannot receive credit for this course if they have received credit for AE/ME 5101 or AE/ME 5107."
    clauses: []
    noCreditWith: []
  - courseId: ME|516
    description: "Review of governing differential equations and boundary conditions for heat transfer analysis. Multidimensional and unsteady conduction, including effects of variable material properties. Analytical and numerical solution methods. Forced and free convection with laminar and turbulent flow in internal and external flows. Characteristics of radiant energy spectra and radiative properties of surfaces. Radiative heat transfer in absorbing and emitting media. Systems with combined conduction, convection and radiation. Condensation, evaporation, and boiling phenomena. (Prerequisite: Background in thermodynamics, fluid dynamics, ordinary and partial differential equations, and basic undergraduate physics.)"
