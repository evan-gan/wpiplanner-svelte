  - courseId: CH|3520
    description: "CH 3520 Fundamentals of Applying Mathematical Methods in Chemistry and Biochemistry (Units: 1/3; Cat. II) In this course, selected mathematical methods (such as group theory, Fourier transform, and integration techniques) are used to solve problems in chemistry and biochemistry. The emphasis is not on complete coverage of any specific traditional teaching subject, but rather on the ways each technique can be applied in more than one direction. The main focus is placed on problems relevant in such generally important areas as kinetics and spectroscopy. Students who received credit for the experimental course CH352X are not eligible to receive credit for the permanent course CH 3520. Recommended background: Chemical Thermodynamics and Calculus I – IV or equivalent courses. Anticipated Instructor: Prof. George Kaminsk"
