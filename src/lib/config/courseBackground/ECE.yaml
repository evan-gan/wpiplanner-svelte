  - courseId: ECE|3501
    description: "Cat. I This course is designed to provide a cohesive presentation of the principles of electric energy conversion for industrial applications and design. The generation, transmission and conversion of electric energy, as well as basic instrumentation and equipment associated with electric energy flow and conversion are analyzed. Topics: Review of poly-phase circuits. Transducers and instrumentation for power and energy measurements. Rotating machines. Electromechanical transients and stability. Switchgear equipment. Selected laboratory experiments. Recommended background: ECE 2019."
