department: IMGD
entries:
  - courseId: IMGD|174X
    description: This course introduces students to the fundamental principles of three-dimensional visual organization through contemporary 3D modeling practices. Students will explore the technological foundations of digital modeling, including 3D scanning, retopology, UV mapping, and prop modeling. The course emphasizes visual perception, graphic expression, and rendering within digital environments. Students gain hands-on experience with industry tools while learning to create and manipulate digital assets suitable for games, 3D printing, interactive media, animation, and visual storytelling. Core skills include modeling, shading, and the presentation of visual ideas through 3D forms. The course also highlights current sculpting, modeling, and workflow technologies, preparing students to adapt to evolving tools and practices in digital art and design. By the end of the course, students will understand how to create shaders, work in 3D dimensional space, have foundational design principles, and develop their ability to translate concepts into digital form. Recommended Background No prerequisites are suggested or recommended
    clauses: []
    noCreditWith: []
  - courseId: IMGD|2000
    description: "Cat I (1/3 units) - This course reinforces critical examination of the spread of ideas and practices through various media, guiding students in explorations of diverse perspectives on political, social, and economic agendas. Games and other interactive media are inherently political and serve as platforms for the creation of cultural identities, social mobilization, and economic ideologies. The course analyzes positive and negative effects of interactive mediums on society with an emphasis on responsibilities of designers and developers. Recommended background: Experience critiquing interactive media and games (IMGD 1000)"
