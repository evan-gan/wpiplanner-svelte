    description: "RBE 4601 Human Factors and Human-Robot Interface This is an introductory course on human-robot interaction. It will introduce the behavior and preference of human motor control and motor learning, and how they influence the design of human-robot interface and the dynamics of human-robot interaction. Students will also learn how to conduct human movement studies and social science studies for the design and evaluation of human-robot interfaces. Students in this course will work on interdisciplinary projects, which may involve working with experts in robotics, social science, nursing, and education. Recommended Background: RBE 1001, RBE 3100"
