    description: Cat. I The Glee Club is one of WPI’s choral ensembles and the oldest student organization on campus. Glee Club performs many styles and periods of the vast repertoire of music featuring tenor and bass voices. Several times each year the Glee Club and Alden Voices (soprano and alto voices) join forces as the WPI Festival Chorus to perform major works of the repertoire. The Glee Club regularly performs on campus, throughout the Worcester area, and takes international and domestic tours. Rehearsals are held weekly. No audition is required. The course is open to all who are interested and sing in the tenor and bass range.
