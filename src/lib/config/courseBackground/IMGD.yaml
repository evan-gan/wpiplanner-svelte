  - courseId: IMGD|3100
    description: "Cat. II This course focuses on the design and evaluation of novel user interfaces that provide greater input and output expressiveness than the keyboard, mouse, or game pad. The course covers the related applications of immersive gaming, teleoperated robotics, and mobile users. Input sensors, such as those providing motion, attitude, and pressure data, are used to explore novel input methods, and how they may be effectively used to design innovative experiences. Through a combination of lecture and hands-on work, students learn to build prototype systems and to critically evaluate different alternatives. Students are expected to program several alternative input/output systems as part of this course. Recommended Background: IMGD 1001, and either CS 2301 or CS 2303 . This course will be offered in 2015-16, and in alternating years thereafter."
