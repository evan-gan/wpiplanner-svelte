  - courseId: RBE|510
    description: "RBE 510. Multi-Robot Systems (2 credits) This course covers the foundation and principles of multi-robot systems. The course will cover the development of the field and provide an overview of different control architectures (centralized, decentralized, distributed, and hybrid), control topologies, and system configurations (cellular automata, modular robotic systems, mobile sensor networks, swarms, heterogeneous systems). Topics may include, but are not limited to, multirobot control and connectivity, path planning and localization, sensor fusion and robot informatics, task-level control, communication protocols, distributed decision-making, and robot software system design and implementation. Prerequisites: RBE 502 or equivalent, Linear algebra, differential equations, and mature programming skills, or consent of the instructor."
