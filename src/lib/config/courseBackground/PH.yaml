  - courseId: PH|3401
    description: "Cat. I This course includes a study of the basic postulates of quantum mechanics, its mathematical language and applications to one-dimensional problems. The course is recommended for physics majors and other students whose future work will involve the application of quantum mechanics. Topics include wave packets, the uncertainty principle, introduction to operator algebra, application of the Schroedinger equation to the simple harmonic oscillator, barrier penetration and potential wells. Recommended background: Junior standing, MA 4451, and completion of the introductory physics sequence, including the introduction to the 20th century physics. Suggested background: knowledge (or concurrent study) of linear algebra, Fourier series, and Fourier transforms."
