  - courseId: WR|2500
    description: "Cat. II Writing in the Life Sciences will provide students with an introduction to academic writing within the disciplines that comprise the Life Sciences. Topics will include: • Ethics and research integrity as it pertains to research design, documentation, reporting, and communicating results to specialist and non-specialist audiences • Fundamentals of writing in the Life Sciences including definitions and technical vocabulary, technical style, documentation, revising and editing • Human factors that influence health including social determinants of health and health disparities • Important documents in the Life Sciences including literature reviews and synopses, laboratory reports, proposals, and research presentations. The course will also include writing for non-specialist audiences and newer methods of science communication including social media. Students may not receive credit for both WR 2500 and WR 250X. Recommended background: One introductory course (1000 level) in professional writing in which students have translated scientific writing for diverse audiences (e.g.: WR 1011, Writing about Science & Technology). Foundational life sciences courses with emphasis in anatomy and physiology are also recommended."
