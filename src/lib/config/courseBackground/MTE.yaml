  - courseId: MTE|5847
    description: "(2 credits) An introductory course on electrochemical engineering, fuel cells and batteries. With escalating oil prices and increasing environmental concerns, increasing attention is being paid to the development of electrochemical devices to replace traditional energy. Here several types of batteries and fuel cells will be discussed. Topics covered include: basic electrochemistry, lithium ion battery, proton exchange membrane fuel cell, solid oxide fuel cell, electrochemical method. Recommended background: ES2001 or equivalent. Note: Students cannot receive credit for this course if they have taken the Special Topics version of the same course."
    clauses:
