  - courseId: HI|1314
    description: Cat. IAn introduction to historical analysis through selected periods or themes in thehistory of America before the Civil War. A variety of readings will reflect thevarious ways that historians have attempted to understand the development ofAmerica.
    clauses: []
    noCreditWith: []
  - courseId: HI|2310
    description: Cat. I This course surveys the interplay of social, economic, demographic, political and cultural forces in shaping the growth, decline and occasional rebirth of urban spaces. Emphasis is placed upon building chronological narratives while attending to the themes, approaches, and sources historians use to reconstruct the tangled infrastructures, stratified economies, segregated spaces and political/administrative structures of cities. Geographies will vary across sections and topics may include Industrializing Cities, Race and Urban Space, Post-Industrial Cities, Urban Technological Infrastructures, or Social Justice in the City. Students can receive credit only once for HI 2310.
    clauses: []
    noCreditWith: []
  - courseId: HI|2313
    description: Cat. IThis course surveys American history from the Presidency of George Washington to the Civil War and its aftermath. Topics include the rise of American democracy, the emergence of middle-class culture, and the forces that pulled apart the Union and struggled to put it back together.
    clauses: []
    noCreditWith: []
  - courseId: HI|2314
    description: Cat. IThis course surveys the transformation of the United States into an urban and industrial nation. Topics will include changes in the organization of business and labor, immigration and the development of cities, the peripheral role of theSouth and West in the industrial economy, politics and government in the age of "laissez-faire," and the diverse sources and nature of late 19th- and early 20th century reform movements.
    clauses: []
    noCreditWith: []
  - courseId: HI|2315
    description: Cat I. This course surveys the major political, social, and economic changes of American history from 1920 to the present. Emphasis will be placed on the Great Depression, the New Deal, suburbanization, McCarthyism, the persistence of poverty, the domestic effects of the Vietnam war, and recent demographic trends.
    clauses: []
    noCreditWith: []
