  - courseId: CE|590
    description: "Individual investigations or studies of any phase of civil engineering as may be selected by the student and approved by the faculty member who supervises the work. This course introduces students to principles and practices of bridge design and construction. The course covers aspects of structural engineering, materials science, geotechnical principles, construction management, all with a focus on the design of bridges that are safe, cost-effective, and durable. Students will explore bridge types, load distribution methods, material selection, foundation systems, and safety considerations. Students will learn how to apply fundamental design principles to create functional and efficient bridge structures while considering factors such as site conditions, environmental impacts, and construction constraints. Prerequisites: Students enrolling in this course should have earned a Bachelor of Science in Civil Engineering. Students must seek instructor approval based on relevant professional experience or equivalent academic backgroundI"
