  - courseId: BB|3080
    description: "BB 3080 Neurobiology (Cat. I; 1/3 unit) The nervous system underlies every aspect of our behavior, including sensation, movement, emotion, and cognition. In this course, students will develop an understanding of neurobiology at several levels, from the physiology of individual neurons, through the functioning of neural circuits, and finally to the behavior of neural systems such as vision, motion, and memory. The class will be based on lectures accompanied by in-class activities and will include weekly discussion of a paper from the scientific literature. Each year, the class papers will focus on a guiding theme, (e.g. neurotransmitter systems) with emphasis on research that is relevant for human health such as neurodevelopmental conditions (e.g. autism), psychiatric disorders (e.g. schizophrenia), addiction, or neurodegenerative diseases (e.g. Parkinson’s, ALS, Alzheimer’s, etc.). Recommended background: A working knowledge of concepts in cell biology (BB 2550 or equivalent), genetics or molecular biology (BB2920, BB3950 or equivalent), and physiology (BB 2101 or equivalent)."
