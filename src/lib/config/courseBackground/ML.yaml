department: ML
entries:
  - courseId: ML|1012
    description: Cat. I (1/9 unit after completion of 1011 and 1012) This course continues the studies begun in ML 1011. Students make oral presentations on the elements of leadership, enhancing effective communication. Students begin to develop leadership potential by instilling self-confidence and fostering teamwork through basic survival techniques (e.g., water survival). Participation in weekly training leadership laboratories; off campus training sessions (field training exercises) and other special events is required.
    clauses: []
    noCreditWith: []
  - courseId: ML|1021
    description: "Cat. I (0 units w/grade) ML 1021 expands upon the fundamentals introduced in the previous term by focusing on communications, leadership, and problem solving. “Life skills” lessons in this semester include: problem solving, goal setting, interpersonal communication skills, and assertiveness skills. Participation in weekly training leadership laboratories; off campus training sessions (field training exercises) and other special events is required."
    clauses: []
    noCreditWith: []
  - courseId: ML|1022
    description: Cat. I (1/9 unit after completion of 1021 and 1022) ML 1022 continues by providing cadets with interesting lessons yielding immediately useful skills. The course also gives accurate information about life in the Army, including the organization of the Army, employment benefits, and work experiences of junior officers. Participation in weekly training leadership laboratories; off campus training sessions (field training exercises) and other special events is required.
    clauses: []
    noCreditWith: []
  - courseId: ML|2012
    description: "Cat. I (1/12 unit) The curriculum focuses on building character. Where years one, three and four focus on mastering definitions, concepts, ideas and principles, year two focuses on direct, physical experiences. Year two centers on giving cadets the opportunity to apply, practice and experience leadership principles. Cadets are asked to reflect upon their actions and those of others. Participation in weekly training leadership laboratories; off campus training sessions (field training exercises) and other special events is required. Recommended background: ML 2011"
