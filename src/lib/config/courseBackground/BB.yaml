  - courseId: BB|1801
    description: "BB 1801 Foundations of Biology and Biotechnology Laboratory (Cat. I; 1/3 unit) This course will provide a foundational experience by exposing students to how research questions are identified and addressed via biological experimentation. Importantly, the lab will also serve as a unifying experience for biology majors, providing a framework that will allow them to identify as contributing members of a scientific community. This lab will convey the breadth of biological systems from organismal to molecular scales, and the overarching principles of evolution and effects of environment on behavior. Focus areas may include how resistance to antibiotics arises, how ecosystems and organisms are adversely affected by pollution, and how experiments can be designed to identify strategies to overcome global problems. This introductory biology lab experience is intended for first-year Biology & Biotechnology majors, and anyone intending to take 3800 level biology laboratories. Recommended background: High school biology. No previous laboratory experience is assumed."
