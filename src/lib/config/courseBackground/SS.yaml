  - courseId: SS|1505
    description: "Cat. I This course addresses the theory and practice of developing solutions to complex social and environmental problems through interaction with roleplaying games and computer simulations designed to promote learning and improve decision-making. By interacting with a selection of games and case studies, students will learn to recognize the systemic causes of complex social and environmental problems and gain experience developing and using simulations to test policies for creating sustainable futures. Special attention will be given to appropriate modeling practices and the design of simulation experiments. The course is run in a laboratory format in which students work in groups to play games, develop simulation models and present them to the class for feedback before they revise and refine their work iteratively for final evaluation. Recommended background: None Students who completed SS150X cannot receive credit for SS1505."
    clauses: []
    noCreditWith:
      - SS|150X
  - courseId: SS|3043
    description: "Cat. I This course makes the student aware of the social, moral, ethical, and philosophical impact of computers and computer-based systems on society, both now and in the future. Topics include major computer-based applications and their impact, human machine relationships, and the major problems of controlling the use of computers. Students will be expected to contribute to classroom discussions and to complete a number of significant writing assignments. This course is recommended for juniors and seniors. The Social Science Requirement cannot be satisfied by this course. Undergraduate credit may not be earned both for this course and for CS 505. Recommended background: a general knowledge of computers and computer systems"
