  - courseId: WPE|1099
    description: Cat. I (1/12 unit) In each term, specific PE courses are offered to provide a variety of wellness, dance and healthy alternatives to traditional PE sport-based classes . The specific courses are subject to change on a yearly basis in order to provide flexibility in the PE offerings based upon the latest trends in wellness and dance . The focus of these classes is more on individual fitness, wellness and education, with instruction provided to all students in the classes.
    clauses: []
    noCreditWith: []
  - courseId: WPE|1221
    description: Cat. I Running is an activity that helps to develop good health, well-being and discipline through goal setting. This club and course will offer runners of all levels the opportunity to participate, develop and learn how running can benefit them now and into the future.
    clauses: []
    noCreditWith: []
  - courseId: WPE|1601
    description: "WPE 1601: Insight Program. Cat I (1/12 unit) The Insight Program provides students with skills, knowledge, and experiences that help them thrive in their transition to WPI. In collaboration with their Insight Team, students create a personalized first year experience that incorporates relationship building with their Insight Advisor as well as programmatic participation in five key areas: Academic Growth, Personal Development, Mental Health and Well Being, Diversity, Equity, and Belonging, and Social Engagement"
    clauses: []
    noCreditWith: []
  - courseId: WPE|1610
    description: "WPE 1610: Approaches to Holistic Well-Being Cat. I (1/12 Units) Introductory course designed to acquaint students with knowledge and skills necessary to make choices that foster health and well-being."
    clauses: []
    noCreditWith: []
  - courseId: WPE|1611
    description: WPE 1611 Introduction to Mindfulness (Cat. I, 1/12 unit) Introduction to Mindfulness is an evidence-based mindfulness curriculum designed for college aged adults by the Mindfulness Institute for Emerging Adults (MIEA). During this course, you will learn useful, practical tools to help manage your stress and increase self-compassion. Students will practice a variety of meditation skills, engage with the MIEA Mobile App, read the companion book, and participate in class discussion.
    clauses: []
    noCreditWith: []
  - courseId: WPE|1612
    description: WPE 1612 Introductory Yoga Cat. I (1/12 unit) This yoga class focuses on connecting the mind, body, and spirit through an awareness of breath. Participating in yoga can improve core strength, flexibility, balance, mindfulness, and relaxation and decrease stress. Those with any level of yoga experience (including first timers) are welcome.
    clauses: []
    noCreditWith: []
  - courseId: WPE|1613
    description: "WPE 1613: Succeeding as an Introvert (Pass/NR; 1/12units; Cat I) Does spending time in crowds or at a party wear you out? Do you enjoy time alone? Does the thought of working on a team make you nervous? Are you quiet around your classmates? Do you tend to avoid small talk or get tongue-tied in large groups? Would you rather think about a problem than discuss it with others? If you answered “yes” to several of these questions, this course is for you. Society puts a strong emphasis on extroversion, and those who frequently speak up get more attention and often advance professionally more quickly than their more reserved peers. Yet some of our greatest thinkers and leaders have been introverts. While the teamwork culture of WPI and most professions can present challenges to introverts, career success depends on the ability to work with others. This course will help introverted students learn to thrive at college and throughout their careers. Students will learn about the nature of introversion, including the strengths and challenges of being an introvert. Students will also learn personal and professional skills, such as how to successfully work on a team, present to an audience, manage their energy levels, and have difficult conversations with others. Grades will be Pass/NR."
    clauses: []
    noCreditWith: []
  - courseId: WPE|1699
    description: WPE 1699 Special Topics in Holistic Well-Being, Cat. I (1/12 unit) This course provides an opportunity for students to learn about a special topic in holistic wellbeing. The topics are subject to change on a rotating basis to provide flexibility in the offerings based upon student interest and the latest practice and science of well-being.
    clauses: []
    noCreditWith: []
