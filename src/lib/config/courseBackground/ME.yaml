  - courseId: ME|4821
    description: "Cat. II This course develops the processing, structure, property, performance relationships in plastic materials. The topics covered include polymerization processes, chain structure and configuration, molecular weights and distributions, amorphous and crystalline states and glass-rubber transition. The principles of various processing techniques including injection molding, extrusion, blow molding, thermoforming and calendaring will be discussed. The physical and mechanical properties of polymers and polymer melts will be described with specific attention to rheology and viscoelasticity. Pertinent issues related to environmental degradation and recyclability will be highlighted. Recommended Background: ES 2001 or equivalent. This course will be offered in 2019-20, and in alternating years thereafter."
