  - courseId: MKT|3640
    description: "Cat. I This course is based on the hypothesis that high performance firms depend on a sustainable pattern of new and innovative processes and products. Successful companies are examined in regard to their strategies for innovation and technology transfer. Technology alliances among industry, universities, and government are considered in order to increase the leverage of the individual firm. Benchmarking and commercialization from research to actualization is discussed through cases and examples. Recommended background: BUS 2070 or OIE 2850."
