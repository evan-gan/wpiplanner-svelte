    description: "Machine Learning has proven immensely effective in a diverse set of applications. This trend has reached a new high with the application of Deep Learning virtually in any application domain. This course studies the applications of Machine Learning in the sub domain of Cybersecurity by introducing a plethora of case studies including anomaly detection in networks and computing, side-channel analysis, user authentication and biometrics, etc. These case studies are discussed in detail in class, and further examples of potential applications of Machine Learning techniques including Deep Learning are outlined. The course has a strong hands-on component, i.e., students are given datasets of specific security applications and are required to perform simulations. Recommended Background: basic knowledge of machine learning techniques (e.g. regression, support vector machines, clustering algorithms, and neural networks). Cat I"
