  - courseId: AR|1100
    description: Cat. IThis course provides an introduction to the basic principles of two and three-dimensionalvisual organization. The course focuses on graphic expression, ideadevelopment, and visual literacy. Students will be expected to master basicrendering skills, perspective drawing, concept art, and storyboarding throughtraditional and/or computer-based tools.
    clauses: []
    noCreditWith: []
  - courseId: AR|1111
    description: Cat. I How do we understand a work of art? Through readings and the study of objects at the Worcester Art Museum, the student will survey the major developments in world art and be introduced to various critical perspectives in art history. Students will learn how art historians work with primary materials and formulate arguments. No previous knowledge of art is required. (Formerly HU 1014.)
    clauses: []
    noCreditWith: []
  - courseId: AR|2111
    description: "The successive phases of modern art, especially painting, are examined in light of the late-19th-century break with the 600-year old tradition of representation. Topics covered include: non-objective art and abstraction—theory and practice, primitivism in modern art, surrealism and the irrational, the impact of photography on modern painting, cubism and collage, regionalism and abstract expressionism as American art forms, Pop art and popular culture, and the problem of concept versus representation in art. (Formerly AR 2300.)"
    clauses: []
    noCreditWith: []
  - courseId: AR|2114
    description: This course studies, in a non-technical way, America’s buildings and places, in the context of world architecture in modern times. The history of American architecture was shaped by the forces that shaped America, from its political emergence in the eighteenth century to the post-9/11 era. These forces include dreams of social and spiritual perfection; a tight and conflicted relation with nature; and the rise and spread of industrial capitalism. The same forces created the Modern Movement in architecture. How are modernism and American architecture interrelated? Illustrated lectures, films, and tours of Worcester architecture explore the question while training students in the methods of architectural history and criticism. Students who have taken AR 2113, Topics in 19th- and 20th-Century Architecture, since the 2000-2001 academic year MAY NOT take AR 2114 for credit.
    clauses: []
    noCreditWith:
      - AR|2113
  - courseId: AR|2301
    description: "This course introduces design principles and their application to create effective forms of graphic communication. The students will learn the fundamentals of visual communication and will work on projects to analyze, organize, and solve design problems. Topics may include: the design process; figure/ground; shape; dynamic balance; Gestalt principles; typography; layout and composition; color; production and presentation in digital formats."
    clauses: []
    noCreditWith: []
  - courseId: AR|2750
    description: Explore how art and science might overlap by combining engineering principles with traditional sculpture and 3D design. Use readily available technology like hobby motors, LEDs, and microcontrollers to produce new works that whir, sway, spin, stagger, cast shadows, and scatter light. Utilizing various materials like foam core, wire, string, plastic containers, wood, and acrylic paint, students will prototype new designs for kinetic and robotic sculptures. The course will examine kinetic art history and theory, mechanical engineering, and electronics with the goal of solving conceptual, aesthetic, and technical problems.
    clauses: []
    noCreditWith: []
  - courseId: AR|3112
    description: "What is the role of art to be in the modern world? Can art be a vehicle for social change, or should art be a self-critical discipline that pursues primarily aesthetic ends? What is the relationship between art and mass culture? Using primary sources, this course focuses on some of the theorists and artistic trends since the mid-nineteenth century that have sought to resolve this dilemma. These include: Ruskin, Morris and the Arts and Crafts Movement; Art for Art’s Sake; the German Werkbund and the Bauhaus; American industrial design"
    clauses: []
    noCreditWith: []
