    description: "Cat. II This course provides an understanding of fundamental principles of various biomedical imaging modalities as well as computational image analysis. Topics include: light microscopy, computed tomography, magnetic resonance imaging, computational image analysis, and review of computer vision theory and the relevant principles of physics. Course work uses examples from light microscopy, computed tomography, X-ray radiography, and magnetic resonance imaging. Familiarity with a high-level programming language is recommended. This course will be offered in 2020-21, and in alternating years thereafter."
