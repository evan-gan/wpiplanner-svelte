  - courseId: BCB|555
    description: This course is offered every other semester, discussing topics on quantitative cell biology that advance our understanding of the function of cellular systems. The focus is on reading, presenting, and discussing the most recent literature in the field. Graduate students and advanced undergraduate students with an interest in quantitative biology are encouraged to participate. Topics covered change with each offering of this course and students may register and receive credit for more than one offering.
