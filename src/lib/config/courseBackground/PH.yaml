  - courseId: PH|2601
    description: "Cat. II This course provides an experimental approach to concepts covered in Photonics (PH 2501), Lasers (PH 2502), and Optics (PH 3504). Through a series of individually tailored experiments, students will reinforce their knowledge in one or more of these areas, while at the same time gaining exposure to modern photonics laboratory equipment. Experiments available include properties of optical fibers, optical fiber diagnostics, optical communications systems, properties of photodetectors, mode structure and threshold behavior of lasers, coherence properties of laser light, characterization of fiber amplifiers, diffraction of light, polarization of light, interferometry. Recommended background: PH 1110/1111, PH 1120/1121. PH 1130, PH 1140, and one or more of the courses PH 2501, PH 2502, or PH 3504. No prior laboratory background is expected. This course will be offered in 2020-21, and in alternating years thereafter."
