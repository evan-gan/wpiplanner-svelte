  - courseId: EDU|580
    description: This course guides educators through the shift toward student-centered science teaching & learning, where students ‘figure-out' and explain a real-world phenomenon, as well as the implementation of high-quality instructional materials (HQIM). Throughout the course, participants will experience the different routines & pedagogies associated with the storyline model of teaching science, as well as work with colleagues to review a grade-specific storyline-based unit and plan for adaptation or implementation in their classrooms. (3 credits) This is a graduate credit extension course for science teachers, available *only* to teachers who completed the Storyline/OpenSciED Launch training during summer or fall 2026.
    clauses:
      - strength: required
