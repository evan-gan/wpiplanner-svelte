  - courseId: AR|3700
    description: "Cat. I This course covers drawing as it applies to concept art and illustration. The course begins with study of a human model and representational drawing. Following this, students work on drawing from the mind and applying the lessons learned from the figure drawing to creating concept art and illustration. Topics covered are shape recognition and recalling, inventing from the mind, creative starters, study of form and light, visual composition and developing a personal approach, working with individual strengths to create a compelling visual design. Students create a series of concept art exercises and apply these skills towards a personal project of their own. Recommended background: AR 2202, IMGD/AR 2700"
