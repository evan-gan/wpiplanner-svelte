  - courseId: WR|4500
    description: "WR 4500 Senior Seminar in Writing and Rhetoric Category I The Senior Seminar engages students more deeply with questions that arise from their study of writing, rhetoric, and communication. It may include an exploration of current research in the instructor's area of specialization, emphasizing theoretical and methodological issues. While each seminar focuses on a thematic inquiry and interpretive problem, students will be able to develop general skills that connect the study of writing and rhetoric to their long-term intellectual aspirations after graduation. This course is required for Professional Writing majors, who should enroll during their senior year, and is optional for Writing and Rhetoric minors. Recommended Background: WR 2111 Designing Effective and Ethical Research Studies and WR 3112 Rhetorical Theory, or equivalent."
