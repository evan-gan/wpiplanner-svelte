  - courseId: BB|3830
    description: "BB 3830 Immunotherapies Laboratory (Cat. I; 1/3 unit) The clinical use of monoclonal antibodies as human therapeutics represents an increasingly popular and promising application. Beginning with a hybridoma cell line and using a discovery-based approach, students in this course will explore the processes involved in the production and purification of monoclonal antibodies. Using cells in culture to produce the antibody, students will explore the efficacy and cost of a purification scheme involving separation techniques such as ion exchange and affinity chromatography to produce a purified product. Purification will be assessed using typical analytical techniques such as spectroscopy, electrophoresis, and immunological methods. Recommended background: a working knowledge of laboratory skills in protein purification (BB 2802 and BB 1801, or equivalent) and concepts in cell biology (BB 2550 or equivalent) and biochemistry (CH 4110 or equivalent). Some knowledge of immunology may be beneficial. Students may not receive credit for this course and BB 3530."
