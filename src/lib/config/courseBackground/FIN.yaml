  - courseId: FIN|540
    description: FIN 540 Financial Analytics (3 credits) The course introduces advanced methodological tools required for conducting finance and investment analysis research. The course aims to equip students with a working knowledge of important econometric techniques used in financial economics, such as event study, advanced time series analysis, and survival analysis. Substantial emphasis will be placed on developing programming skills in computer programs. The course emphasizes understanding and learning how to apply practitioners' econometric tools in these areas. Students will also cover the basic theory of statistical inference with linear models, general linear models, Heteroskedasticity 4 models, time series models, analysis of variance, discriminate analysis, factor analysis, and nonparametric tests.
    clauses: []
    noCreditWith: []
  - courseId: FIN|1250
    description: "Cat. I This course is designed to help the student make well-informed judgments when faced with personal financial decisions. Such decisions are growing in number and complexity, and both individuals and families need a considerable degree of financial expertise in order to utilize optimally their limited incomes. Principal topics include: insurance (medical, life, automobile and disability), consumer credit, estate planning, taxation, personal investments (real estate, securities, etc.), social security legislation and personal financial planning."
    clauses: []
    noCreditWith: []
  - courseId: FIN|500
    description: This course develops expertise in financial decision-making by focusing on frequently used financial accounting information and the conceptual framework for managing financial problems. Students are introduced to the accounting and financial concepts, principles and methods for preparing, analyzing and evaluating financial information, for the purpose of managing financial resources of a business enterprise and investment decisions. The course adopts a decision-maker perspective by emphasizing the relations among financial data, their underlying economic events, and corporate finance issues. The course provides an overview of the financial reporting system, to enable data analysts in building queries for financial analyses and in forecasting possible future financial scenarios.
    clauses: []
    noCreditWith: []
  - courseId: FIN|510
    description: Business Applications of Blockchain Technology provides students with a foundation of blockchain technology examining its applications across various disciplines such as engineering, law, and economics. Throughout the course, students will delve into diverse blockchain and distributed ledger technologies, popular cryptocurrencies such as Bitcoin and Ethereum, and the implementation and security concerns surrounding them. Students will learn how these systems work, explore the regulatory challenges associated with blockchain technology, and assess its impact on financial services and other industries. The course will also provide students with the component and structures of blockchain business networks such as smart contracts, consensus, certificate authorities, security protocols, role of nodes, transaction processes, participants, and underlying frameworks. Furthermore, the course will examine the Bitcoin (BTC) ecosystem, Ripple (XRP), Ethereum (ETH), tokens (e.g., NFT’s), Initial Coin Offerings (ICOs), and Central Bank Digital Currencies (CBDC). Students will also gain hands-on experience, such as creating basic Blockchain contracts, enabling them to discuss the practical capabilities and limitations of blockchain technology.
    clauses: []
    noCreditWith: []
  - courseId: FIN|598
    description: "FIN 598: Special Topics This course will engage students at an advanced level in the exploration of special topics that reflect the expertise of the business school’s FIN faculty. It will serve as a flexible vehicle to provide a course offering of topics of current interest as well as to offer new topics before they are made into a permanent course. The course content and format vary to suit the interests and needs of the faculty and students. Department: The Business School Credits: Variable"
    clauses: []
    noCreditWith: []
