  - courseId: FP|573
    description: "Principles of fire dynamics, heat transfer and thermodynamics are combined with a general knowledge of automatic detection and suppression systems to analyze fire protection requirements for generic industrial hazards. Topics covered include safe separation distances, plant layout, hazard isolation, smoke control, warehouse storage, and flammable liquid processing and storage. Historic industrial fires influencing current practice on these topics are also discussed. (Prerequisites: FPE 553, FPE 521 or special permission of the instructor.)"
