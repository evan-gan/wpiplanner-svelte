    noCreditWith: []
  - courseId: ML|3021
    description: Cat. I (1/6 unit) ML 3021 is designed to continue the development as leaders by presenting instruction in the three foundational areas of leadership, interpersonal communication, and values and ethics. The leadership module contains an examination of Army leadership doctrine followed by expansion on key leadership concepts and provide feedback for cadet leadership self-development efforts. Participation in weekly training leadership laboratories; off campus training sessions (field training exercises) and other special events is required.
    clauses: []
    noCreditWith: []
  - courseId: ML|3022
    description: "Cat. I (1/6 unit) The main thrust of the communication module is the opportunity for cadets to present an information briefing and receive feedback from both instructor and fellow students. The last module of the term contains lessons that focus on values, ethics, ethical decision-making, consideration of others, and spiritual needs. Participation in weekly training leadership laboratories; off campus training sessions (field training exercises) and other special events is required. Recommended background: ML 3021"
