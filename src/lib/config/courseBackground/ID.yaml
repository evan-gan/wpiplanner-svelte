  - courseId: ID|3530
    description: "This course explores Spanish cinema, tracing its evolution from the early 20th century to contemporary works. Students will study a range of films that reflect Spain's rich cultural, political, and social landscapes, analyzing themes such as identity, history, gender, and memory. Through Spanish cinema and other media sources, this course studies images, topics, and cultural and historical issues that have impacted the creation of a modern Spanish nation. This course focuses on current political and ideological issues (after 1936), the importance of the Spanish Civil War, gender identity, and class, cultural, and power relationships. Through screenings, discussions, and critical analysis, students will learn to interpret film as a medium of artistic expression and cultural commentary, developing an understanding of the historical contexts that shaped Spanish cinema. They will also engage in group projects, presentations, and written assignments to deepen their appreciation and understanding of Spain’s cinematic heritage. This course satisfies the Inquiry Seminar to complete the HUA requirement in Spanish and would also count toward International and Global Studies. In addition, this course would benefit students interested in WPI’s Project Centers in Spain. This course is taught at an advanced level of Spanish. This course will be offered in 2025-2026, and in alternating years thereafter. Recommended Background: SP 3521 and SP 3522."
