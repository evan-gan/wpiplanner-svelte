    description: "Cat. IThis course develops an understanding of classical and modern structural analysis. Topics include loading systems, and the analysis of statically determinate and statically indeterminate beams, frames, trusses, structural floor systems for buildings, bridges, and other structural assemblies.Recommended background: CE 2000 and CE 2001.Suggested background: CE 1030."
