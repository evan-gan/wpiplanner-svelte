  - courseId: GOV|3312
    description: ": International Environmental Policy. Cat II Environmental issues present some of the major international problems and opportunities facing the world today. Worst case scenarios envision irrevocable degradation of the earth’s natural systems, but virtually every analysis sees the need for major change worldwide to cope with problems such as global warming, deforestation, ozone layer depletion, loss of biodiversity, and population growth, not to mention exponential increases in “conventional” pollutants in newly industrialized countries. The global environment issues represent a “second-generation” of environmental policy in which the focus of concern has moved from national regulations to international law and institutions. In addition, the environment has emerged as a major aspect of international trade, conditioning corporate investment and accounting for some $200 billion in sales of pollution control equipment in 1991. Exploration of the genesis and implications of these phenomena is the essence of the course. Topically, the material begins with the nature of global environmental problems, drawing on literature from large-scale global modeling as well as particular analyses of the problems mentioned above. Approximately half the course focuses on international laws and institutions, including multilateral treaties (e.g., the Montreal Protocol limiting CFC use, ocean dumping, biodiversity), international institutions (UNEP, the Rio Convention, the OECD) and private initiatives (international standards organizations, ICOLP (Industry Committee for Ozone Layer Protection), etc.) In addition, US policy toward global environmental issues will be compared with that in Japan, Europe and developing countries, from which it differs significantly. Students will design and undertake term projects that address particular issues in detail in an interdisciplinary manner. This course will be offered in 2021-22, and in alternating years thereafter. Students may not receive credit for GOV2312 and GOV 3312. Recommended background: None"
    clauses: []
    noCreditWith:
