  - courseId: ECE|576
    description: ECE 576 Applied Cryptography and Physical Attacks (3 credits) In this course, we aim to study security and trust from the hardware perspective. The three main objectives of hardware security that we will cover are secure key generation and storage as well as secure execution. Specifically, we will learn how cryptographic algorithms can become susceptible to physical attacks and how this can be prevented. Topics to be covered in this course include basics of hardware security and its objectives; random number generation; physically unclonable functions; invasive and non-invasive attacks, e.g., side-channel analysis and fault injection; counterfeit detection; semiconductor IP (Intellectual Property) protection.
    clauses: []
    noCreditWith: []
  - courseId: ECE|577
    description: Machine Learning has proven immensely effective in a diverse set of applications. This trend has reached a new high with the application of Deep Learning virtually in any application domain. This course studies the applications of Machine Learning in the sub domain of Cybersecurity by introducing a plethora of case studies including anomaly detection in networks and computing, side-channel analysis, user authentication and biometrics etc. These case studies are discussed in detail in class, and further examples of potential applications of Machine Learning techniques including Deep Learning are outlined. The course has a strong hands-on component, i.e. students are given datasets of specific security applications and are required to perform simulations.
    clauses: []
    noCreditWith: []
