  - courseId: MME|532
    description: (2 credits) This course would have concepts and techniques for both Ordinary and Partial Differential Equations. Topics from ordinary differential equations include existence and uniqueness for first order, single variable problems as well as separation of variables and linear methods for first order problems. Second order, linear equations would be solved for both the homogeneous and non homogeneous cases. The phenomena of beats and resonance would be analyzed. The Laplace Transform would be introduced for appropriate second order nonhomogeneous problems. Partial Differential Equations would focus on boundary value problems arising from the Heat and Wave equations in one variable. Fourier Series expansions would be used to satisfy initial conditions and the concepts of orthogonality and convergence addressed.
    clauses: []
    noCreditWith: []
