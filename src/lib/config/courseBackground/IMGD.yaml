  - courseId: IMGD|2901
    description: "This course provides students with the opportunity to examine and apply a variety of interactive media project design methods. Topics include audience-centered and iterative design strategies, playtesting best practices, critique and feedback analysis, professionalization, and the importance of play for both designers and audiences. Course activities range from small group design work to sophisticated analysis and discussion. Units: 1/3 Category: Category I Recommended Background: None"
    clauses: []
