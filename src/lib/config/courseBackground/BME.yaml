  - courseId: BME|3505
    description: "Cat. I (1/6 unit) This laboratory-driven solid biomechanics course provides hands-on experience in characterizing the mechanical properties of biological tissues such as bone, tendons, ligaments, skin, and blood vessels and their synthetic analogs. Students gain an in-depth understanding of the course material by performing uniaxial tension and compression, bending, and torsion tests on hard and soft tissues using industry-standard testing equipment and completing mechanical and statistical analysis of the data. Recommended background: A solid knowledge of mechanics of materials (ES2502) and material science (ES 2001). Students who have previously taken BME3504 may not receive credit for this course. Some sections of this course may be offered as Writing Intensive (WI)."
