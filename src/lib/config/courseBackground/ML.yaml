          course: ML|2021
    noCreditWith: []
  - courseId: ML|3012
    description: "Cat. I (1/6 unit) Student learns how to conduct crisis planning and management. Discussion of roles and functions of combat arms, combat support, and combat service support branches. Case studies of small-unit operations are studied. Introduction to Army special operations, military operations other than war, and trends in the military. Students write self-evaluations throughout this course. Students are graded on their performance during leadership practical exercises. Attendance at monthly labs and formal social functions is required. Students write self-evaluations through this course. Students are graded on their performance during leadership practical exercises. Participation in weekly training leadership laboratories; off campus training sessions (field training exercises) and other special events is required. Recommended background: ML 3011"
