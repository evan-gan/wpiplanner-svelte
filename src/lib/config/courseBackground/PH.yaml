  - courseId: PH|2651
    description: "Cat. I This course offers experience in experimentation and observation for students of the sciences and others. In a series of subject units, students learn or review the physical principles underlying the phenomena to be observed and the basis for the measurement techniques employed. Principles and uses of laboratory instruments including the cathode-ray oscilloscope, meters for frequency, time, electrical and other quantities are stressed. In addition to systematic measurement procedures and data recording, strong emphasis is placed on processing of the data, preparation and interpretation of graphical presentations, and analysis of precision and accuracy, including determination and interpretation of best value, measures of error and uncertainty, linear best fit to data, and identification of systematic and random errors. Preparation of high-quality experiment reports is also emphasized. Representative experiment subjects are: mechanical motions and vibrations; free and driven electrical oscillations; electric fields and potential; magnetic materials and fields; electron beam dynamics; optics; diffractiongrating spectroscopy; radioactive decay and nuclear energy measurements. Recommended background: the Introductory Physics course sequence or equivalent. No prior laboratory background beyond that experience is required. Students who have received credit for PH 2600 or PH 3600 may not receive credit for PH 2651."
