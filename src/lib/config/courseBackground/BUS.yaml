  - courseId: BUS|651
    description: "This course is offered every semester for cohort students as they start their research studies. It bridges between students’ methods courses and the start of their 30 dissertation credits. It is conducted in seminar format with a focus on students presenting the progress on their research studies and discussion among the class about appropriate research designs and analyses. This course can be taken multiple times. (Prerequisite: Admission to the Business School PhD program or to another WPI PhD program, BUS 631 or equivalent knowledge, BUS 632 or BUS 633 or equivalent knowledge.)"
