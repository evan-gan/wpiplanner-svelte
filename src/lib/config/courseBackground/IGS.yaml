  - courseId: IGS|220X
    description: "During this course, students will build on the foundational knowledge they gained in Environmental Leadership Foundations I (IGS210X). Through guest lectures, in-class activities, and discussions, students will learn how professionals have applied environmental literacy in their fields. Students will evaluate their growing environmental literacy skills, knowledge, and behaviors as they progress in their professional path. Environmental Leadership Foundations II is an action-oriented class that enables students to develop an environmental stewardship and social responsibility lens they can apply to their discipline. During this class, students will refine their Individualized Environmental Leadership Plan (IELP). Additionally, students will be introduced to methods for applying environmental literacy content to specific issues, with the issue changing annually. For example, we may use the Massachusetts Municipal Vulnerability Preparedness Program (MVP I.0 and MVP 2.0) to connect advocacy, ecology, policy, and leadership concepts across classes. The MVP program supports Massachusetts communities in identifying and addressing climate-related vulnerabilities. In Foundations II (IGS220X), students will learn from professional guest speakers who specialize in environmental governance, regulatory frameworks, and the integration of sustainability principles across engineering, conservation, and related fields. Throughout the course, students will have opportunities to participate in hands-on experiential nature immersion and visit sites. Required Background: Environmental Leadership Foundations I (IGS210X). NOTE: This course is part of the Leaders in Environmental Action for the Future (LEAF) Initiativ"
    clauses:
      - strength: required
        timing: prior
        sourceText: "Required Background: Environmental Leadership Foundations I (IGS210X)."
        requirement:
          kind: course
          course: IGS|210X
    noCreditWith: []
  - courseId: IGS|310X
    description: "In Environmental Leadership Applications (IGS310X), students will apply the knowledge gained in the previous two courses (Environmental Leadership Foundations I and II, IGS210X and IGS220X). Students will choose how to apply their knowledge and leadership skills by completing a range of activities, including community projects, earning additional credentials (e.g., external badges and certifications), career exploration, networking, mentorship, and disseminating their work. Students will also choose how to disseminate their work, including delivering conference and poster presentations, developing professional publications, engaging in community organizing, and working on environmental justice initiatives. Classes will include guest speakers, discussions, action-oriented work, leadership training, and peer-to-peer mentoring. Assignments outside the classroom will include a mix of activities, such as attending regulatory hearings, attending town committee meetings (e.g., sustainability committee meetings), attending lectures and conference presentations, and organizing volunteer activities. During this course, students will have additional experiential, hands-on nature immersion opportunities. Required Background: Environmental Leadership Foundations I (IGS210X) and II (IGS220X). NOTE: This course is part of the Leaders in Environmental Action for the Future (LEAF) Initiative."
