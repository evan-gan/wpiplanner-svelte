department: WR
entries:
  - courseId: WR|1011
    description: Cat. I This course will examine the appropriate dissemination of scientific information in common science writing genres such as science journalism, consulting reports and white papers, and policy and procedure documents . In a workshop setting, students will write and revise documents that promote broad understanding of scientific research and analysis of specialized knowledge . Course lectures and discussions investigate ethics of scientific reporting and teach students how to recognize deceptive texts and arguments (both quantitative and qualitative) . The course is reading and writing intensive and is intended for students with backgrounds in a scientific discipline who are interested in applying their disciplinary knowledge .
    clauses: []
    noCreditWith: []
  - courseId: WR|2010
    description: "Cat. I This course will cover basic principles of prose style for expository and argumentative writing. Students will learn to evaluate writing for stylistic problems and will learn revision strategies for addressing those problems. The ultimate goal of the course is to help students write sentences and paragraphs that are clear, concise, and graceful. In the first part of the course, students will review parts of speech, basic sentence types, and sentence and paragraph structure in order to understand how sentences are put together and the impact their construction has on readers. Then, through hands-on writing exercises and extensive revision of their own and others’ writing, students will learn strategies for tightening their prose (concision), achieving “flow” (cohesion and coherence) and improving usage (language specificity and precision). Recommended background: Basic knowledge of rhetorical writing (e.g., WR 1010, Elements of Writing, WR 1011, Writing About Science & Technology, or WR 1020, Introduction to Rhetoric."
