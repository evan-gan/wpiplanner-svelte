  - courseId: WR|2111
    description: WR 2111 Designing Effective and Ethical Research Studies Category I What does it mean to explain science and technology through the lens of writing practices? Or, politics through the prism of social media communication? Or, medicine as a discourse between clinicians and patients? This course equips students with tools to interpret and explain their worlds by introducing research approaches commonly used in rhetoric, professional writing, and literacy studies. By experimenting with a range of methods for collecting and analyzing data (such as interviewing, archival work, grounded theory, ethnography), students develop and refine their own research project. In the process, students gain practice evaluating others’ research designs, as well as their own. Although this course focuses on topics central to the discipline of Writing & Rhetoric, it will be useful to any student whose future coursework or project work (e.g. IQP/MQP) will require critical reflection on the ethical and practical dimensions of conducting research. Students may not receive credit for both WR 2111 and WR 4111
    clauses: []
    noCreditWith:
      - WR|4111
  - courseId: WR|2200
    description: "WR 2200/IMGD 2200: AI in Writing and Communication (Cat. II) Generative AI is transforming the practices of writing and communication. It also generates new questions about authorship, responsibility, creativity, authenticity, and other rhetorical constructs that affect us equally as citizens and professionals. This course offers the foundations of critical AI literacy. It aims to help students develop a robust understanding of what this transformation means, and what kind of new sensibilities and skills are needed in response to an AI-led transformation. The course focuses on: 1) technological and cultural trends that shape the perception of generative AI, 2) ethical concerns emerging from the use of generative AI in professional and nonprofessional contexts, and 3) effective and responsible practices of using generative AI in writing and other forms of communication. In addition to reading assignments, students will have the opportunity to experiment with generative AI and assess its limits and possibilities. The assignments include critical annotations, fact-checking procedures, creative workflow processes, ethical analyses, and interaction design inquiries. Recommended Background: None"
    clauses: []
    noCreditWith: []
  - courseId: WR|2210
    description: "This course emphasizes the standard written genres of professional, workplace communication. Students will analyze the history, purposes, conventions, and social consequences of a variety of business communications, focusing on digital and print correspondence, reports, and proposals directed to internal and external audiences. Students will learn about the culture of a professional environment and the role of writing in structuring identity and relationships within that context. Classes will be conducted as interactive writing workshops in which students assess and respond to rhetorical scenarios and sample texts from a variety of professional worksites. Students will create portfolios, producing professional writing samples they may use on the job market. Recommended Background: WR 1010, WR 1011, or equivalent"
