  - courseId: PSY|4100
    description: "PSY 4100: School Psychology (Cat II) This course is intended for psychology majors and minors, and those interested in upper-level discussions on education and schools. School psychology focuses on understanding children and adolescents’ mental health, behavioral health and learning needs to work with educators and parents to help students succeed academically and socially. School psychology draws from educational, developmental, and cognitive research. Students will critically examine the theoretical, methodological, and practical approaches to understanding how in and out of school interventions and contexts influence the academic, social, and emotional development of children. Topics may include: school readiness and transitions, behavioral and self-regulatory skills, socio-cultural diversity and skill gaps, assessment tools and classification, teacherchild interactions, and school- based interventions that promote positive development. This course differs from PSY 2401: Psychology of Education as it focuses on school systems rather than education more broadly. Students cannot earn credit for both PSY 2410 and PSY 4100. This course will be offered in 2025- 26, and in alternating years thereafter. Recommended background: Introduction to Psychological Science (PSY 1400), Cognitive Psychology (PSY 1401), and The Psychology of Education (PSY 2401) or an approved equivalent."
