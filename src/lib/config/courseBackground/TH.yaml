  - courseId: TH|2400
    description: "This course will explore the principles and practices of theatrical design, including script analysis, research, concept development, and collaboration. Students will learn to engage in theatrical storytelling through a variety of design disciplines (scenery, costumes, lighting, sound), and will develop a basic understanding of how these elements fit together. Students may not receive credit for TH 2400 and TH 111X. Recommended background: (none)"
    clauses: []
    noCreditWith:
      - TH|111X
  - courseId: TH|2520
    description: "This course introduces students to the technical side of theatre, exploring how design choices are brought to life in the various production shops—specifically through props, costumes, scenic painting, and hair & makeup. Students will explore each technical element through a combination of lectures, demonstrations, and workshops, and will demonstrate their learning through group and individual projects and other hands-on activities. (Students interested in technical theatre may also consider taking TH2510. The two courses may be taken in any order.) Students may not receive credit for TH 2520 and either TH 2500 or EN/TH 2222. Units: 1/3 Category: Cat I. Recommended Background: (none)"
    clauses: []
    noCreditWith:
      - TH|2500
      - EN|2222
      - TH|2222
  - courseId: TH|3240
    description: "TH 3240: Playwriting. Cat. II (1/3 units) Playwright. Wright – a maker. She creates a world on the stage through action, dialogue, and character. In this course, students will learn to write for the theatre – to make plays – through study, discussion, and practice. Working from foundational ideas of the well-made play, it will draw upon various analytic theories of theater to examine the structure of plays. Through exercises and studio-type critique, students will create and develop their own plays. Students may not receive credit for TH 3240 and TH 2219 . Recommended Background: (none)"
    clauses: []
    noCreditWith:
      - TH|2219
  - courseId: TH|3400
    description: "TH 3400: Lighting Design (Units: 1/3; Cat. II) This course examines the principles and practice of theatrical lighting design. Students will develop skills in all parts of the design process, from play analysis and visual research to system design and cueing. Through class discussion, hands-on activities, and creative design projects, students will develop their abilities to recognize, develop, communicate, and execute lighting design ideas. Though primarily focused on live performance (theatre, dance, opera, music, etc.), this course will also teach ideas and skills applicable to other mediums (architecture, film/TV, animation, etc.). Students may not receive credit for TH 3400 and TH340X. Recommended background: This course is suitable for anyone interested in environmental/performance design. TH 2400: Fundamentals of Theatrical Production Design provides useful (though not essential) preparation for this course"
    clauses:
      - strength: suggested
        timing: prior
        sourceText: "TH 2400: Fundamentals of Theatrical Production Design provides useful (though not essential) preparation for this course"
        requirement:
          kind: course
