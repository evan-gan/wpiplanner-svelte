    description: "Cat. I The experiments in this laboratory course have been designed to acquaint the students with the basic skills necessary to perform biochemical studies. The course will cover, for instance, protein purification, subcellular fractionation, enzyme kinetics (Km, Vmax, specific activity, effector-protein interaction, etc.), exclusion and ion exchange chromatography, and electrophoresis. Recommended background: Knowledge of organic chemistry fundamentals as well as concepts including protein structure and folding, catalytic mechanics, enzyme kinetics, and ATP synthesis and hydrolysis mechanisms. See CH 2310, BB 2550, and CH 4110 or equivalent."
