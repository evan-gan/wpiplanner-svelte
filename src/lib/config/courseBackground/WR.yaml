  - courseId: WR|2020
    description: "This course explores a variety of timely themes and topics related to rhetoric and public culture. Students will refine their understanding of classical and contemporary rhetorical concepts and their application of rhetorical research methods by analyzing and engaging with topics of professional and cultural significance. This course is designed to build on and further develop skills from first-year rhetoric studies (WR1020) and to prepare students for more advanced coursework in this discipline and in the Professional Writing program (e.g., WR3112, inquiry seminars, MQPs). This course may be repeated for different topics. Offering Schedule: This course will be offered in academic years ending in odd numbers. Recommended Background: fundamentals of rhetoric and rhetorical analysis (WR1020)"
