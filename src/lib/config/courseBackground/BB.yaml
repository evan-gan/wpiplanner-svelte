  - courseId: BB|2040
    description: "Cat. I This course is intended to help students understand ecological concepts at different levels of integration, from individuals to ecosystems, and the linkages among them. Students will also practice the application of qualitative and quantitative models to ecological systems and processes, as well as hypothesis generation, experimental design, and analysis and interpretation of data. In a format that includes team-based case studies, discussion and presentations, and ecological simulations, students will explore topics in both basic and applied ecology, which may include population ecology, host-parasite ecology and epidemiology, climate change, and sustainable agriculture, among others. Recommended background: A foundational knowledge of concepts in ecology and biodiversity (BB 1102 or equivalent) -Suggested background: integral and differential calculus."
