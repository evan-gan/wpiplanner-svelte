  - courseId: AB|1532
    description: "Cat. I This course continues students’ exposure to and development of Modern Standard Arabic and Darija, the Arabic dialect spoken in Morocco; it is for students who can read and write using the Arabic script but have very basic understanding of vocabulary and syntax. New language structures, vocabulary and cultural concepts will be presented in communicative activities/materials in class and homework assignments; these activities will focus on receptive (reading & listening) and productive (writing & speaking) skills in Arabic. Recommended background: AB1531 or instructor approval; this course is closed to native speakers of Arabic and heritage speakers except with written permission from the instructor."
