  - courseId: BME|3610
    description: "Cat I. This course provides an overview of the modeling and analysis of fluid and mass transport processes related to the field of Biomedical Engineering and Bioprocess Engineering. Fundamentals and applications of hydrostatics, conservation of mass and momentum in modeling and analysis of biological fluid transport processes in the human body and bioprocess equipment are presented and discussed. It includes modeling and analysis of blood and biological fluid flow through blood vessels, capillary beds and bioprocess equipment. Modeling and analysis of diffusive and convective mass transport in biological conduits and membranes, selective permeability and nutrient/waste exchange in parenchymal tissues with transport barriers unique to biological systems such as intact and fenestrated endothelium. Basic concepts of pharmacokinetics such as plasma clearance, volume of distribution of drugs and other biological solutes in body tissues are also covered. Surface adsorption and membrane permeability concepts are covered in the context of biological soluted exchange in capillaries and bioprocess operations. Students may not receive credit for both BME 3610 and BME 361X. Recommended background: Basic knowledge of differential and integral calculus (e.g., MA 2051 or equivalent), fundamental knowledge of biological system function or cell function (e.g., BB 1035 or BB 2550 or equivalent), fundamentals of data analysis and process modeling such as some of the topics covered in BME 2211 or BME 2610 or ChE 2011, or equivalent."
