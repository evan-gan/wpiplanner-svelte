  - courseId: EDU|4000
    description: "EDU 4000 Topics in Teacher Preparation: Practicum Seminar (Cat. I, 1/6 unit) This course provides teacher candidates with guidance, support, and best practices to successfully complete the Massachusetts state requirements for initial licensure in a STEM field of their choice. The seminar accompanies the student-teaching experience in a local school and may not be repeated. It is an essential element in the process of completing the seven (7) essential core competencies of the Department of Elementary and Secondary Education’s (DESE) Candidate Assessment of Performance (CAP) portfolio. Recommended background: Teaching Methods EDU4100 or equivalent, Sheltered English Immersion EDU3200 or equivalent, PSY2401 Psychology of Education, completion of pre-practicum fieldwork experiences 1 and 2. Students must be doing their student teaching practicum concurrently to enroll in this course. Students who took ID 4000 for credit are not eligible to take EDU 4000 for credit."
