  - courseId: RE|2721
    description: "Cat. I The purpose of this course is to examine how the two institutions of religion and culture interact and mutually influence one another. To do this a variety of definitions of religion and culture will be presented as well as an analysis of how religion interacts with such cultural phenomena as economics, politics, the state, war and the basic problem of social change. The purpose of this is to obtain a variety of perspectives on both religion and culture so that one can begin to articulate more clearly the different influences that occur in the development of one's own personal history and the culture in which one lives. Suggested background: knowledge of key terms and concepts as given in PY/RE 1731."
