  - courseId: OIE|4460
    description: "This case-based course will examine methods and strategies for managing andcontrolling material movement, with particular emphasis on internationaloperations, from the purchase of production materials to the control of work inprocess to the distribution of the finished product. Strategies that will bediscussed include the design of international distribution networks, the use ofthird-party logistics providers, and the creation of links between logistic systemsand marketing to create competitive advantage. The course will also exploretactical issues that must be managed to pursue a logistics strategy successfully,including choices regarding means of transportation, packaging, and inventorypolicies. Underlying themes of the course will be the use of informationtechnologies (such as electronic data interchange and bar coding) andmathematical models to support logistics decision-making.Recommended background: BUS 3020 and one of the following: BUS 2070 or OIE 2850 or consent of the professor."
