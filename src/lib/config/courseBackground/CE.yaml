    description: "Cat. IThis course provides an introduction to the relationship between analysis, design, and the behavior of materials under load. Theory and applications are developed that utilize simple and combined stress-strain behavior of members subjected to axial, torsional, and flexural loadings, with applications to beams, trusses, rigid frames, shafts, and tension and compression structures.Recommended background: CE 2000."
