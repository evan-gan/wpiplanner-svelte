  - courseId: MIS|3720
    description: "Cat. I This course introduces students to the theory and practice of database management and the application of database software to implement business information systems that support managerial and operational decision making. Special topics covered include relational data models, query languages, normalization, locking, concurrency control and recovery. The course covers data administration and the design of data tables for computerized databases. Students will use a commercial database package to design and implement a small business database application. Recommended background: CS 2119 or equivalent knowledge."
