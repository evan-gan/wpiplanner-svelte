    description: (3 credits) This course will cover key elements to writing successful grant proposals and manuscripts. This includes project development, identification of funding agencies or journals, proposal and manuscript writing and editing, as well as aspects of the submission and review process. Students will be expected to develop a NIH/NSF style postdoctoral proposal outside their dissertation field and participate in a mock proposal review panel. Students are expected to complete this course prior to their Qualifying Exam. Students may receive credit for either BB552 or a BB570 course entitled Scientific Writing and Proposal Development but not both .
