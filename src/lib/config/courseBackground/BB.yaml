  - courseId: BB|3140
    description: "BB 3140 Evolution: Pattern and Process (Cat. II; 1/3 unit) In this course, students will explore the foundations of micro- and macro-evolutionary theory and will learn to apply these fundamental evolutionary principles through critical analysis of the primary scientific literature. In a course format that emphasizes case studies and, critical analysis of the primary scientific literature, students will explore the evolutionary foundations of a wide range of biological disciplines, and will gain experience in critical evaluation of approaches, arguments, and points of view in the field. Topics may include the history of life on Earth; biogeography and the origins of biodiversity; host-pathogen coevolution; and genomic and molecular evolution, among others. This course will be offered in 2023-24, and in alternating years thereafter. Recommended background: A working knowledge of the principles of ecology (BB2040 or equivalent) and molecular biology & genetics (either or both BB2920 and BB3950 or equivalent). Suggested background: integral and differential calculus (MA 1020 or 1021, and MA 1022, or equivalent)"
