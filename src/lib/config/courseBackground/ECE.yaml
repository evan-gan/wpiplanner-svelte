  - courseId: ECE|579
    description: '"This course introduces the physical and cyber threats in the microelectronics supply chain. Topics include IC- and PCB-level tampering, hardware Trojan insertion, and counterfeiting. Moreover, this course explores how various detection- and prevention-based countermeasures can avert such supply chain attacks. The topics for detection-based countermeasures include physical verification using passive side-channel analysis (e.g., power, EM, and timing), semi- and fully-invasive failure analysis tools (e.g., photon emission, optical probing, and scanning electron microscopy), and RF methods (e.g., power integrity, signal integrity, and EMC). Moreover, various sensors will be discussed for tamper detection. The topics for prevention-based countermeasures include secure enclosures, Physically Unclonable Functions, etc. Prerequisite: General knowledge on cryptography and communication security typically offered in ECE 4802 - Introduction to Cryptography and Communication Security"'
    clauses:
      - strength: required
        timing: prior
        sourceText: "Prerequisite: General knowledge on cryptography and communication security typically offered in ECE 4802"
