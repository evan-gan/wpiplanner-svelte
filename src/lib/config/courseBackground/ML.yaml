    noCreditWith: []
  - courseId: ML|2021
    description: "Cat. I (1/12 unit) Students continue the study of leader principals and are introduced to formal policies such as equal opportunity, ethics, and values. Military communication skills are trained along with the principles of camouflage. Complex cases of risk management are studied. Students will submit a written information paper. Participation in weekly training leadership laboratories; off campus training sessions (field training exercises) and other special events is required. Recommended background: ML 2012"
