          course: AREN|2023
    noCreditWith: []
  - courseId: CE|3026
    description: "Cat. IThis course provides an understanding of the use and acquisition of engineering properties of construction materials. Topics include relationships between the structure of materials, their engineering properties, and the selection of suitable materials for applications involving strength, durability, and serviceability. Experimental laboratory procedures including design of experiments, data collection, analysis, and representation, and report writing are an integral part ofthe work.Recommended background: CE 1030 and CE 2001. Some sections of this course may be offered as Writing Intensive (WI)."
    clauses:
