entries:
  - courseId: WPE|1614
    description: "This course is designed to introduce and educate its participants on multiple facets of nutrition and explore varied current topics of nutrition today. Students will understand how food and beverage choices impact their everyday lives and the environment. Over the term, multiple current nutritional trends will be addressed and discussion on how to become an educated consumer while navigating the complex world of nutritional messaging. Each class will involve interactive activities to highlight the topic of that class. CAT I Recommended Background: None"
    clauses: []
    noCreditWith: []
  - courseId: WPE|1711
    description: "Mindfulness 2.0 builds on the foundation established in Intro to Mindfulness. In this course, you’ll revisit core practices while exploring new ways to deepen your experience, including Seated Movement Practice, Loving-Kindness meditation, and a meaningful silent retreat. Together, we’ll also read Real Happiness by Sharon Salzberg, using it as a guide for reflection and discussion. Throughout the course, you’ll be encouraged to extend your meditation sessions and strengthen the habit of bringing mindfulness into daily life. Open to students who have completed WPE 1611 Intro to Mindfulness or who maintain regular meditation practice. CAT I Recommended Background: Foundation knowledge of meditation practice (e.g.. WPE1611 or a regular meditation practice)"
    clauses:
      - strength: recommended
        timing: prior
        sourceText: "Recommended Background: Foundation knowledge of meditation practice (e.g.. WPE1611 or a regular meditation practice)"
