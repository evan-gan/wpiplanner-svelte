  - courseId: SP|3522
    description: Advanced Spanish II will continue expanding students’ interaction with sophisticated and complex texts such as literature, films, news, and reports about social, political, and historical events related to the Spanish-speaking world. Students will practice advanced grammar structures, vocabulary, and critical thinking to discuss, write, and present in academic and professional settings in the target language. This course satisfies the Inquiry Seminar to complete the HUA requirement In addition, this course would benefit students interested in WPI’s Project Centers in Spanish-speaking countries. This course is taught at an advanced level of Spanish. This course is closed to native speakers of Spanish and heritage speakers except with written permission from the instructor. Recommended background SP 3521
