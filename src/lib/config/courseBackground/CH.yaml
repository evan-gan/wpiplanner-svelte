  - courseId: CH|520
    description: Cell signaling defines the way cells respond to changes in their environment including, heat, nutrients, drugs, hormones, and other factors. These external factors allow cells to grow, divide, migrate and proliferate depending on the stimulus, and inappropriate responses lead to cancer and other diseases. This course is directed for advanced undergraduates and graduate level course that is a combination of on-line lectures, discussions, and review of recent literature. Students who previously took the CH 555 version of this course cannot take CH 520 for credit.
