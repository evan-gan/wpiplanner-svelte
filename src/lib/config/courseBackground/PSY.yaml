department: PSY
entries:
  - courseId: PSY|1400
    description: "PSY 1400: Introduction to Psychological Science (Cat I) This course is intended for anyone interested in learning about the different areas of psychological science. Psychological science is the scientific examination of human thought and behavior. In other words, psychologists try to understand why people do what they do. This course offers an introduction to different areas and topics within psychological science. Topics may include: the brain, sensation, perception, learning, memory, language, intelligence, development over the lifespan, social cognition and behavior, motivations, emotions, mental health, methodology & statistics. No prior experience in psychology is needed"
    clauses: []
    noCreditWith: []
  - courseId: PSY|1500
    description: "PSY 1500 The Science of Creativity (1/3 Unit; Cat. II) Are you fascinated by the ways in which artists and scientists reach creative breakthroughs? Ever wonder why you have aha! eureka moments in the shower? Do you wonder how you can improve your own creativity? This course is intended for anyone interested in understanding the science behind creativity. Creativity is considered one of the most sophisticated forms of human cognition and is used by both artists and scientists to push the frontier of knowledge and expression. This course will introduce students to the predominant theories and research findings from cognitive science on creativity, including theories of divergent and convergent thinking, flow experiences, and eureka moments of insight. This course mixes lectures with in-class activities to teach students the latest findings from creativity research and elaborate on these concepts through creative experiences inside and outside the classroom. Students who complete this course will gain a solid understanding of the theoretical frameworks of creativity and activities that promote creativity, apply class concepts to improve their creative problem-solving skills and leverage creative processes to their advantage to work on reaching their full creative potential. This course will be taught in 2025-26, and in alternating years thereafter. Recommended Background: None"
    clauses: []
    noCreditWith: []
  - courseId: PSY|2403
    description: "PSY 2403: Cognitive Psychology (Cat I) This course is intended for anyone interested in learning about the mental processes and strategies underlying human behavior. The ways in which sensory input is transformed, reduced, elaborated, stored, and recovered will be examined in order to develop a picture of the human mind as an active processor of information. Topics will include perception, pattern recognition, attention, mental imagery, memory, categorization, problem solving, and decision making. Students will gain experience with research methods in cognitive psychology by participating in online experiments. Course assignments will emphasize applications of cognitive research to everyday life. No previous experience with psychological science is necessary to take this course. Students may not receive credit for both PSY 1401 and PSY 2403."
    clauses: []
    noCreditWith:
      - PSY|1401
  - courseId: PSY|2404
    description: "PSY 2404: Developmental Psychology (Cat II) This course is for anyone with any experience level who is interested in understanding human development from conception to death. The course will cover development from biological, cognitive, emotional, social, personality, linguistic, and moral perspectives over the lifespan. No previous experience with psychological science is needed to take this course. Students may not receive credit for both PSY 1404 and PSY 2404."
    clauses: []
    noCreditWith:
      - PSY|1404
  - courseId: PSY|2406
    description: "PSY 2406: Cross-Cultural Psychology (Cat II) Why do people stand so close to you in other countries? Why should you avoid eating with your left hand in some places? Why do people drive on the left side of the road in some countries? How does your nationality influence the way you think about food? How is the U.S. viewed by other countries? In this course, we will explore these questions and many more as we learn about cross-cultural psychology. Crosscultural psychology is the study of cultural effects on human behavior and diversity. We will examine theoretical perspectives and empirical findings in cross-cultural psychology. This course will cover topics such as: development, understanding the self, cognition, communication (verbal and nonverbal), emotion, relationships, prejudice, gender, mental and physical health, and what it means to live and work in a diverse and multicultural society. We will examine these issues both within the cultural groups in the United States as well as cultures around the globe. This course is designed to increase awareness and sensitivity to issues pertaining to diversity and differences among people and to allow for discussions on these sensitive topics. No prior experience with psychology is needed to take this course. This course will be offered in 2024-25, and in alternating years thereafter"
    clauses: []
    noCreditWith: []
  - courseId: PSY|2412
    description: "PSY 2412: Mental Health (Cat II) This course is intended for anyone from any background who is interested in learning about mental health. This course will introduce mental health more broadly, including topics such as well-being, stress, anxiety, etc. In addition, we will discuss what makes something a disorder and the wide variety of psychological disorders that exist in society (personality, anxiety, mood, psychotic, etc.). Possible causes, symptoms, preventions, and treatments will be examined. Empirical research on mental health will be emphasized. No previous experience with psychological science is needed to take this course. Students may not receive credit for both PSY 1412 and PSY 2412."
    clauses: []
    noCreditWith:
      - PSY|1412
  - courseId: PSY|2501
    description: "Cat. I How are we able to distinguish instruments, timbres and rhythms from the intertwined sonic stream presented by the world? How do we organize these elements in time to create rhythms, melodies, phrases and pieces? How do perception and memory interact to allow us navigate a musical work? We will explore these questions by considering the cognitive and perceptual processes that shape our musical experience. Topics will include event distinction, temporal perception, hierarchical organization, perceptual grouping, expertise, memory and categorization . We will illustrate these ideas in musical contexts by listening to a variety of musical works . We will consider how psychological principles are applied to music technologies, such as compression algorithms, mixing methodologies and the field of music information retrieval . We will consider experiments that focus on some of these topics to further our understanding about how we experience music . Note: Students that received credit for MU 202X may not receive credit for MU 2501 . Students also may not receive credit for both MU 2501 and PSY 2501 . This course can count for either the HUA or the SSPS requirement, but it cannot double count for both the HUA and SSPS graduation requirements . Recommended background: Fundamentals of Music I and/or Fundamentals of Music II."
