  - courseId: BB|2802
    description: "BB 2802 Enzymes, Proteins, and Purification Laboratory (Cat. I; 1/6 unit) This course gives basic practical experimental experience in how enzymes work and how to purify proteins for later use. These techniques are foundational for the design and production of many therapeutic products. Examples of the types of techniques and experiences included in this course are: The action and optima of enzyme catalysis, induction of protein production, quantification and detection techniques for proteins, extraction and purification of proteins from biological material using column chromatography, and assessing the efficacy of a purification process. Recommended background: at least one college-level biology course. Students may not receive credit for this course and BB 2902."
