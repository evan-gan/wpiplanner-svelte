department: NSE
entries:
  - courseId: NSE|530
    description: "This course builds on fundamental concepts introduced in NSE 510 and applies them to key topics in health physics and radiation protection . Health physics topics include man-made and natural sources of radiation, dose, radiation biology, radiation measurement, and radiation safeguards . Radiation protection concepts are explored as they apply to existing and advanced nuclear power generators, including reactor safety, nuclear waste and byproducts, regulatory constraints, and accident case studies . Prerequisites: graduate standing or consent of the instructor."
    clauses:
