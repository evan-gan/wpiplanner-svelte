  - courseId: AE|3010
    description: "AE 3010 Experimentation and Data Science with Aerospace Engineering Applications (1/3 units; Cat. I) In this course, students are introduced to experimental and data analysis techniques in modern aerospace engineering measurement methods and experimentation, based on electronic instrumentation and computer-based data acquisition systems. Students are also introduced in principles of instrumentation, with laboratory periods that provide an opportunity to use modern devices in actual experiments. Lecture topics include review of experimentation and measurement fundamentals, discussion of standards, experiment planning and design, data acquisition, analysis of experimental data, error propagation, uncertainty estimation, and report writing. Laboratory experiments include flow visualization and property measurement, force/torque/strain measurement, motion/vibration measurement, control systems, and temperature measurement. Laboratory experiments incorporate data science methods such as data decomposition, regression, filtering, distributions, optimization, estimation, prediction. Recommended background: basic physics, (PH 1110, PH 1111) elementary differential and integral calculus (MA 1021, MA 1022), ordinary differential equations (MA2051) or equivalent."
