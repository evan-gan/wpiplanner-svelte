  - courseId: SP|1524
    description: This course is designed to further develop basic Spanish language proficiency at the sentence level in meaningful real-life contexts. It will introduce new forms of Spanish grammar, vocabulary, and different aspects of Hispanic culture in the U.S. and Spanishspeaking countries while emphasizing language skills in the interpersonal, interpretative, and presentational communicative modes. Upon completing this course, students will be able to communicate with short sentences to describe present and past experiences. This course is closed to native speakers and heritage speakers of Spanish, except with written permission from the instructor. Recommended Backgrounds Spanish 1523 or 3 years of Spanish in high school.
