  - courseId: CS|2119
    description: Cat. I This course introduces students to an object-oriented model of programming, with an emphasis on the programming approaches useful in creating software applications. Students will be expected to design, implement, and debug object-oriented programs. Topics include inheritance, user interfaces, and database access. This course is for non-CS majors with prior programming experience and an interest in building software applications. Programming experience such as found in CS 1101, CS 1102, CS 1004, or CS 1005.
