    noCreditWith: []
  - courseId: GN|3513
    description: "Cat. II Conducted entirely in German, the course presents an overview of the development of modern Germany and its culture since the founding of the Second Empire. Background readings in German and English provide the basis for in-class discussion of selected authentic German texts of various kinds: literary works, official documents, political manifestos, letters, and diaries. At least one film will be shown. A number of recurring themes in German culture will inform the content of the course: authoritarianism versus liberalism, idealism versus practicality, private versus public life. Recommended background: GN 3511 (Advanced German I) and GN 3512 (Advanced German II) or equivalent. This course satisfies the Inquiry Practicum requirement. This course will be offered in 2020-21, and in alternating years thereafter."
