  - courseId: OIE|549
    description: The environmental implications and responsibilities of organizations begin at an organization’s boundaries with management of their operations, but also extend to incorporate interorganizational relationships and networks, the supply chain. We will investigate the practice and theory of sustainable supply chains and operations management in organizations throughout the world. This course is intended to provide students with understanding the intra- and interorganizational implications of environmental sustainability practices and policies. The role of organizational supply chain management functions, activities, tools and methods and their relationship to the natural environment will be introduced and discussed. The goals are for students to grasp the scope of general supply chain/operations management and environmental sustainability as they relate to the firm; to be able to relate to the manners in which management may respond and collaborate internally and with suppliers, customers, and various other stakeholders influencing and influenced by operational and supply chain activities from practical and theoretical case studies; able to evaluate various factors and understand tradeoffs in management decisions as they pertain to environmental supply chain management.
    clauses: []
    noCreditWith: []
  - courseId: OIE|553
    description: This course aims to develop an in-depth understanding of the decisions and challenges related to the design and implementation of a firm’s purchasing strategy within a context of an integrated, global supply chain. Topics centering on operational purchasing, strategic sourcing, and strategic cost management will be covered. The global logistics systems that support the purchasing process will be analyzed, and the commonly used techniques for designing and evaluating an effective logistics network will be studied.
    clauses: []
    noCreditWith: []
  - courseId: OIE|559
    description: "This course provides an in-depth focus on prescriptive analytics, which involves the use of data, assumptions, and mathematical modeling of real-world decision problems to ascertain and recommend optimal courses of action. Starting from conceptualization of the problem, to using theory for translational modeling and techniques, to computational solving, and finally interpretation – likely in an iterative manner – students will gain knowledge of tools and practical skills in transforming real-world decision problems into actionable insights. Advanced topics in the prescriptive analytics domain will be covered, such as the use of integer variables to represent important logical constructs, using nonlinear functions to represent real-world decision aspects, the incorporation of stochasticity and uncertainty, and corresponding solution methods. Real-world problems will be selected from a variety of contexts that may include capacity management, data science, finance, healthcare, humanitarian operations, inventory management, production planning, routing, staffing, and supply chain. Students will complete an individual project that includes a report in the style of a technical report or research paper, as well as an oral presentation. (Prerequisite: OIE 552, equivalent knowledge about optimization and linear programming, or consent of the instructor. Students may not receive credit for both OIE 4430 and OIE 559)."
    clauses:
      - strength: required
        timing: prior
        sourceText: "(Prerequisite: OIE 552, equivalent knowledge about optimization and linear programming, or consent of the instructor."
        requirement:
          kind: anyOf
          of:
