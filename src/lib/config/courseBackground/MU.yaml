    description: Cat. I This course will explore the uniqueness of America’s popular music and its origins in the music of Africa and the folk music of Europe. Particular emphasis will be given to the origins and history of rock ‘n’ roll examining its roots in blues and early American popular music. [This replaces MU 4625. Credit is not allowed for both MU 4625 and MU 2722.]
