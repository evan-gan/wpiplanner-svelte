  - courseId: FY|1100
    description: Cat. I The Great Problems Seminars (GPS) are a two course sequence designed to engage Worcester Polytechnic Institute's first-year students with current events, societal problems, and human needs. Each seminar starts with an important problem and introduces some of the key disciplinary tools that could be used to attack the problem. The focus for most of the second course will be a research project related to the GPS theme. Students will present their project work in a poster session at the end of the second term. Each seminar is developed and presented by an interdisciplinary pair of faculty. To participate, students must enroll in the two course sequence. Academic credit for the GPS will depend on the theme and the faculty who develop the seminar.
    clauses: []
    noCreditWith: []
