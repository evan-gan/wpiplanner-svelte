    description: "This course provides students with an introduction to security, covering both technical and social aspects. Through a series of exercises and case studies, students will develop an understanding of security that will serve as the foundation for 4K-level security-focused courses. Topics may include foundational security concepts (e.g., access control), common attacks (e.g., social engineering) and defenses, case studies of large-scale attacks and failures (e.g., Heartbleed), and security processes (e.g., software testing and vulnerability disclosure). Recommended Background: This course assumes a basic understanding of program design (CS 1101 or CS 1102) and systems programming concepts (CS 2303)."
