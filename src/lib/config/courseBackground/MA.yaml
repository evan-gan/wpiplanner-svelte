  - courseId: MA|2210
    description: "Cat. IThis course introduces students to the principles of decision theory as applied tothe planning, design and management of complex projects. It will be useful tostudents in all areas of engineering, actuarial mathematics as well as those insuch interdisciplinary areas as environmental studies. It emphasizes quantitative,analytic approaches to decision making using the tools of applied mathematics,operations research, probability and computations. Topics covered include: thesystems approach, mathematical modeling, optimization and decision analyses.Case studies from various areas of engineering or actuarial mathematics are usedto illustrate applications of the materials covered in this course.Recommended background: MA 1024. Suggested background: Familiaritywith vectors and matrices. Although the course makes use of computers, noprogramming experience is assumed. Students who have received credit forCE 2010 may not receive credit for MA 2210."
