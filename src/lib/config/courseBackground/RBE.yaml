  - courseId: RBE|4815
    description: "RBE 4815. Industrial Robotics Throughout this course, students will be introduced to industrial robots and their applications. The course covers both industrial serial arm robots, such as those equipped with spherical wrist, and industrial parallel manipulators, such as the Stewart-Gough platform and Delta manipulator. Topics include mechanisms’ degrees of freedom, inverse and forward kinematics (position and velocity), workspace, singularity, and manipulability analysis of industrial manipulators. Topics may extend to end effectors, motion accuracy, robot control and automation. This course is a combination of lecture, laboratory and project work. Students will engage in practical, hands-on learning experiences through the use of an industrial robot to apply theoretical knowledge to real-world scenarios, fostering comprehensive mastery of industrial robotics principles. Through the laboratory work, students will become familiar with industrial robotic programming while acquiring skills in working with industrial controllers such as Programmable Logic Controllers (PLC). Recommended background: RBE 3001, ES 3011, and computer programming"
