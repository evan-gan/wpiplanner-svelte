  - courseId: EDU|550
    description: "EDU 550: Collaboration & Teamwork in STEM Education (3 credits) In this online synchronous course students will review several theories related to teamwork and collaboration and the translation of these theories into successful practices in STEM education classes and the school as a workplace. Theories and strategies for improving team dynamics will be introduced, and participants will learn what factors are shown to lead to greater innovation and creativity on teams. We will also discuss implicit bias and stereotyping on teams, and how to prevent and minimize their negative impacts on participants. Multiple strategies for team formation in the classroom will be discussed, and we will explore how to teach students teamwork skills during project-based classes. The course will include an opportunity to apply some of the theories and strategies for effective and equitable teamwork in the classroom and to reflect on the utility of different approaches. Recommended Background: None."
    clauses: []
    noCreditWith: []
