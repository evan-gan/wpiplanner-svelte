department: ARCH
entries:
  - courseId: ARCH|500
    description: "ARCH 500 - Thesis Research Seminar (3 credits) This seminar prepares students in the Master of Architecture program to conceive and develop a graduate thesis design project proposal that is rooted in the originality and innovation of research and design practice. The course is structured with seminars of invited speakers, discussions of readings, workshops, student presentations, and thesis proposal development. The seminar may include a travel component. The topics vary each year with the focus on research methodologies and broad issues relevant to the discipline of architecture. The course culminates in a written proposal that includes a description and justification of the proposed thesis topic, main goals and objectives, methodologies, plan of study, expected products, and a proposal for the composition of a thesis committee. Prerequisites: Accepted as a student in the Master of Architecture program."
