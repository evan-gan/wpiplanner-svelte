          course: AR|1100
    noCreditWith: []
  - courseId: AR|1400
    description: "AR 1400 Digital Photography (1/3 units; Cat. II) This course teaches students the use of DSLR cameras to capture high quality images. Students will learn to produce images with correct exposure by using camera controls such as f/stops, shutter speeds, film speeds. The application of principles and elements of design in photography will be explored, and students will learn to create effective compositions by the use of depth of field, action motion, shadows and light, and camera angles. Projects may include still life, portraits, architectural and landscape, product and industrial photography as well as postproduction techniques. Recommended Background: None"
    clauses: []
    noCreditWith: []
  - courseId: AR|174X
    description: This course introduces students to the fundamental principles of three-dimensional visual organization through contemporary 3D modeling practices. Students will explore the technological foundations of digital modeling, including 3D scanning, retopology, UV mapping, and prop modeling. The course emphasizes visual perception, graphic expression, and rendering within digital environments. Students gain hands-on experience with industry tools while learning to create and manipulate digital assets suitable for games, 3D printing, interactive media, animation, and visual storytelling. Core skills include modeling, shading, and the presentation of visual ideas through 3D forms. The course also highlights current sculpting, modeling, and workflow technologies, preparing students to adapt to evolving tools and practices in digital art and design. By the end of the course, students will understand how to create shaders, work in 3D dimensional space, have foundational design principles, and develop their ability to translate concepts into digital form. Recommended Background No prerequisites are suggested or recommended
    clauses: []
    noCreditWith: []
  - courseId: AR|2048
    description: "This course will focus on making digital art functional in a video game environment. Students will learn the skills necessary to create and optimize their art assets through several creative and technical solutions that are all geared towards making high quality game art. This course will allow students to form a greater understanding of the bridge between pure art creation and interactive art implementation into a game engine. The course explores the many problems and technical restrictions one is faced with when trying to implement anything from animated characters to textures and focuses on how one can creatively apply technology to achieve high quality results. Topics covered include: creating complex character rigs, optimizing character meshes for rigging, shader creation, optimizing UV space and baking texture files and lighting. Recommended background: Basic knowledge of 3D modeling, texturing and animation (IMGD 2101 and IMGD 2201 or equivalent). Students may not receive credit for both IMGD 204X and AR/IMGD 2048."
