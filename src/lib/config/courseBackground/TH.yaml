  - courseId: TH|3510
    description: "This course will immerse students in the scenic fabrication process for a department theatre production. As members of the show’s crew, students will plan, build, paint, install, and eventually remove all scenic elements, in collaboration with the show’s technical staff and design team. Additionally, students may learn about the design process and other related activities. Students will demonstrate their learning by participating in the build process and other assigned projects. Students may not receive credit for TH 3510 and TH 320X. Recommended background: (none)"
    clauses: []
    noCreditWith:
      - TH|320X
  - courseId: TH|201X
    description: "TH201X: Ballet I This course teaches ballet fundamentals and is appropriate for all students interested in learning or strengthening ballet technique. Students will develop a basic knowledge of ballet terminology and performance through barre and center exercises. The course will focus on alignment, whole body movement, musicality, and embodiment of performance style. (This course may count toward either the HUA requirement [for 1/6 unit] or the WPE requirement [for 1/12 unit], but may not count toward both. It may not be repeated for credit.)"
    clauses: []
    noCreditWith: []
