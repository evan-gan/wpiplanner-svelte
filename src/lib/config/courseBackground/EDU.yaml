  - courseId: EDU|4100
    description: "EDU 4100: Teaching Methods in Science, Technology, Engineering, and Mathematics (Cat. I, 1/3-unit) This course provides students with skills and instructional strategies necessary for success in teaching Science (biology, chemistry, physics), Technology (computer science), Engineering, and Mathematics in middle and high school classrooms. Students are introduced to the seven elements of the Candidate Assessment of Performance (CAP), which is the evaluative tool used to obtain teaching licensure within the Commonwealth of Massachusetts. Course topics include: a brief history of education; curriculum and course guidelines (Massachusetts Education Reform and regulations 603 CMR 7 .00, state curricular frameworks, national standards); legal issues; developing unit and lesson plans; and evidence-based teaching methods. Students learn about the elements of an engaging and inclusive lesson, create and design series of lessons to form a unit plan using backward design, how to manage a classroom, group work, and how to develop a classroom management plan, and how to assess student understanding using formative and summative techniques. A portion of the course requires students to complete field work in a local classroom to prepare for the student teaching practicum. Students who took ID 3100 for credit are not eligible to take EDU 4200 for credit. Recommended background: PSY 1401 or 2401 or 2410, EDU 2200, EDU 2300, EDU 3200"
