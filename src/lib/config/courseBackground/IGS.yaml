department: IGS
entries:
  - courseId: IGS|210X
    description: "How can you integrate environmental knowledge and leadership into your future career, regardless of your major? This foundational course in environmental leadership introduces students to the core concepts, skills, and professional fields central to addressing present and future environmental challenges. Students will explore environmental ethics, ecological foundations, government systems and institutions, policymaking, and community engagement. Through a combination of instructor-led discussions, expert guest lectures, and action-oriented excursions, students will begin their journey towards environmental literacy. In addition, during the Foundations I course, students will begin to develop an Individualized Environmental Leadership Plan (IELP). The IELP will provide students with a structured yet flexible framework for curating their own environmental leadership journey, tailored to their interests, strengths, and professional goals. Through the IELP, students will begin to adopt a sustainability lens that they can apply across their academic, personal, and professional journeys. This course serves as the first in a sequence of environmental leadership courses, followed by IGS 220X (Environmental Leadership Foundations II), IGS 310X (Environmental Leadership Applications), and IGS 410X (Environmental Leadership Practicum). Recommended Background: A strong desire to expand environmental literacy and action from an interdisciplinary perspective and some leadership experience. NOTE: This course is part of the Leaders in Environmental Action for the Future (LEAF) Initiative."
