  - courseId: BME|4606
    description: "Cat. II This course emphasizes the applications of fluid mechanics to biological problems. The course concentrates primarily on the human circulatory and respiratory systems. Topics covered include: blood flow in the heart, arteries, veins and microcirculation and air flow in the lungs and airways. Mass transfer across the walls of these systems is also presented. Recommended background: ME 3501 and fluid mechanics equivalent to ES 3004. This course will be offered in 2020-21, and in alternating years thereafter."
