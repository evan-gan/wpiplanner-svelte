  - courseId: CH|3530
    description: "Cat. I An introduction to quantum mechanics with applications to atomic and molecular species. The course will be developed systematically beginning with the postulates of quantum mechanics. The Schroedinger equation will be applied to systems such as the particle in a box, the rigid rotor, the harmonic oscillator and the hydrogen atom. Emphasis will be given to a quantum mechanical description of multielectron atoms, molecular bonding and spectroscopy. Recommended background: a solid foundation in elementary physics and calculus. This course is normally for students in their third year."
