  - courseId: BUS|2020
    description: Cat. I This course addresses the impact of law on business. The course covers fundamental areas of business law, such as torts, contracts, intellectual property, and legal forms of business organizations, and their effects on business decisions. Particular attention is paid to technology-based enterprises where global business issues intersect with law.
    clauses: []
    noCreditWith: []
  - courseId: BUS|546
    description: This course studies successful innovations and how firms must enhance their ability to develop and introduce new products and processes. The course will discuss a practical model of the dynamics of industrial innovation. Cases and examples will be discussed for products in which cost and product performance are commanding factors. The important interface among R&D/ manufacturing/marketing is discussed. International technology transfer and joint venture issues are also considered.
    clauses: []
    noCreditWith: []
  - courseId: BUS|594
    description: BUS 594 Data-driven Business Strategy (3 credits) This is the Capstone project course for the STEM MBA program. The course content will introduce students to business strategy and integrate it with data-driven decision making. The course will involve a major team-based analytics project with an organizational sponsor. The project will involve both technical analytical skills and strategic thinking for formulating and implementing effective business strategies.
    clauses: []
    noCreditWith: []
  - courseId: BUS|691
    description: (0 credits) Seminars on current issues related to entrepreneurship, information technology and operations management are presented by authorities in their fields. All full-time Ph.D. students in Business Administration are required to register and attend.
