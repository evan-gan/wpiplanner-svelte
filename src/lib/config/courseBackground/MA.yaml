    description: "Cat. I, This course will cover the same material as MA1024 Calculus IV from a more mathematically rigorous perspective. The course gives a rigorous introduction of differentiation and integration for functions of one variable. After introducing vector functions, differentiation and integration will be extended to functions of several variables. Recommended background: Theoretical Calculus III (MA1033, or equivalent). Note: Students can receive credit for this class and MA1024 Calculus IV."
