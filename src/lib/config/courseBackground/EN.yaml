  - courseId: EN|3219
    description: "Cat. II This advanced seminar in creative writing includes sustained attention to the writing of fiction, poetry, and short prose forms among other genres, culminating in final projects (essay, play, poem, story, or some combination thereof) determined by individual interest and in consultation with the instructor. Investigation will also focus on the reading and discussion of exemplary works across genres, with an emphasis on contemporary practice. In the process, regular writing exercises and class visits from established authors will help to create a community of writers grounded in diverse methods. Suggested background: Introductory level creative writing (EN 2219 (formerly EN 3217) or equivalent). This course will be offered in 2019-20, and in alternating years thereafter."
