  - courseId: ME|5371
    description: (2 Credits) Surface Metrology is about measuring, characterizing, and analyzing surface topographies or textures. This course covers conventional and developing measurement and characterization of roughness. It emphasizes research and covers a wide variety of applications, including, adhesion, friction, fatigue life, mass transfer, scattering, wear, manufacturing, food science, wetting, physical anthropology, and archeology. Surface metrology has applications in practically all engineering disciplines and sciences. Research principles are applied to critical evaluations of research methods. Students learn multiscale methods for discovering correlations between processing, textures, and behavior , and for discriminating surface textures supposed to be different because of their performance or manufacture. Results support product and process design, and quality assurance. Students create detailed project proposals on topics of their choosing, including literature reviews, preparation and testing of surfaces, measurements, characterizations, and analyses. Students cannot receive credit for this course if they have received credit for the Special Topics (ME 593/MTE 594/MFE 594) version of this course, or for ME 5370/MTE 5841/MFE 5841 Surface Metrology.
    clauses: []
    noCreditWith:
      - ME|5370
      - MTE|5841
      - MFE|5841
  - courseId: ME|5380
    description: "(2 credits) This course is suitable as an introductory graduate level course. Topics will be chosen from the following: three-dimensional states of stress; measures of strain; thick-walled cylinders, disks and spheres; plane stress and plane strain; thermoelasticity; Airy stress function; energy methods, and exact theory for torsion of noncircular cross sections. This course may be taken independent of ME 5302."
    clauses: []
