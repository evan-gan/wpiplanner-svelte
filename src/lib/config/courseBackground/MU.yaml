  - courseId: MU|2002
    description: "MU 2002: History of Western Art Music After 1750 This course provides a historical survey of Western music from the Classical period to the present with an emphasis on understanding stylistic traits and theoretical concepts of the eras. Topics include the development of genres such as sonata, string quartet, concerto, symphony, symphonic poem, character piece, Lied, and opera; and 20th century trends of impressionism, primitivism, atonality, serialism, minimalism, aleatoric music, and electronic music. No prior background in music is necessary. Students may not receive credit for both MU 2721 and MU 2002"
    clauses: []
    noCreditWith:
      - MU|2721
  - courseId: MU|2100
    description: "Cat. I This course will investigate the sonic organization of musical works and performances, focusing on fundamental questions involved in the process of composition: How do I connect different ideas? How can I make a larger work out of smaller parts? How can I vary statements to create interest without compromising coherence? Where do I start? A progressive series of composition projects will build techniques in relevant areas including rhythm, harmony, melody, and form. Exercises in mechanics will be complemented by contemplation and discussion of artistic, aesthetic and philosophical ideas that are equally important in the compositional process. We will examine the relationship between musical works and how they are communicated as instructions to others (e.g. orally, as symbols, prose, graphic images, or computer programs). Weekly listening, reading, and composition assignments draw on a broad range of musical styles and intellectual traditions from various cultures and historical periods. Recommended background: understanding of basic music theory through coursework (e.g. MU 1511, Introduction to Music or MU 1611, Fundamentals of Music) or equivalent experience."
