  - courseId: WR|4210
    description: "Cat. II Medical Writing will provide students with advanced opportunities to create clinically-oriented documents about disease, treatment, and medical research. Students will learn how to develop, structure, and present medical reports that integrate anatomy and physiology, disease history (including associated human and environmental factors), epidemiology, clinical presentation, differential diagnosis, and prognosis. The course will operate as a series of student projects in which students create scientific documents from major disease categories. The course will be focused on disease characterization for more advanced audiences and preparation for future graduate and professional writing in medicine or the life sciences. Students may not receive credit for both WR 4210 and WR 421X. Recommended background: Prior courses or projects (GPS, IQP) in health, medicine, or science writing. Exposure to anatomy and physiology would be helpful. The course is designed for 3rd and 4th year students with a strong interest in pursuing careers or continued education in medicine or public health."
