  - courseId: BME|4607
    description: "Cat. I (1/6 unit) This application lab is a sequential extension of the corresponding techniques lab (BME 3607). This laboratory-driven transport course provides hands-on experience in measuring fluid flow, and mass transport in biologically relevant systems. Students gain an in-depth understanding of the course material from personal observations and measurements on model cardiovascular systems and connective tissues. Challenge-based laboratory projects will be assigned, requiring the students to determine and execute effective test methods at their own pace in a team setting and communicate their findings effectively. Systems modeled may include blood vessels, stenotic vessels, artificial heart valves and aneurysms. Connective tissues tested may include biomaterials, blood vessels and skin. Recommended Background:Theory and laboratory techniques related to measurement of process variables such as pressure and flow rates, molecular diffusion apparatus and related equipment covered in BME 3607 Biotransport Laboratory: Techniques, Basic Chemistry (CH 1010, CH 1020), Basic Physics (PH 1010), and a knowledge of cell biology (BB 2550), and data analysis (BME 2210), or equivalent. ~Note: Students who previously took BME 3605 will not get credit for BME 4607."
