  - courseId: EN|2225
    description: Cat. II This course begins with selections from John Milton’s provocative version of Adam and Eve’s original sin in Paradise Lost. Focusing on Milton, John Donne and others, we will examine the theme of sin—political, religious, and sexual— in early modern literature. The events of the English Reformation profoundly influenced these writers, and their personal struggles against societal institutions have greatly influenced subsequent literary expressions of rage and rebellion. Students will also be reading texts by contemporary writers such as David Mamet which address the theme of sin in the modern city. This course will be offered in 2020-21, and in alternating years thereafter.
    clauses: []
    noCreditWith: []
  - courseId: EN|2251
    description: Cat. I This course focuses on the problem of how to live in the modern world. Emphasis will be placed on the way moral issues evolve within the complications of individual lives, as depicted in fiction. Such authors as Conrad, Kesey, Camus and Ellison show characters struggling with the questions of moral responsibility raised by love, religion, death, money, conformity.
    clauses: []
    noCreditWith: []
  - courseId: EN|3226
    description: Cat. II This course examines the concept of “strange” and the figure of the “stranger” in a wide range of written and visual texts, from Shakespeare to Albert Camus to the 2017 horror/comedy film Get Out. We will focus on depictions of religious, racial, gendered, and other forms of alienation and otherness, from both an insider’s and outsider’s perspective. This course will be offered in 2020-21, and in alternating years thereafter.
    clauses: []
    noCreditWith: []
