department: ECON
entries:
  - courseId: ECON|1110
    description: Cat. I The course focuses upon the implications of reliance upon markets for the allocation of resources in a society, at the household, firm, and community level. Outcomes of current market systems are examined in terms of the efficient use of natural and other economic resources, as well as their impact upon the environment, fairness, and social welfare. of special interest in these analyses is the role of prices in the determination of what commodities are produced, their means of production, and distribution among households. In cases where current market outcomes have features subject to widespread criticism, such as the presence of excessive pollution, risk, discrimination, and poverty, the analysis is extended to suggest economic solutions. There are no prerequisites for the course.
    clauses: []
    noCreditWith: []
  - courseId: ECON|1800
    description: "Cat. III (Credits will be assigned by the instructor, either 1/6 or 1/3 unit) This course provides an opportunity for students with little to no background in economics to learn about a special topic in Economics. Recommended background: none. This course may be repeated for different topics."
    clauses: []
    noCreditWith: []
  - courseId: ECON|2110
    description: "Cat. II The topics addressed in this course are similar to those covered in ECON 1110 (Introductory Microeconomics) but the treatment proceeds in a more rigorous and theoretical fashion to provide a firm platform for students majoring in Economics or Business, or those having a strong interest in economics. Mathematics at a level comparable to that taught in MA 1021-MA 1024 is frequently applied to lend precision to the analysis. The course rigorously develops the microeconomic foundations of the theory of the firm, the theory of the consumer, the theory of markets, and the conditions required for efficiency in economic systems. Recommended background: ECON 1110. This course will be offered in 2019-20, and in alternating years thereafter."
