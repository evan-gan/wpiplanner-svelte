  - courseId: AE|5131
    description: "This course presents topics in incompressible fluid dynamics at the introductory graduate level. Topics are chosen from: continuum fluids; kinematics and deformation for Newtonian fluids; integral and differential form of the mass conservation, momentum, and energy equations; potential flows; unidirectional steady incompressible viscous flows; unidirectional transient incompressible viscous flows; boundary layers; vortical flows. Students cannot receive credit for this course if they have taken AE/ME 5101 “Fluid Dynamics” or AE/ME 5107 “Applied Fluid Dynamics.”"
    clauses: []
    noCreditWith:
      - AE|5101
      - ME|5101
      - AE|5107
      - ME|5107
  - courseId: AE|5132
    description: "This course presents applications of compressible fluid dynamics at an introductory graduate level. Topics are chosen from: conservation laws; propagation of disturbances; compressible flow with friction; method of characteristics, analysis and design of supersonic nozzles, diffusers, and inlets; transonic and supersonic thin-airfoil theory; three-dimensional compressible flows; compressible boundary layers; hypersonic flows; unsteady compressible flows. Students cannot receive credit for this course if they have taken AE 5093 ST: Applied Compressible Fluid Dynamics."
    clauses: []
    noCreditWith:
      - AE|5093
  - courseId: AE|5134
    description: "The course introduces concepts of partially ionized gases (plasmas) and their role in a wide range of science and engineering fields. Fundamental topics include: motion of charged particles in electromagnetic fields; equilibrium kinetic theory; collisions; transport theory; fluid equations; mmagnetohydrodynamic models; sheaths. Application topics are chosen from: plasma diagnostics; plasma discharges; spacecraft/environment interactions, and plasma-assisted materials processing. Students cannot receive credit for this course if they have taken AE/ME 5110 “Introduction to Plasma Dynamics”."
    clauses: []
    noCreditWith:
      - AE|5110
      - ME|5110
  - courseId: AE|5231
    description: "This is an introductory graduate level course that covers principles of operation, design, and performance analysis of air-breathing propulsion engines. Topics will be chosen from: jet propulsion theory; cycle analysis of turbojets, turbofans, and ram compression engines; gas dynamics of inlet and nozzle flows; thermochemistry and chemical equilibrium; combustor modeling; hypersonic propulsion; and operation of detonation engines. Students cannot receive credit for this course if they have taken AE 5106 “Air Breathing Propulsion”."
    clauses: []
    noCreditWith:
      - AE|5106
  - courseId: AE|5232
    description: This course introduces concepts needed to evaluate the performance of the most commonly used electric and chemical spacecraft propulsion systems. Fundamental topics in electric propulsion include plasma generation and ion acceleration, magnetic field design, and beam neutralization. Applications include electrostatic ion and Hall thrusters. Fundamental topics in chemical propulsion include propellant thermochemistry and ideal performance. Applications include bipropellant and monopropellant chemistry, catalyst-bed, and nozzle design considerations. Discussion of each class of thruster will be supplemented with specific examples of flight hardware. Students cannot receive credit for this course if they have taken AE/ME 5111 “Spacecraft Propulsion”.
    clauses: []
    noCreditWith:
      - AE|5111
      - ME|5111
  - courseId: AE|5431
    description: "This course is an introductory graduate level course. Fundamental topics will be chosen from the following: three-dimensional states of stress; measures of strain; plane stress and plane strain; thermoelasticity; Airy stress function; and energy methods. Applied topics will be chosen from the following: bending and shear stresses on unsymmetric cross-sections; bending of composite beams; bending of curved beams; torsion of thin-walled noncircular cross sections; and failure criteria. Students cannot receive credit for this course if they have taken AE/ME 5380 “Foundations of Elasticity” or AE/ME 5381 “Applied Elasticity”."
    clauses: []
    noCreditWith:
      - AE|5380
      - ME|5380
      - AE|5381
      - ME|5381
  - courseId: AE|5432
    description: "This course covers the anisotropic constitutive behavior and micromechanics of composite materials, and the mechanics of composite structures at an introductory graduate level. Topics covered will be chosen from: classification of composites (reinforcements and matrices) anisotropic elasticity, composite micromechanics, effect of reinforcement on toughness and strength of composites, laminate theory, statics and buckling of laminated beams and plates, statics of laminated shells, residual stresses and thermal effects in laminates. Students cannot receive credit for this course if they have taken AE 5383 “Composite materials”."
    clauses: []
    noCreditWith:
      - AE|5383
  - courseId: AE|5531
    description: "The course provides at an entry graduate level the theory and practice of finite difference and finite elements methods for partial differential equations (PDEs) encountered in fluid dynamics and solid mechanics. Topics covered include: classification of partial PDEs and characteristics; direct and iterative solution methods for solution of algebraic systems; finite difference and finite element spatial discretization; temporal discretization; consistency, stability and error analysis; explicit and implicit finite differencing and finite element schemes for linear hyperbolic, parabolic, elliptic PDEs. The course requires completion of several projects using MATLAB. Students cannot receive credit for this course if they have taken AE/ME 5108 “Computational Fluid Dynamics”."
    clauses: []
    noCreditWith:
      - AE|5108
      - ME|5108
  - courseId: AE|6435
    description: "This course focuses on the analytical techniques and applications of fracture mechanics at introductory graduate level. In particular, there is an emphasis on cracks in linear elastic and elasto-plastic materials encountered in high integrity aerospace structural applications. Topics covered will be chosen from: stress concentration and stress singularity near cracks, computation of stress intensity factors and asymptotic K fields, linear elastic fracture mechanics, energy methods, stability of crack propagation, cohesive fracture, basics of plasticity theory, plastic zone, small-scale yielding (SSY), HRR asymptotic fields, mixed mode fracture and elasto-plastic crack growth."
    clauses: []
    noCreditWith: []
  - courseId: AE|6532
    description: "This course presents finite element methods with applications to structures and structural dynamics at introductory graduate level. It focuses on linear elasticity and topics covered will be chosen from: introduction on numerical methods in solids mechanics; variational methods of approximation; formulation of finite elements and interpolation functions; assembly and solution processes; isoparametric formulation; stress recovery procedures; locking phenomenon; and dynamic problems. The course requires completion of several FEM projects and knowledge of a computer programming language."
    clauses:
      - strength: required
        timing: prior
        sourceText: knowledge of a computer programming language
        requirement:
          kind: topic
          topic: knowledge of a computer programming language
    noCreditWith: []
