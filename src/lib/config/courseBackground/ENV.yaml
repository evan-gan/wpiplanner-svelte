    noCreditWith: []
  - courseId: ENV|2710
    description: "Cat. II Resilience is the capacity to adapt to changing conditions and to bounce back after a disaster. Through resilience we can live, and even thrive, in the face of natural disasters. Resilience involves adaptation to the wide range of regional and localized impacts that are expected with a warming planet: more intense storms, greater precipitation, coastal and valley flooding, longer and more severe droughts in some areas, wildfires, melting permafrost, warmer temperatures, and power outages. Resilient design is the intentional design of buildings, landscapes, communities, and regions in response to these vulnerabilities. In this course, we will work to better understand what is at risk in a changing climate with more extreme and frequent disasters, the role people/companies and policies play in these disasters, who is most at risk and why, and develop resilient designs focused on practical, innovative, on-the-ground, and just solutions. Students may not receive credit for both ENV 271X and ENV 2710 Recommended background: None"
    clauses: []
    noCreditWith:
      - ENV|271X
  - courseId: ENV|2720
    description: "Cat. II This course examines current and potential uses for artificial intelligence (AI) in conservation, climate action, and to accelerate and scale sustainability efforts. It also examines current and potential negative environmental impacts, from energy and water consumption to electronic waste and environmental injustice. This course uses a case study approach and diverse theoretical perspectives to examine and analyze current and emerging uses of AI in forestry sustainability, firefighting, flood and pollution prediction, climate modeling, biodiversity cataloguing, and more. Cases will also be used to understand current community and environmental impacts associated with mineral extraction, water and energy use, and greenhouse gas emissions. Students will consider debates and relationships surrounding data capitalism, AI, climate change, and social justice. In a rapidly changing and developing AI landscape, students will choose a topic on AI and the environment to explore the current benefits and harms of the use of AI in their context of focus for humans, ecosystems, and the planet. They will also research and analyze ways to reduce harm and enhance the social and environmental benefits of AI in their context of focus. Recommended background: None"
    clauses: []
    noCreditWith: []
  - courseId: ENV|3100
    description: "Cat. II This course will take students on an adventure, both in the class and in the field. Students will examine the history of sustainable development, its antecedents, the factors that have influenced its evolution, and how the sustainable city came into existence. Students will be invited on a number of virtual field trips to sustainable cities from around the world. The goal will be to explore the underlying factors of sustainable urbanism, why it looks the way it does in different places, and how students can exercise their own agency in developing alternatives. Students will also develop their own field trips for publication on the course website. Suggested background: introduction to environmental studies and a passion for urban exploration. This course will be offered in 2019-20, and in alternating years thereafter."
