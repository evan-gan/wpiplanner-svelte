  - courseId: IGS|410X
    description: "During IGS410X, students will utilize their newfound environmental literacy and leadership abilities. Students will serve as peer mentors to students enrolled in IGS220X and IGS310X [i.e., new participants in the LEAF (Leaders in Environmental Action for the Future) Initiative], and will be paired with a local environmental organization or on-campus sustainability initiative to develop a long-term executable project. Once developed, the IGS410X students will work with students in Environmental Leadership Foundations II (IGS220X) and Environmental Leadership Applications (IGS310X) to execute the project. IGS410X students will be responsible for managing, overseeing, and completing the project. At the conclusion of this IGS410X course, students may give a conference presentation or contribute to a publication on their project work. Required Background: Completion of Environmental Leadership Foundations I (IGS210X) and II (IGS220X), and Environmental Leadership Applications (IGS310X). NOTE: This course is part of the Leaders in Environmental Action for the Future (LEAF) Initiative."
