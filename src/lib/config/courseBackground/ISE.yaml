  - courseId: ISE|1801
    description: "This course is for international students who want to develop their academic writing skills through a sequence of essay assignments, with emphasis on rhetorical and grammatical issues particular to second language learners (ESL) . Students will concentrate on producing coherent paragraphs, developing short essays in a variety of rhetorical modes, and improving mechanics (grammar and punctuation) and vocabulary usage. Both personal and academic writing assignments provide practice in the process of writing and revising work for content and form . Recommended Background: ISE 1800 or equivalent skills (determined by Writing Placement or consent of the instructor) ."
