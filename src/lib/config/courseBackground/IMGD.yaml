  - courseId: IMGD|2200
    description: "WR 2200/IMGD 2200: AI in Writing and Communication (Cat. II) Generative AI is transforming the practices of writing and communication. It also generates new questions about authorship, responsibility, creativity, authenticity, and other rhetorical constructs that affect us equally as citizens and professionals. This course offers the foundations of critical AI literacy. It aims to help students develop a robust understanding of what this transformation means, and what kind of new sensibilities and skills are needed in response to an AI-led transformation. The course focuses on: 1) technological and cultural trends that shape the perception of generative AI, 2) ethical concerns emerging from the use of generative AI in professional and nonprofessional contexts, and 3) effective and responsible practices of using generative AI in writing and other forms of communication. In addition to reading assignments, students will have the opportunity to experiment with generative AI and assess its limits and possibilities. The assignments include critical annotations, fact-checking procedures, creative workflow processes, ethical analyses, and interaction design inquiries. Recommended Background: None"
    clauses: []
    noCreditWith: []
  - courseId: IMGD|2222
    description: "Cat. I. 2D Animation I teaches students how to draw, pose, breakdown and in-between characters for 2D animation, focusing on weight, balance, timing, and movement to achieve well-structured and fluid animation. Lectures and projects are conducted to train students in the twelve classical animation principles using digital 2D media. Projects and lectures are designed to practice the fundamentals of traditional frame-by-frame and hand-drawn character animation. Recommended background: Basic knowledge of figure drawing (AR 2202) and digital art software (AR 1101) is recommended."
