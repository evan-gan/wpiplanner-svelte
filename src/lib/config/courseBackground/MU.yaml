  - courseId: MU|1000
    description: "MU 1000: Music and Its Makers (1/3 unit; Cat. I) This course will introduce students to interdisciplinary music studies by focusing on the people who create musical meaning: performers, composers, listeners, patrons, writers, and more. As we analyze significant musical works, we will also learn about the broader cultural, historical, and social contexts in which they appeared, and the people involved in their creation – including women and people of color, who are often minimized in discussions of music history. Historical examples will be juxtaposed with contemporary musical works from an array of genres, allowing students to compare today’s musical cultures to past ones. Students will also analyze the role of music in their own lives. Recommended background: No prerequisites. A basic reading knowledge of music is helpful, but not required."
    clauses:
      - strength: suggested
        timing: prior
        sourceText: A basic reading knowledge of music is helpful, but not required.
