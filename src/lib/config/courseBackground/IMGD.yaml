    description: Cat. II Level Design and Environmental Storytelling This course covers the broad topic of designing environments, maps, and spaces for games and interactive media. The course uses a variety of lenses, such as architecture, visual composition, drama, and interactive design, introducing key concepts through texts, analyzing them in designed spaces from digital media and elsewhere, and then applying them through creative work in a range of formats. Interactive spaces embody more than the tools, perspectives, or disciplines they are built from, and this course focuses on mastery of overall design principles as a synthesis of these, including presentation of finished works in document, image, and video capture. Recommended background includes familiarity with 3d art and design software, interactive design fundamentals, such as AR 2101 and IMGD 2740, and experience with the development cycle, such as IMGD 1001 and IMGD 2900.
