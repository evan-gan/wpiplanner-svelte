  - courseId: HI|3334
    description: "HI 3334 Topics in the History of American Science and Technology (Cat. I) This seminar will examine a particular issue or theme in the history of American science and technology. Topics will vary from year to year, but may include: technology and the built environment; science, technology and the arts; communications of science and scientific issues with the larger public; technology and scientific illustration; science in popular culture; science and the law; or close examination of episodes in the history of American science and technology such as the American Industrial Revolution; science and technology in the years between the world wars; the Manhattan Project; science and the culture of the Cold War; or science, technology and war in American history. This course will require significant reading and writing. This course may be repeated for different topics . Recommended Background: Some familiarity with history of science or history of technology, and with United States history."
