  - courseId: MFE|511
    description: (Concurrent with ME 4815) This course introduces the student to the field of industrial automation. Topics covered include robot specification and selection, control and drive methods, part presentation, economic justification, safety, implementation, product design and programming languages. The course combines the use of lecture, project work and laboratories that utilize industrial robots. Theory and application of robotic systems will be emphasized.
