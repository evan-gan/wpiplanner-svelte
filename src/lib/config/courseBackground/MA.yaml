  - courseId: MA|2631
    description: "Cat. IThe purpose of this course is twofold:- To introduce the student to probability. Topics to be covered will be chosenfrom: axiomatic development of probability; independence; Bayes theorem;discrete and continuous random variables; expectation; special distributionsincluding the binomial and normal; moment generating functions; multivariatedistributions; conditional and marginal distributions; independenceof random variables; transformations of random variables; limit theorems.- To introduce fundamental ideas and methods of mathematics using thestudy of probability as the vehicle. These ideas and methods may includesystematic theorem-proof development starting with basic axioms;mathematical induction; set theory; applications of univariate andmultivariate calculus.This course is designed primarily for Mathematical Sciences majors and thoseinterested in the deeper mathematical issues underlying probability theory.Recommended background: MA 1024.Undergraduate credit may not be earned both for this course and for MA 2621."
