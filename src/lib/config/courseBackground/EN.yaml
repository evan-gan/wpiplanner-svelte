  - courseId: EN|1439
    description: "This course surveys the aesthetics, forms, histories, and politics of poetic expression from ancient, modern, and contemporary periods, focusing primarily on English-language examples while simultaneously incorporating works across world literatures, in original texts or in English translations. Attention may be given to epic, dramatic, and lyric modes, to elegies, odes, repeating forms (sonnet, villanelle), and short forms (epigram, haiku), and to specific architectures of poetry including address, assonance and consonance, closure, lineation, meter, rhyme, rhythm, and stanzaic structure. Recommended background: None."
    clauses: []
    noCreditWith: []
  - courseId: EN|2219
    description: "EN2219 Creative Writing (Cat. I) This writing workshop aims to help students develop or improve the skills of written expression, emphasizing presentation and discussion of original work. Offerings may include themed courses covering multiple genres or specialized workshops in single genres of focus such as fiction, poetry, or creative nonfiction. This course may be repeated for different genres . Recommended Background: Introductory level creative writing (EN1219: Introduction to Creative Writing)"
