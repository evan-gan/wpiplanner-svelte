  - courseId: SP|1523
    description: This intensive course, through a communicative approach, introduces students to the structures, essential vocabulary, and knowledge of the language and cultures of the Spanish-speaking world. Using the interpretive, interpersonal, and presentational communication modes at a basic level, students will start to build their Spanish language proficiency and their intercultural communicative competence by completing simple tasks in speaking, writing, reading, and listening using basic level content and contexts. By the end of this course, students will be able to ask questions and communicate short messages to describe themselves and their immediate environment. The course is designed for students with little or no previous knowledge of Spanish and is closed to native and heritage speakers of Spanish. To enroll in this course, you must obtain written permission from one of the Spanish professors. Students with previous knowledge of Spanish are encouraged to take the Spanish Placement Test offered by a WPI Spanish faculty member via CANVAS.
