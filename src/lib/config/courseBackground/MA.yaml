  - courseId: MA|2273
    description: "Cat. II This course introduces the concepts and techniques of combinatorics— a part of mathematics with applications in computer science and in the social, biological, and physical sciences. Emphasis will be given to problem solving. Topics will be selected from: basic counting methods, inclusion-exclusion principle, generating functions, recurrence relations, systems of distinct representatives, combinatorial designs, combinatorial algorithms and applications of combinatorics. This course is designed primarily for Mathematical Sciences majors and those interested in the deeper mathematical issues underlying combinatorics. Undergraduate credit may not be earned both for this course and for MA 3273. Recommended background: MA 2071. This course will be offered in 2019-20, and in alternating years thereafter."
