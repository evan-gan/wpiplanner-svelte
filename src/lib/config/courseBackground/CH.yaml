    description: "Cat. I Through lectures, problem sets, reading and discussion, and presentations this course will help elucidate for students the processes that allow regulated gene expression, mechanisms used in each type of regulation, and methods and techniques used for investigation of regulatory mechanisms . Readings from the current original research literature will explore the growing use of model systems and “omics” level approaches to enhance our ever expanding understanding of the gene regulatory mechanisms. The development of cell-based therapeutics and genetic engineering as they relate to gene regulation will be introduced. Recommended background: a working knowledge of concepts in biochemistry and molecular genetics (CH 4110 and 4120, or equivalent, and CH 4130 or BB 3950 or equivalent)"
