  - courseId: EN|2271
    description: "EN 2271 American Literary Histories (Cat. I) An investigation into one or more major movements or periods in American literature, focusing on aesthetic formations such as sentimentalism, realism, modernism, or postmodernism, on cultural formations from Transcendentalism and Regionalism through the Lost Generation and the Harlem Renaissance to the Beat Generation and the Native American Renaissance, or delivered through chronological engagements by century, by decade, or by other suitable framings attending to specific communities or sets of writers. This course may be repeated for different topics . Recommended Background: None, though coursework in English (e.g. EN 1251, Introduction to Literature) or any subsequent EN offering will be helpful."
