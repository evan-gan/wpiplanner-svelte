  - courseId: RBE|300X
    description: "This course introduces students to the concepts, techniques, and technologies involved with designing real-world systems software for robotics. Software for robot systems presents unique challenges, because of its inherent real-time, asynchronous, and distributed nature, as well as robots' interaction with the physical world. The course can be understood as a “build your own Robot Operating System (ROS) ”, in that its philosophy is to expose the students to the design and implementation challenges involved in creating systems software of this kind. In the first part of the course, the students will be introduced to foundational software architectures for robotics such as finite state machines, behavior trees, the subsumption architecture, and publish-subscribe architectures. The students will explore how to implement and combine these architectures into a coherent software framework. The second part of the course deals with fault and error management, specifically on the impact of these adverse events on architecture design. The final project will challenge the students to deploy and demonstrate their own software platform for navigation on a real robotic platform. RBE majors may use this course to fulfill their Software Engineering requirement. RBE/CS double majors should consider taking CS 3733 as it counts towards both majors. Recommended Background: Significant programming experience with an object-oriented language, such as Python or C++ , as found in CS 2102 . Fundamentals of robot motion and control, for example as found in RBE 2001 and RBE 2002 ."
    clauses:
      - strength: recommended
        timing: prior
        sourceText: "Recommended Background: Significant programming experience with an object-oriented language, such as Python or C++ , as found in CS 2102 ."
        requirement:
          kind: topic
