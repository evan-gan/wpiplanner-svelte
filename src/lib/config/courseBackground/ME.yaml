  - courseId: ME|5381
    description: "(2 credits) This course is suitable as an introductory graduate level course. Topics covered will be chosen from the following: bending and shear stresses in unsymmetric beams; bending of composite beams; bending of curved beams; torsion of thin-walled noncircular cross sections; beams on elastic foundations; stress concentrations; failure criteria; stability of columns; and bending of plates. This course may be taken independent of ME 5301."
