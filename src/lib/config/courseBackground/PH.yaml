  - courseId: PH|580
    description: (0 credits) Students attend Physics Colloquia by WPI faculty and invited scientists on current research topics in different areas of physics. They discuss results and ideas presented in those talks. In addition, students give presentations on their research or on problems of current interest to physics community. The course therefore will provide opportunities for students to develop their presentation skills, broaden their perspectives and provide networking opportunities. All full-time physics graduate students are required to register and attend.
