  - courseId: MU|2450
    description: "ISU Students electing to complete their Humanities and Arts Requirement in music may, for one of their five courses, undertake 1/3 unit (normally at 1/12 unit per term) of private vocal or instrumental instruction. (Supplemental ensemble work is also strongly recommended.) The student must receive prior approval by a member of the WPI music faculty, and the instruction must be beyond the elementary level. Lessons involve a separate fee. Note that the maximum of 1/3 unit credit for lessons may be earned in addition to 1/3 unit credit for performance (see condition A or B below). Additional work, either in performance or lessons, may be acknowledged on the WPI transcript but will carry no WPI credit. Private lessons: voice, piano, organ, winds, brass, strings, and percussion."
