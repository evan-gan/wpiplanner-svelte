  - courseId: IMGD|5010
    description: In this course, students learn foundational theories and gain foundational skills in interactive media, game development, and computational media targeted at the graduate level, for students with a prior undergraduate background in related fields. Students will read about contemporary challenges in application of these fundamentals to IMGD-related projects, and build disciplinary knowledge and practices necessary for the creation of interactive media and/or games. Topics covered in this course alternate each year based on instructor. Different instantiations of the course cover topics in programming and computing in media contexts (computation studio), art asset conceptualization, creation, and iteration (visual arts studio), audio remixing and composition methods (audio lab), and narrative in interactive contexts (narrative design lab). This course will be offered each year, with topic defined by the faculty member teaching it.
    clauses: []
    noCreditWith: []
  - courseId: IMGD|5400
    description: "This course focuses on the process of creating a set of documents encompassing the design and vision of a piece of interactive media, methods for structuring the implementation of the design, and tools for successfully managing the project . Students will analyze different types of design documents, focusing on form and purpose while also considering audience and publication medium . Students will write design documents, give peer feedback, and revise their own documents based on feedback received . In order to see their design transform from document to product, students will study different project management methods and employ them, defining in detail discrete components, timelines, milestones, players and their responsibilities, and status reports to stakeholders . Tools common to managing interactive media projects (e .g ., source-code revision control, asset management, scheduling) will be used throughout the process . (Prerequisites: Experience working on development projects)"
    clauses:
