  - courseId: IMGD|2500
    description: "Cat II (1/3 units) - This course familiarizes students with the history of tabletop games and board games, current trends in board game design, and the fundamentals in game design through the study of and creation of board games. Students will gain critical thinking skills through the playtest and revision process of designing their own board games, and students will be exposed to the realities of publishing board games and the limits the production process imposes on design. Recommended background: None"
