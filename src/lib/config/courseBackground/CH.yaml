    description: Cat. II Modern synthetic methods as applied to the construction of societally relevant target molecules will be the focus of this course. Discussions may emphasize the logic and strategy in synthetic approaches toward active pharmaceutical ingredients, agrochemicals, fine chemicals, materials, and other targets of interest. The analysis of current examples from the primary literature will draw attention to the most state-of-the-art synthetic tactics. Recommended for graduate students and undergraduates who have a basic understanding of the principles governing organic reactions, such as those covered in CH2310, CH2320, and CH2330. This course will be offered in 2020-21 and alternate years thereafter.
