  - courseId: RBE|455X
    description: "Motion Planning is the study of algorithms that reason about the movement of physical or virtual entities. These algorithms can be used to generate sequences of motions for many kinds of robots, robot teams, animated characters, and even molecules. This course will cover the major topics of motion planning including (but not limited to) planning for manipulation with robot arms, mobile robot path planning with kinodynamic constraints, multi-robot path planning, and high-dimensional sampling-based planning. Students will implement motion planning algorithms in open-source frameworks such as OMPL, and complete projects that draw on the course material. Students may not receive credit for both the undergraduate (RBE 455X) and the graduate version of this course (RBE 550). Recommended Background: Undergraduate Linear Algebra as covered in MA 2071 , Ordinary differential equations as covered in MA 2051 , knowledge of algorithmic principles, kinematics, and significant programming experience, as covered in RBE3001 and RBE3002."
