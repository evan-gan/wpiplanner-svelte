  - courseId: BME|4301
    description: "BME4301 Biomedical Capstone - Design from the Margins (Units: 1/3; Cat. I) This course will explore open-ended problems at the intersections of engineering, biology, and social responsibility. This course challenges students to thoughtfully and consciously apply the engineering design process to develop innovative and accessible solutions for healthcare issues affecting marginalized communities. This course aims to empower students to become socially conscious engineers, equipped with the skills and knowledge to make a meaningful difference in the healthcare outcomes of marginalized communities. By the end of the course, students will have a deep understanding of the ethical and practical dimensions of engineering solutions in biomedical applications, particularly for those who are most vulnerable in society. This class can be counted toward the BME capstone design requirement. Recommended Background: Proficiency in applying the engineering design process to open ended problems (BME 3300 or equivalent)"
