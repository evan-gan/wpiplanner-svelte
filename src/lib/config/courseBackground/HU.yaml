  - courseId: HU|1500
    description: Cat II. This foundational course offers an introduction to the interdisciplinary field of gender, sexuality and women’s studies . The course fosters critical examination of gender, sexuality and women and asks how the interlocking systems of oppression, including colonialism, racism, sexism, homophobia, transphobia, and ethnocentrism, shape people’s lives, and how individuals and groups have worked to resist these oppressions. Potential course topics include histories of gender activism, gender, sexuality and their relationships to the law, religion, reproduction, education, technology, and mental health, globalization and transnational experiences, and the role of popular culture. No prior background is required This course will be offered in 2020-21, and in alternating years thereafter.
    clauses: []
    noCreditWith: []
  - courseId: HU|2251
    description: "Cat. II This course provides an introductory window into the history and theory of film, and may cover genres from short films, silent films, animated films, documentary films, and experimental films to historical and literary adaptations, science fiction films, screwball comedies, thrillers, and westerns. In addition, attention may be given to representative directors, significant theories of film, national traditions of filmmaking, and recent convergences between film forms and digital media. Directors covered may include Charlie Chaplin, John Ford, and Alfred Hitchcock. Film theorists covered may include Stanley Cavell, Sergei Eisenstein, and Trinh T. Minh-ha. This course will be offered in 2020-21, and in alternating years thereafter. Recommended background: None."
    clauses: []
    noCreditWith: []
  - courseId: HU|2501
    description: "Cat. II The study and practice of STEM-inism centers the equal participation and representation of all social groups in the fields of science, technology, engineering, and math (STEM). In particular, this course highlights the concepts, theories, and practices of feminism into its understanding of STEM-inism as a field of inquiry. This course provides an overview of the history of female and non-binary contributors and contributions to this field of study and practice, ranging from Hypatia to Ada Lovelace to NASA visionary Katherine Johnson to queer and trans STEM visionaries Martine Rothblatt, Joan Roughgarden, and Lynn Conway. This course may also consider the following topics: the gender gap in STEM fields, biases in medical research, sexual harassment, eugenics, reproductive justice, transgender rights, and contemporary social movements. The course will also incorporate a deliberate analysis of intersecting identity categories, including race, class, sexuality, religion, and ability."
    clauses: []
    noCreditWith: []
  - courseId: HU|2901
    description: "This course uses interdisciplinary, thematic, and case study approaches to explore sexuality in the modern world. It takes as its starting point the understanding that sex and power are interrelated and that they manifest differently in different social and cultural contexts (including spaces and places to which WPI students may travel as part of their global projects experience). Further, this course recognizes that the categorization, experiences, and treatment of queer persons and bodies and non-normative sexuality have changed over time and space, as have sexual mores and conceptualizations of “purity” and “deviance,” which are linked to class, race, dis/ability, and power relations within and between states. This course may include the study of the history of sexuality in the United States and globally; national and international activism around sexual liberation and LGBTQ+ pride; religion and sexuality; the relationship of LGBTQ+ activism to other civil rights movements; sex work; sexual violence; cultural representations of queer and non-normative sexualities, and “anti-genderism” and authoritarian populism. This course may be repeated for different topics. Recommended background: None"
    clauses: []
    noCreditWith: []
  - courseId: HU|3900
    description: Cat. I This seminar serves as the culmination for a student's Humanities and Arts Requirement. The seminar provides opportunities for sustained critical inquiry into a focused thematic area. The seminar seeks to help students learn to communicate effectively, to think critically, and to appreciate diverse perspectives in a spirit of openness and cooperation through research, creativity, and investigation. The specific theme of each seminar will vary and will be defined by the instructor. Prior to enrolling in the seminar, a student must have completed five courses in Humanities and Arts, at least two of which must be thematically related and at least one of which must be at the 2000-level or above.
