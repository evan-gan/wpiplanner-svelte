  - courseId: ME|3820
    description: "Cat. I This introductory course in modern control systems will give students an understanding of the basic techniques, and the range of equipment used in most computer controlled manufacturing operations. The class work is reinforced by hands-on laboratories in the Robotics/CAM lab. Modeling and analysis of machining processes, and applications of PLC (programmable logic control) are included. Class topics include: Manufacturing Automation, Microcomputers for Process Monitoring and Control, Computer Numerical Control, Switching Theory and Ladder Logic, Transducers and Signal Conditioning, and Closed Loop Digital Control. The laboratories allow students to program and implement several types of the controllers, and will provide an introduction to the topic of industrial robotics. Recommended background: manufacturing (ME 1800), materials processing (ME 2820), elementary computer/logic device programming."
