  - courseId: BME|593
    description: "Clear oral, written, and graphical communication of scientific methods and data is an essential skill for success, both in research and in industry. This course will cover aspects of scientific communication including: scientific manuscript preparation and the peer review process, technical report organization, graphical presentation of quantitative data, and oral presentation of scientific information. Organization and clarity will be emphasized in communicating scientific methods, results, and interpretation. Students will complete regular writing and presentation assignments and participate in peer critique sessions. Students will complete an original research article, review article, or technical report as a final project. Students may not receive credit if they previously completed this course as BME 595: Special Topics. *Does not fulfil technical depth requirement."
    clauses: []
    noCreditWith:
      - BME|595
  - courseId: BME|595
    description: BME 595-ST/ECE 539-ST Wearable/Mobile Sensors and Systems (3 credits) This course explores the design and application of small-size, low-power wearable sensors, with a focus on medical- and health-related uses. Students will begin by learning about sensor technologies and electronic circuits that transduce common physiologic signals, including the electrocardiogram (ECG), electromyogram (EMG), electroencephalogram (EEG), photoplethysmogram (PPG; for pulse oximetry), transcutaneous oxygen measurement, temperature, and inertial measurement units (IMUs). The course then delves into modern system-on-chip (SoC) microcontroller units, which serve as small edge devices equipped with analog-to-digital converters (ADC), processors and integrated wireless connectivity via Bluetooth Low Energy (BLE). Students will study the architecture and programming of these systems. Additionally, the course covers how a secondary BLE receiver on a more powerful device collects sensor data for display, storage and processing; including as part of the Internet of Things (IoT). Key topics in signal processing include online or off-line techniques such as heart rate estimation from ECG/PPG data and EMG-based control of prosthetic devices. Through hands-on labs, students will design, build and program functional sensor systems. Students should have a working knowledge of MATLAB (or Python) and C programming and an undergraduate background in analog circuits and computer engineering. Undergraduate background in digital signal processing and/or wireless signals would be helpful, but not necessary. This special topics course may be repeated for credit if different topics are covered.
    clauses:
