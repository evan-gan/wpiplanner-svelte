    description: "A study of actuarial mathematics with emphasis on the theory and application of contingency mathematics in various areas of insurance. Topics usually included are: survival functions and life tables; life insurance; property insurance; annuities; net premiums; and premium reserves. Recommended background: An introduction to the theory of interest, and familiarity with basic probability (MA 2211 and either MA 2621 or MA 2631, or equivalent)."
