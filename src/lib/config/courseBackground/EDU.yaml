  - courseId: EDU|530
    description: "EDU 530: Performance Assessments in STEM Education (3 credits) In this online synchronous course, students unpack the elements of high-quality performance assessments that allow learners to demonstrate the knowledge and skills they have gained through a variety of methods. Approaches to grading and feedback to learners through an asset-based framework will be discussed. Students will analyze different types of rubrics and develop a standard-aligned rubric for a STEM project of their choice. Recommended Background: This course is intended for practicing PK-12 educators. Students who are aspiring educators or with prior teaching experience should consult with the program director prior to registration. Students enrolled in the MS for Integrated STEM program should take EDU 500 before or concurrent to this course."
