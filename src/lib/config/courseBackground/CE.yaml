  - courseId: CE|587
    description: "This course introduces the concept of Building Information Modeling (BIM) which is a relatively new approach in planning, design, construction and operation of constructed facilities in a technologically enabled and collaborative fashion. The course reviews fundamental concepts for collaboration and integration; it also reviews technologies that support the BIM approach and provides discipline specific as well as global perspectives on BIM. The course format includes formal lectures, computer laboratory sessions, student presentations based on assigned readings and a project developed collaboratively by the students throughout the course. Guest speakers may be invited based on the topics covered and discussed in class. Prerequisites: Basic knowledge of computers. Exposure to professional practice in any area of the Architecture / Engineering / Construction / Facilities Management (A/E/C/FM) industry is desirable. Students are not permitted to receive credit for CE 587 if they have previously received credit for CE 585 or CE 590A-BIM."
    clauses:
