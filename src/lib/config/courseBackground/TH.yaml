  - courseId: TH|343X
    description: "This course examines the principles and practices of theatrical scenic design (including props). Through class discussion, hands-on activities, and creative design projects, students will acquire skills in all parts of the design process, including play analysis, visual/historical research, design development, and visual communication (which may include drafting, rendering, and/or model building). This course may also touch on adjacent fields, such as projections. Though primarily focused on live performance (theatre, dance, opera, etc.), this course will also teach ideas and skills applicable to other entertainment styles & mediums (film/TV, comedy, video games, theme parks, etc.) Recommended Background : This course is suitable for anyone interested in theatre, performance, or other forms of entertainment design. TH 2400: Fundamentals of Theatrical Design provides useful (though not essential) preparation for this course."
    clauses:
      - strength: suggested
        timing: prior
        sourceText: "TH 2400: Fundamentals of Theatrical Design provides useful (though not essential) preparation for this course."
        requirement:
          kind: course
          course: TH|2400
    noCreditWith: []
  - courseId: TH|3500
    description: "This course provides an in-depth look at a specific field or topic in theatrical design/production, such as props, projections, audio, electrics, millinery, stage makeup, scenic painting, puppetry, automation, etc. Through reading/viewing, discussion, and hands-on activities, students will learn about goals, applications, and mechanisms of the chosen topic, as well as the purpose and values of theatrical design & production more broadly. Students may repeat this course for credit with different topics. Units: 1/3 Category: Cat III. Recommended background: Students should have some background in theatrical design and/or production, either from taking a Theatre class (such as Fundamentals of Design or Technical Theatre) or working on a show."
