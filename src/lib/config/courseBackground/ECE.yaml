    description: "This course provides an introduction to the theory and practice of the design of computer communications networks according to IEEE 802 standard model for lower layers and IETF standard for TCP/IP higher layers. Analysis of network topologies and protocols, including performance analysis, is treated. Current network types including local area and wide area networks are introduced, as are evolving network technologies. The theory, design and performance of local area networks are emphasized. The course includes application of queueing analysis to performance analysis of medium access control (MAC) and application of communication theory in design of physical layer (PHY). Prerequisites: familiarity to MATLAB programming is assumed. Background in undergraduate level courses in networking, probability, statistic, and signal processing."
