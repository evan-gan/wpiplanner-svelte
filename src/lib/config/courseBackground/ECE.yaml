  - courseId: ECE|331X
    description: "ECE 33 1 X Software Radio Design , 1/3 Unit, Category I Today’s society is dependent on reliable , efficient , and seamless information exchange to support a wide range of applications such as financial transactions , telecommuting , remote learning, social interactions , gaming , and e-health . At the core of these vast and complex networks is digital communications, which maps our digital world of binary information to electromagnetic transmissions that need to travel from point A to point B. The primary objective of this course is two-fold: (1) To learn about the variety of different digital modulation schemes that leverage signal characteristics to communicate binary information over a transmission medium; and (2) To gain insight into the practical design considerations of implementing these digital modulation techniques on a programmable radio platform via hands-on experimentation. Topics to be covered in this course include amplitude, phase, and frequency-based digital transmission techniques, radio frequency front-end implementations, complex baseband representation, spectrum access and frequency regulations, transceiver design , frequency compensation, software radio architectures, and communication system design trade-offs. All concepts are taught via a combination of lecture s and h ands-on learning modules assigned throughout the course , where students apply what they learn in class to actual software radio hardware and perform over-the-air experimentation. Students will not be able to receive credit for both ECE4305 and ECE331X. Recommended Background: ECE 2312 “ Discrete-Time Signal and System Analysis ” ; ECE 2305 “Introduction to Communications and Networks” . Suggested Background: ECE 2049 “Embedded Computing in Engineering Design” ."
    clauses:
