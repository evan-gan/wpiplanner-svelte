    description: "This course will explore regression through simple and multiple linear models using least squares estimation, with an emphasis on practical applications and data analysis. Topics include coefficient interpretation, prediction, model diagnostics, variable selection, transformations, multicollinearity, hypothesis testing (e.g., Wald test, F-test), and confidence intervals for coefficients. This course will be offered in academic years ending in even numbers. Recommended background: Understanding of applied statistics including estimation, inference, and simple linear regression (MA 2612), and familiarity with linear algebra (MA 2071 or MA 2072)"
