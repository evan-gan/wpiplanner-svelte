  - courseId: FP|4001
    description: "Cat. I As the pace of development increases around the world, fire prevention and control are becoming more vital for individuals, organizations, and society itself. This course introduces students to the fundamental concepts of fire risk and sustainability along with related multi-disciplinary topics such as economics, human behavior, and decision-making. The process of fire risk assessment is taught and applied to the built environment and to the wildland fire problem. Students will undertake a structured applied-research project (individually or in small groups) to develop sustainable solutions at the interface of fire and a chosen area of sustainability such as climate change, safe drinking water, public health, housing, and more. Recommended background: Basic knowledge of fire behavior and control (FP 3070 or equivalent). Students cannot receive credit for both FP 4001 and FP 580S"
