    description: "Cat. IIThis course introduces the concepts and techniques of graph theory—a part ofmathematics finding increasing application to diverse areas such as management,computer science and electrical engineering. Topics covered include: graphs anddigraphs, paths and circuits, graph and digraph algorithms, trees, cliques,planarity, duality and colorability.This course is designed primarily for Mathematical Science majors and thoseinterested in the deeper mathematical issues underlying graph theory.Undergraduate credit may not be earned both for this course and for MA 3271.Recommended background: MA 2071.This course will be offered in 2020-21, and in alternating years thereafter."
