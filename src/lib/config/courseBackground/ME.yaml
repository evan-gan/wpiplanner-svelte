  - courseId: ME|3501
    description: "Cat. II In typical mathematics courses, students learn principles and techniques by solving many short and specially prepared problems. They rarely gain experience in formulating and solving mathematical equations that apply to real life engineering problems. This course will give students this type of applied mathematical experience. The course emphasizes the application of basic laws of nature as they apply to differential elements which lead to differential equations that need to be solved; all of these ideas are used in higher level engineering science courses such as fluid mechanics, heat transfer, elasticity, etc. Emphasis will be placed on understanding the physical concepts in a problem, selecting appropriate differential elements, developing differential equations, and finding ways to solve these equations. Limitations on the mathematical solutions due to assumptions made will be considered. Recommended background: Ordinary Differential Equations (MA 2051), statics (ES 2501), dynamics (ES 2503). This course will be offered in 2020-21, and in alternating years thereafter."
