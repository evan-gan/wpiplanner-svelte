  - courseId: CH|2310
    description: Cat. I A systematic survey of the major reaction types and functional groups in organic chemistry. The course will provide a representative collection of characteristic reactions and transformations of a variety of types of organic molecules. Most of the examples will be drawn from aliphatic chemistry. Some theoretical models will be introduced with a view toward establishing a general overview of the material. The course is intended for chemists, chemical engineers, pre-medical students and all those interested in the biosciences. A familiarity with the material presented in the general chemistry courses is assumed.
