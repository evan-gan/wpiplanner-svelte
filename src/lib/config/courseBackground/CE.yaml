  - courseId: CE|303X
    description: This course is intended to give students experience in achieving goals using software. It introduces Civil Engineering students to the fundamental uses of AutoDesk software in the implementation of Virtual Design and Construction (VDC) planning. Concepts covered combine Computer Aided Drawing (CAD) and Building Information Modeling (BIM) techniques. Application software such as AutoCAD Civil 3D, Autodesk Revit and Navisworks are used in this course. Students are required to become familiar with the software packages; specific skills taught are basic 2D drawing techniques, advanced 3D drawing and rendering techniques, basic 3D software environments, object creation and manipulation, assemblies of objects, surface and terrain modeling, building modeling, geographic and building information databases. Emphasis is given to the adaptability of this method to changes in design and to the generation of graphic design documentation. Lastly, software packages change over time, and different packages are used by different organizations. This course has an overall goal of training students in the thinking behind software, so as not to be tied to particular software but instead to be adaptable to changing circumstances. Knowledge of the subject matter in at least two Civil Engineering design courses is expected background for this course.
    clauses:
