  - courseId: MIS|2300
    description: "MIS 2300 Business Applications of Blockchain (Cat. I) This course introduces the fundamental concepts and functionality of blockchain technology. It explores how that technology records, organizes, and verifies information and how it implements smart contracts. The various financial and non-financial applications of blockchain technology are reviewed. Students will demonstrate their knowledge through exercises, exams, and a final project that designs and develops a basic blockchain application for a business problem. The course concludes by examining the legal and regulatory framework, along with potential risks and hurdles faced by those implementing and using blockchain technologies for financial and other business contexts. Recommended background: Basic knowledge of programming (Equivalent to CS 1004 or other introductory programming courses)"
