  - courseId: MU|2010
    description: Cat. II Through an introduction to the musical contributions of Louis Armstrong, Duke Ellington, Charlie Parker, Miles Davis and others, students are exposed to the chronological development of the language of jazz. Each jazz era is examined in detail including the musical and social contexts which helped define it. Participants are expected to build aural skills with the goal of identifying specific historical periods through the recognition of particular musical characteristics. Students examine in depth one artist of their choice. This course will be offered in 2020-21, and in alternating years thereafter. [This replaces MU 4623. Credit is not allowed for both MU 4623 and MU 2719.]
    clauses: []
