  - courseId: MU|2300
    description: "Cat. II This course will present ways to facilitate musicianship through the use of technology. Course topics include an introduction to music notation software, MIDI and audio recording, signal processing, and interactive music system programming. The course will address past, current, and emerging trends in music technology as they relate to facilitating an understanding of musical concepts. Students may not receive credit for both MU 2300 and MU 230X. Suggested background: a basic understanding of music notation and the fundamentals of music. This course will be offered in 2020-21, and in alternating years thereafter."
