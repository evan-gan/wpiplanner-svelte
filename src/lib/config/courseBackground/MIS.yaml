  - courseId: MIS|571
    description: This course introduces students to the theory and practice of computer-based data management, including the delivery of high quality data in information processing and analysis. The course focuses on the design of database systems to meet an organization’s needs for data analytics. The course also covers data security, data integrity, data quality, as well as backup and recovery procedures. Students will be exposed to commercially available database management systems, such as Microsoft Access and Oracle. As a project during the course, students will design and implement a small database application that meets the data needs of some real-world business opportunity. The project report will include recommendations for ensuring data security, data integrity, and data quality.
    clauses: []
    noCreditWith: []
  - courseId: MIS|573
    description: "This course introduces students to the concepts and principles of systems analysis and design. It covers all aspects of the systems development life cycle from project identification through project planning and management, requirements identification and specification, process and data modeling, system architecture and security, interface design, and implementation and change management. Object-oriented analysis techniques are introduced. Students will learn to use an upper level CASE (computer-aided software engineering) tool, which will be employed in completing a real-world systems analysis and design project. (Prerequisite: MIS 571 or equivalent content, or instructor consent)"
    clauses:
