            - kind: topic
              topic: differential equations
    noCreditWith: []
    needsReview: No lead word; 'should have a background' recorded as suggested.
  - courseId: CHE|509
    description: This course includes a review of prototypical chemical reactors, including design of batch, stirred tank, and tubular reactors. Theories of reaction kinetics and catalysis for simple and complex reactions are addressed. Reactor design is discussed within the context of complex transport phenomena and reaction kinetics, including effects of bulk and pore diffusion and multiphase reactions/reactors. Techniques for experimentation, reaction data treatment, catalyst preparation and characterization, and computational tools are also included. Students cannot receive credit for this course and CHE 506 or CHE 507, which this class replaces.
    clauses: []
    noCreditWith:
      - CHE|506
      - CHE|507
  - courseId: CHE|565
    description: "Advanced topics in process synthesis, optimization and process control are examined. Optimization topics include objective functions, multivariable optimization, constrained optimization, mixed integer linear programming and applications of optimization to process industries. Control topics include model predictive control, adaptive control,batch process control, and plant-wide control.Recommended background: Undergraduate degree in Chemical Engineering"
    clauses:
      - strength: recommended
        timing: prior
        sourceText: "Recommended background: Undergraduate degree in Chemical Engineering"
        requirement:
          kind: standing
          text: Undergraduate degree in Chemical Engineering
    noCreditWith: []
  - courseId: CHE|571
    description: "Transport rates of mass, energy, and momentum are key to the design of many chemical technologies. This class adopts a unified approach to transport phenomena, providing the fundamental background required for analysis ofcomplex problems. Students will use mathematical techniques for analytic and approximate solutions such as: separation of variables, similarity solutions, perturbation theory, and Laplace and Fourier transform methods. Methods involvingnon-dimensionalization and scaling will be emphasized. Special problems to be covered may include the lubrication approximation, creeping flow, and potential and laminar boundary-layer flows, as well as heat and mass transport in multicomponent systems. Students are expected to have taken previous courses on transport processesand have mathematical background that includes solution of differential equations."
    clauses:
