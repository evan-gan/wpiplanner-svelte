  - courseId: MA|2610
    description: "Cat. I This course is designed to introduce the student to statistical methods and concepts commonly used in the life sciences. Emphasis will be on the practical aspects of statistical design and analysis with examples drawn exclusively from the life sciences, and students will collect and analyze data. Topics covered include analytic and graphical and numerical summary measures, probability models for sampling distributions, the central limit theorem, and one and two sample point and interval estimation, parametric and non-parametric hypothesis testing, principles of experimental design, comparisons of paired samples and categorical data analysis. Undergraduate credit may not be earned for both this course and for MA 2611. Recommended background: MA 1022."
