  - courseId: PH|548
    description: The course offers an overview of basic sensor physics and technologies to provide practical working knowledge of sensors. The course will include basic sensor operating principles, the physics of sensors, electrical interfacing to sensors, measurement principles, and applications. A wide range of sensors could be covered, such as temperature, photonic, acoustic, chemical, biological, electromagnetic, pressure, position and motion sensors. There will also be a laboratory component to the course.
    clauses: []
