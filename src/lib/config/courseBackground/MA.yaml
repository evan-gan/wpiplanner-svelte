    description: "Cat. I, This course provides a deeper understanding of topics introduced in MA 2071, and continues the development of linear algebra. Topics covered include: abstract vector spaces, linear transformations, matrix representations of a linear transformation, determinants, characteristic and minimal polynomials, diagonalization, eigenvalues and eigenvectors, the matrix exponential, inner product spaces. This course is designed primarily for Mathematical Science majors and those interested in the deeper mathematical issues underlying linear algebra. Recommended background: MA 2071 or MA 2072."
