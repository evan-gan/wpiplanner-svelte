    description: "Cat. I An introduction to the synthesis and analysis of linkages, cams and gear trains is presented. The design process is introduced and used to solve unstructured design problems in linkage and cam design. Algebraic and graphical techniques to analyze the displacement, velocity and acceleration of linkages and cams are developed. Computer programs for the design and analysis of linkages are used by students. Results of student design projects are presented in professional engineering reports. Recommended background: Ordinary Differential Equations (MA 2051), statics (ES 2501), dynamics (ES 2503)."
