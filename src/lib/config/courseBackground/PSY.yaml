  - courseId: PSY|3300
    description: "This interdisciplinary course integrates educational psychology and cognitive science to equip pre-service STEM educators with strategies that support diverse learners in K-12 settings. Students will explore cognitive load theory, differentiated instruction and Universal Design for Learning (UDL), applying these concepts to enhance student engagement and outcomes for students with disabilities. The course emphasizes the role of social learning theory and cognitive developmental theory in shaping student behavior and motivation. Culturally responsive teaching practices, traumainformed approaches and collaboration with families and communities are also key components that will be explored through case studies, classroom observations, and scenario-based role plays. Students will develop practical skills in instructional lesson design and implementation and demonstrate their knowledge and understanding of course learning objectives through a final project that aligns coursework to real-world teaching scenarios. Recommended background: EDU 2200, EDU 2300"
    clauses:
