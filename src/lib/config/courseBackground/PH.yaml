  - courseId: PH|4601
    description: "This course provides students with hands-on laboratory experience in experimental quantum optics. Students investigate the quantum nature of light through a series of fiber-optic and free-space optics experiments. Key topics include photon counting and detection, the diffraction of light in the single-photon limit, the generation of correlated and entangled photon pairs, single photon and coincidence detection, photon bunching and indistinguishability, the Hong-Ou-Mandel effect, and the observation of Bell states, as well as special topics. Students will work with single-photon experiments, lasers, various optical components, and photon detectors. Students will also perform data and error analysis and gain experience in scientific communication. This course will be offered in academic years ending in odd numbers. Recommended Background: Students should have basic knowledge of quantum physics at the level of an undergraduate course in quantum mechanics, such as PH3401 Quantum Mechanics I or equivalent. Students should have basic physics laboratory skills at the level of an undergraduate physics course that has a laboratory component, such as PH1130 Modern Physics, PH2510 Atomic Force Microscopy, PH2601 Photonics Laboratory, PH2651 Intermediate Physics Laboratory, or equivalent."
