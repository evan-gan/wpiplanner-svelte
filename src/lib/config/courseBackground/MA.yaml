    description: "Cat. I, This course provides an introduction to differentiation and its applications. Topics covered include: functions and their graphs, limits, continuity, differentiation, linear approximation, chain rule, min/max problems, and applications of derivatives.Recommended background: Algebra, trigonometry and analytic geometry. Although the course will make use of computers, no programming experience is assumed.Students may not receive credit for both MA 1021 and MA 1020."
