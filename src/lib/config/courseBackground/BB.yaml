  - courseId: BB|3870
    description: "BB 3870 Cell Culture Models Laboratory (Cat. I: 1/3 unit) This course is an intensive hands-on laboratory that explores mammalian cells as building blocks of complex tissues in vitro. In addition to learning standard cell culture skills, students will have the opportunity to examine cell survival, proliferation, differentiation, and function under different culture conditions. The course culminates with design and development of a cell-based system for an application in regenerative medicine (e.g., wound healing and fibrosis). Students will synthesize and present their work in the form of a research manuscript. This course carries the writing-intensive designation. Recommended background: a working knowledge of the principles of cell biology (BB 2550 or equivalent) as well as a foundational lab experience such as that offered in BB 1801 and BB 3813. Students may not receive credit for this course and BB 3570."
