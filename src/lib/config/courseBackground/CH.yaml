  - courseId: CH|540
    description: "This course covers the biochemical mechanisms involved in regulation of gene expression: modifications of DNA structures that influence transcription rates, transcriptional regulation, post-transcriptional processing of RNA including splicing and editing, nuclear/cytoplasmic transport, regulation of translation, and factors that control the half-lives of both mRNA and protein. During the course, common experimental methods are explored, including a discussion of the information available from each method."
