    description: "CE 404X, Geotechnical Engineering Laboratory. This course provides students with understanding, knowledge, skills and tools to conduct laboratory tests to measure or estimate key soil parameters required for construction site preparation and for design of suitable foundations for structures to be built. Principles and methods of volumetric testing and soil classification, permeability and consolidation testing, shear strength tests, interpretation and analysis of the data, and preparation of soil reports will be presented. Recommended Background: Recommended background: CE 2001, CE 3041, ES 3004. Suggested background: GE 2341."
