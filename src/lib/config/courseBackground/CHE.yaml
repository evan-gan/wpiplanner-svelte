  - courseId: CHE|4405
    description: "Cat. IThis course is intended to provide laboratory application of fundamental principles of chemical process dynamics and feedback control. This includes open-loop dynamics of typical chemical engineering processes such as distillation, fluid flow, chemical reactors and heated stirred tanks. Closed-loop experiments will involve control loop design, controller tuning, multivariable, and computer control.Students will be required to design and execute their own experiments based on supplied objectives. Analysis and presentation of the results will be done through oral and written reports.Recommended background: knowledge of fluid flow and heat transfer, mathematics and chemical engineering principles."
