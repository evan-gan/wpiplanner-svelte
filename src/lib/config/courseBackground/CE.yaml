  - courseId: CE|3025
    description: "Cat. IIn this course students are provided with a systematic framework for evaluating the economic sustainability and financial aspects of a building investment through its life cycle: project definition, design, construction and operation. The course develops according to several interrelated topics: budgeting (square foot cost and parametric estimating) and economic feasibility analysis, financing mechanisms, cash flow analysis, (time-value -of -money factors, present worth and rate of return), life-cycle assessment (environmental impact analysis), taxes, depreciation and regulations as well as consideration of risks and uncertainties.Recommended background: AREN 2023. This course will be offered in 2020-21, and in alternating years thereafter."
    clauses:
      - strength: recommended
        timing: prior
        sourceText: "Recommended background: AREN 2023."
