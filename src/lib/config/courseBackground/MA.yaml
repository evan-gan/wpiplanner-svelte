  - courseId: MA|322X
    description: "An introduction to the general principles of setting unpaid claim estimates as well as specific details regarding data requirements, calculations, key assumptions, and implementation-related issues. Students will gain a thorough understanding of basic methods so that they will be able to analyze data, select appropriate techniques, and develop solutions to actuarial reserving problems. We will address the advantages and disadvantages of the various techniques as they are applied to specific situations and different lines of business. Techniques include: the development method, the expected claims method, the Bornhuetter-Ferguson method, the Cape Cod method, and two case-outstanding methods. Recommended background: At least one actuarial course, such as MA 2211 or MA 3212."
    clauses: []
    noCreditWith: []
  - courseId: MA|3233
    description: "Cat. IIDiscrete optimization is a lively field of applied mathematics in whichtechniques from combinatorics, linear programming, and the theory ofalgorithms are used to solve optimization problems over discrete structures, suchas networks or graphs. The course will emphasize algorithmic solutions togeneral problems, their complexity, and their application to real-world problemsdrawn from such areas as VLSI design, telecommunications, airline crewscheduling, and product distribution. Topics will be selected from: Networkflow, optimal matching, integrality of polyhedra, matroids, andNP-completeness.Recommended background: At least one course in graph theory, combinatoricsor optimization (e.g., MA 2271, MA 2273 or MA 3231).This course will be offered in 2020-21, and in alternating years thereafter."
