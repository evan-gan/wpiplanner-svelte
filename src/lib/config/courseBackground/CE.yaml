  - courseId: CE|2030
    description: This course covers educational and professional opportunities in Civil Engineering and Environmental Engineering, including professional skills necessary for success, as both a student in the program and as a future practicing engineer. Topics include pathways of study; career options; ethics and professional responsibilities; professional licensure; networking and professional societies; communication; teamwork; and software skills. The role of engineers in addressing contemporary issues through innovation, and the importance of life-long learning, are explored.
    clauses: []
    noCreditWith: []
  - courseId: CE|3022
    description: Cat. I The course focuses on the legal underpinnings that regulate the design and execution of construction projects and the relations between their participants. The subject is presented according to the various phases of a construction project, from inception to handover. The overall objective is to develop an awareness of the legal aspects that regulate the exercise of the architectural and civil engineering profession and of the environmental constraints of construction. Topics such as permitting process, design/engineering services and ethical issues are included. Some sections of this course may be offered as Writing Intensive (WI).
    clauses: []
    noCreditWith: []
  - courseId: CE|3050
    description: Cat. I This course provides an introduction to the field of transportation engineering with particular emphasis on traffic engineering. Principles, such as traffic studies, highway safety, traffic flow, intersection design and control, capacity analysis, and level of service analysis are included. In addition, basic highway design parameters associated with curves and sight distance are covered. Regional transportation systems and sustainable development are also discussed and analyzed; and concepts associated with parking, public transportation, and travel demand modeling are introduced.
    clauses: []
    noCreditWith: []
  - courseId: CE|501
    description: Professional practices in engineering and architecture . Legal issues of business organizations, contracts and liability; business practice of staffing, fee structures, accounts receivable, negotiation and dispute resolution, and loss prevention; marketing and proposal development; project management involving organizing and staffing, budgeting, scheduling, performance and monitoring, and presentation of deliverables; professionalism, ethics and responsibilities.
    clauses: []
    noCreditWith: []
  - courseId: CE|510
    description: "Analysis of structural components: uniform and nonuniform torsion of structural shapes, analysis of determinate and indeterminate beams (including elastic foundation conditions) by classical methods, finite difference equations, numerical integrations, series approximation, elastic stability of beams and frames, lateral stability of beams, beams-columns, analysis of frames including the effect of axial compression."
    clauses: []
    noCreditWith: []
  - courseId: CE|531
    description: Advanced design of steel members and connections; ultimate strength design in structural steel; codes and specifications; loads and working stresses; economic proportions; and buckling of slender elements and built-up sections, torsion, lateral-torsional buckling, beam-columns, design for lateral forces, and connections for building frames.
    clauses: []
    noCreditWith: []
  - courseId: CE|560
    description: Theory and practice of drinking water treatment. Water quality and regulations; physical and chemical unit processes including disinfection, coagulation, clarification, filtration, membranes, air stripping, adsorption, softening, corrosion control, and other advanced processes.
    clauses: []
    noCreditWith: []
  - courseId: CE|566
    description: This course provides a review of the basic principles governing groundwater flow and solute transport, and examines the models available for prediction and analysis including computer models. Topics covered include mechanics of flow in porous media; development of the equations of motion and of conservation of solute mass; analytical solutions; and computer-based numerical approaches and application to seepage, well analysis, artificial recharge, groundwater pollution, salinity intrusion, and regional groundwater analyses.
    clauses: []
    noCreditWith: []
  - courseId: CE|573
    description: Hydraulic principles of water, domestic wastewater and industrial wastewater systems. Hydraulic analysis and design of collection, distribution and treatment systems and equipment. Topics covered include pipe and channel flow, pump characteristics and selection, friction loss, corrosion and material selection.
    clauses: []
    noCreditWith: []
  - courseId: CE|584
    description: This course examines cost estimating as a key process in planning, designing and constructing buildings. Topics include the analysis of the elements of cost estimating; database development and management, productivity, unit costs, quantity surveys and pricing, and the application of these tools in business situations; marketing, sales, bidding, negotiating, value engineering, cost control, claims management and cost history. Computerization is evaluated as an enhancement to the process.
    clauses: []
    noCreditWith: []
  - courseId: CE|596
    description: Seminars on current issues and state-of-the-art research in civil and environmental engineering given by guest speakers, faculty, and students.
    clauses: []
    noCreditWith: []
