    noCreditWith: []
  - courseId: EDU|597
    description: Students enrolled in this online synchronous course complete an individual capstone project for the Integrated STEM program. This course serves as a practical integration of knowledge and skills. Students will define a STEM education related problem within their educational setting (e.g. own classroom, school, after school program), conduct a literature review related to the problem, draw on field-specific professional standards, engage with community members and/or key stakeholders, and propose a solution to the problem that weaves together theory and best-practices related to integrated STEM education. A public presentation is required.
    clauses: []
    noCreditWith: []
