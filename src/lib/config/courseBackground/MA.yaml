    description: "This course begins with a review of topics normally covered in undergraduate analysis courses: open, closed and compact sets; liminf and limsup; continuity and uniform convergence. Next the course covers Lebesgue measure in Rn including the Cantor set, the concept of a sigmaalgebra, the construction of a nonmeasurable set, measurable functions, semicontinuity, Egorov’s and Lusin’s theorems, and convergence in measure. Next we cover Lebesgue integration, integral convergence theorems (monotone and dominated), Tchebyshev’s inequality and Tonelli’s and Fubini’s theorems. Finally LP spaces are introduced with emphasis on L2 as a Hilbert space. Other related topics will be covered at the instructor’s discretion. (Prerequisite: Basic knowledge of undergraduate analysis is assumed.)"
