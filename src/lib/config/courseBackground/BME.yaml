  - courseId: BME|3300
    description: Cat. I Students are guided through the open-ended, real-world, design process starting with the project definition, specification development, management, team interactions and communication, failure and safety criteria, progress reporting, marketing concepts, documentation and technical presentation of the final project outcome. The course will include a significant writing component, will make use of computers, and hands-on design explorations. Students who have previously received credit for BME 2300 may not receive credit for BME 3300.
