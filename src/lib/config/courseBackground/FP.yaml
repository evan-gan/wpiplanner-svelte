  - courseId: FP|520
    description: "Modeling of compartment fire behavior is studied through the use and application of two types of models: zone and field. The zone model studied is a student developed model. The field model studied is FDS. Focus on in-depth understanding of each of these models is the primary objective in terms of needed input, equations solved, interpretation of output and limitations. A working student model is required for successful completion of the course. Basic computational ability is assumed. Basic numerical methods are used and can be learned during the course via independent study. (Prerequisite: FP 521 or permission of the instructor.)"
