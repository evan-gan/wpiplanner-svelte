    description: "Cat. ITechniques for experimentally determining rate laws for simple and complex chemical reactions, the mechanisms and theories of chemical reactions, the function of catalysts, and the design of isothermal, adiabatic, batch and flow reactors. The course is intended to provide chemists and chemical engineers with the conceptual base needed to study reactions and perform in the design and analysis of reactors.Recommended background: differential equations, thermodynamics and someorganic chemistry."
