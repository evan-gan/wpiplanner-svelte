    description: "(2 credits) Overview of stability concepts and examination of various methods for assessing stability such as linearization and Lyapunov methods. Introduction to various design methods based on linearization, sliding modes, adaptive control, and feedback linearization. Demonstration and performance analysis on engineering systems such as flexible robotic manipulators, mobile robots, spacecraft attitude control and aircraft control systems. Control synthesis and analysis is performed using Matlab®/Simulink®. (Prerequisites: Familiarity with ordinary differential equations, introductory control theory at the undergraduate level, fundamentals of linear algebra. Familiarity with Matlab® is strongly recommended.)"
