  - courseId: GN|2511
    description: "GN 2511: Intermediate German I: Cultural Practices and Products of the German-Speaking World (Cat. I) Builds on the foundation of Elementary German by moving from the level of immediate everyday contexts towards broader cultural phenomena. Students investigate cultural practices, attitudes and products related to a variety of topics such as health and hygiene, environmental protection, travel and transportation, childhood, work, and education. Work with language supports interpretations of short texts (written, viewed, and heard), small-group interactions that navigate real-life situations, and presentations on key cultural products of the German-speaking world. Recommended background: GN 1512"
