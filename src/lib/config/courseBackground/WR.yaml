  - courseId: WR|2310
    description: "Cat. I This course explores how visual design is used for purposes of identification, information, and persuasion . It looks at many modes of visual communication, such as icons, logos, trademarks, signs, product packaging, infographics, posters, billboards, ads, exhibits, graffiti, page layout, films, television, videogames, and web sites . The course provides an overview of the history of graphic design movements, as well as analytical tools to understand how visual design encodes messages and the role visual communication plays in contemporary culture . Students will write about and create a number of visual media in this project centered class. Suggested background: WR 1010"
