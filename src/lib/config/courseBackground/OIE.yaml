  - courseId: OIE|597
    description: "This capstone course serves as a practical integration of the operations and supply chain theories, practices, tools and techniques that students learned in their MS program. The medium is a major team-based project, sponsored by an external organization. The course goals are: (1) to enrich students’ experiential learning and support the acquisition of the skills and capabilities to tackle real-world problems; and (2) to enhance students’ teamwork, interpersonal and consulting skills. Students will produce a written report documenting their solutions, and providing the financial, organizational, and technical rationale for their approach. They will also formally present their results to the project sponsors. Students are expected to have completed (or be currently completing) all the course requirements for their MS in Operations and Supply Chain Analytics prior to taking the capstone project."
    clauses: []
    noCreditWith: []
    needsReview: Says students are expected to have completed (or be completing) all MS course requirements before the capstone. Not labelled as a prerequisite, so no clause recorded.
  - courseId: OIE|3020
    description: Cat. I Operations are embedded in a constantly changing network of relationships with various stakeholders including customers and suppliers. Within the organization, scarce resources (including financial, human, and technological) need to be allocated and aligned with strategic goals. External to the organization, consideration is given to sustainability and environmentally responsible use of resources. This course focuses on process analysis, engineering design thinking and process implementation within the constraints of stakeholder networks. Professional engineering ethics and the consequences of management decision making are discussed in detail. The course includes a process analysis project and a one-piece-flow hands on laboratory experience. Course assignments follow one-piece-flow principles in education, allowing individual students to complete the course at their own pace. Students cannot receive credit for both BUS 3020 and OIE 3020.
    clauses: []
    noCreditWith:
      - BUS|3020
  - courseId: OIE|501
    description: This course focuses on the data-driven decision-making that matches supply to demand in an organization and its supply chain, emphasizing the strategic impact of operations on competitiveness and sustainability. Emergent technologies are explored as opportunities for innovation. Descriptive, predictive, and prescriptive analytical techniques are introduced to structure and evaluate key operational decisions. Skills required to model a system’s operations, to address uncertainty and mitigate risk, to effectively evaluate resource needs, to integrate components into a coordinated system, and to efficiently develop and manage capacity and inventory are honed during the course.
    clauses: []
    noCreditWith: []
  - courseId: OIE|552
    description: This course is designed to provide students with a variety of quantitative tools and techniques useful in modeling, evaluating and optimizing operation processes. Students are oriented toward the creation and use of spreadsheet models to support decision-making in industry and business.
    clauses: []
    noCreditWith: []
  - courseId: OIE|558
    description: "This course teaches Six-Sigma as an organizational quality system and a set of statistical tools that have helped the world’s leading companies save millions of dollars and improve customer satisfaction. This course is organized in three parts: part one covers the essentials of Six-Sigma, including fundamental concepts, the advantages of Six-Sigma over Total Quality Management, and a five-phase model for building a Six-Sigma organization; part two of the course covers the Six-Sigma training, including technical topics such as capability and experimental design as well as how to train “Black Belts” and other key roles; part three describes the major activities of the SixSigma Roadmap, from identifying core processes to executing improvement projects to sustaining Six-Sigma gains."
    clauses: []
    noCreditWith: []
