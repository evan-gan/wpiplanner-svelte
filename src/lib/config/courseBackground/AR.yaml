    description: "Cat. I 3D Animation I teaches students how to use 3D animation software to apply classical animation principles into 3D work . Lectures focus on creating organic and compelling character animation through body mechanics, weight, and dynamic posing in addition to exposing students to learning how to think about character acting and staging within a 3D environment . Recommended background: Basic knowledge digital art software (AR 1101) is recommended. Suggested background: Basic knowledge of animation (IMGD/AR 2222)."
