  - courseId: PH|3301
    description: "A continuation of PH 3300, this course deals with more advanced subjects in electromagnetism, as well as study of basic subjects with a more advanced level of mathematical analysis. Fundamentals of electric and magnetic fields, dielectric and magnetic properties of matter, quasi-static time-dependent phenomena, and generation and propagation of electromagnetic waves are investigated from the point of view of the classical Maxwells equations. Recommended background: Electric fields and potentials, electrostatics, magnetic fields from currents and dipoles, as covered in PH 3300. Students should be comfortable with vector algebra and vector calculus, including gradients, divergence, and curl, as typically covered in MA 2251."
