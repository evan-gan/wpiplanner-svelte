    description: "Cat. I This course will build upon the skills learned in 3D MODELING with studies in life drawing/anatomy study and application towards completed character models. Students will create high resolution sculpts for real-time game environments and animation. Topics covered will be character design as it applies to 3D MODELING, creating realistic design sculpts and incorporating them into a game environment as well as the study of anatomy as it applies to organic modeling. Recommended background: AR 1101, IMGD/AR 2101, AR 2202"
