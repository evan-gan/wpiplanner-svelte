  - courseId: EDU|4200
    description: "EDU 4200 Senior Seminar (Cat I, 0 credits) As an essential component of the Teacher Preparation Program, this seminar addresses current issues that impact the field of education to encourage discourse and deepen understanding of K12 school culture and classroom environments experienced during the student-teaching practicum. Other topics include career coaching, resume and cover letter development, navigating a job search and interview preparation skills for K-12 educators. Recommended background: Completion of Student Teaching practicum of the Teacher Preparation Program Only students in their last year of the Teacher Preparation Program should register for this course every term (A, B, C, D)."
