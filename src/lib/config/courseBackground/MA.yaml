    description: "Cat. II This course covers the calculus of variations and select topics from optimal control theory. The purpose of the course is to expose students to mathematical concepts and techniques needed to handle various problems of design encountered in many fields, e. g. electrical engineering, structural mechanics and manufacturing. Topics covered will include: derivation of the necessary conditions of a minimum for simple variational problems and problems with constraints, variational principles of mechanics and physics, direct methods of minimization of functions, Pontryagin’s maximum principle in the theory of optimal control and elements of dynamic programming. Recommended background: MA 2051. This course will be offered in 2020-21, and in alternating years thereafter."
