  - courseId: BB|2804
    description: "BB 2804 Ecology, Environment, and Animal Behavior Laboratory (Cat. I; 1/6 unit) This course examines topics in ecology and animal behavior through hands on experimentation and simulation. Activities in this course include interactions and observation of live animals as well as some outdoor activities and environmental sampling. This course will be relevant to students who have an interest in biology at more than the individual organism level as well as those majors studying environmental and ecological concerns. Examples of the specific types of techniques and experience included in this course are observing, recording, understanding, and analyzing animal behaviors; handling of organisms; environmental and ecological assessment and sampling; and observations of population dynamics. Recommended background: at least one college-level biology course. Students may not receive credit for this course and BB 2904, BB 294X, or BB 292X."
