  - courseId: AR|3210
    description: "This course offers in-depth analysis of the human figure in action. Motion is analyzed and studied through drawing and sketching of live models, video clips, performance and pantomime, studying not only the physical exterior but also how thoughts and emotion are expressed through gesture. Students will develop skill in figure posing and staging for applications in animation, storyboards, comics, and illustration. Recommended background: Observational and gesture drawing and color (AR 1101), experience drawing live model (AR 2202), composition skills and color (AR/IMGD 2700)."
