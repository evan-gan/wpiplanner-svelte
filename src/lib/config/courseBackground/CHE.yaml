    description: "Cat. I Application of Chemical Engineering design principles to the design of a major chemical plant. Students work in groups to produce a preliminary practical process flowsheet, equipment and plant design, and economic analysis. Recommended background: familiarity with techniques and procedures emphasized in CHE 4403."
