  - courseId: AE|6332
    description: "Overview of stability concepts and examination of various methods for assessing stability such as linearization and Lyapunov methods. Introduction to various design methods based on linearization, sliding modes, adaptive control, and feedback linearization. Demonstration and performance analysis on engineering systems such as flexible robotic manipulators, mobile robots, spacecraft attitude control and aircraft control systems. Theoretical foundations of machine learning via adaptive functional estimation of dynamical systems. Control synthesis and analysis is performed using Matlab®/Simulink®. Prerequisites: Fluency with the theory of linear dynamical systems and control (AE 5331 or similar). Fluency with Matlab®. Students cannot receive credit for this course if they have taken AE/ME 5221 “Control of Nonlinear Dynamical Systems”."
