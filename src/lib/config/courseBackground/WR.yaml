  - courseId: WR|1010
    description: Cat. I This course is designed for students who wish to work intensively on their writing . The course will emphasize the processes of composing and revising, the rhetorical strategies of written exposition and argumentation, and the reading and citation practices central to academic inquiry . In a workshop setting, students will write a sequence of short papers and complete one longer writing project based on multiple source texts; learn to read critically and respond helpfully to each other’s writing; and make oral presentations from written texts . Where applicable, the topical theme of the class will be provided via the Registrar’s office .
    clauses: []
    noCreditWith: []
  - courseId: WR|1020
    description: Cat. I This course will apply classical and modern rhetorical concepts to analyze various texts and speeches in order to identify the means of persuasion to a particular end . Students will write short analytical papers that critically assess various rhetorical and communicative approaches . The goal of this course is to enable students to see rhetoric in action in order to both engage with the material critically as well as produce effective discourse to meet various situations .
    clauses: []
    noCreditWith: []
  - courseId: WR|513
    description: Engineers and other technologists are increasingly more aware of the ethical, legal, and social impacts of robotics and artificial intelligence. Some of them actively contribute to the creation and communication of new sets of ethical standards, such as the work done by IEEE’s Global Initiative on Ethics of Autonomous and Intelligent Systems. What are the ethical principles that underpin these new standards? Since robots and AI systems are designed to work with or alongside humans, do people have a right to understand what autonomous systems are doing and why? How can roboticists and AI designers ensure that these systems are transparent and explainable? This course focuses on the communication of ethical and social impacts of scientific research and technology development. After learning about major debates in robot/AI/data ethics, students will cultivate skills to (1) conceptualize ethical inquiries in technology design and (2) articulate them in writing and other forms of scholarly communication . As part of this course, students will learn to apply the National Science Foundation’s (NSF) broader impacts framework to their writing projects (dissertation, thesis, journal publication, grant application, etc.).
    clauses: []
    noCreditWith: []
