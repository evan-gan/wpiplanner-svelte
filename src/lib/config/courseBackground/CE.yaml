  - courseId: CE|3041
    description: "Cat. I This is an introductory course dealing with the science and technology of earth materials with an emphasis on fundamental concepts of particulate mechanics. The topics which are discussed include fluid flow through porous media, deformation and shear characteristics of soil, consolidation, lateral earth pressure, and slope stability. Recommended background: CE 2000 and CE 2001. Suggested background: GE 2341."
