  - courseId: BUS|633
    description: "Developing predictive behavioral models, which heavily rely on quantitative (numeric) data, are a major success factor in helping businesses develop competitive products and services. This course focuses on methods for collecting and analyzing quantitative research data with the purpose of enabling students to make the novel discoveries that characterize PhD research in business. Students will become familiar with one or more internationally utilized statistical software packages and with the array of statistical analysis techniques in them. They will understand which statistical analysis techniques to use in which situations, how to interpret the output from these packages, and how data collection and analysis methods affect research results. In our increasingly data intensive business environment, these skills are critical for understanding business data and using that understanding to design better processes and systems and to make better decisions within and across industries. (Prerequisite: Admission to the Business School PhD program or to another WPI PhD program, BUS 631 or equivalent knowledge)"
