    description: "BME 4012 Biomedical Sensors and Instrumentation Laboratory: Applications (1/6 units; Cat. I) This applications lab is a sequential extension of the corresponding techniques lab (BME 3012 and BME 3013). The lab course provides students with experience of utilizing biomedical sensors and instrumentation and their applications for biomedical engineering. The students will learn about the appropriate selection of sensors for clinically relevant problems. The students will work on design projects in teams to develop their instrumentation system that demonstrates proof-of-concept of a potentially useful biomedical instrument, analyzing and interpreting data and effective communication skills. The lab will build on the concepts in sensors and instrumentation introduced in BME 3012 Biomedical Sensors Laboratory: Techniques and BME 3013 Biomedical Instrumentation Laboratory: Techniques, and lower-level instrumentation and data analysis courses. Recommended Background: Knowledge obtained in BME 3012, BME 3013 and ability to perform statistical analysis of the data."
