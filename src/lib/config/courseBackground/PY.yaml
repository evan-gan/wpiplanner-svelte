  - courseId: PY|3711
    description: "PY 3711/RE 3711 Topics in Philosophy (Cat. I) This course is organized around an advanced or specialized topic in philosophy and provides preparation for HU 3900 Inquiry Seminars in philosophy and religion. Emphasis on topics and authors will vary with instructor, but will typically involve the study of: a particular philosopher (e.g., Plato, Marx, Dewey, Arendt); a particular philosophical tradition (e.g., Pragmatism, Analytic Philosophy, Buddhism, Feminism); a particular philosophical problem or topic (free will, globalization, consciousness, social movement, justice); or a particular philosophical classic (Aristotle’s Ethics, Hobbes’s The Leviathan, Beauvoir’s The Second Sex). The topical theme of the course will be provided as a modified course title in the course description posted online. This course may be repeated for different topics. Recommended Background: None."
    clauses: []
    noCreditWith: []
  - courseId: PY|3712
    description: "Cat. II This course will focus on philosophical questions concerning the following topics: the existence and nature of God; the compatibility of God and evil; the nature of religious faith and the relationship between religion, science and ethics; interpretations of the nature of religious language; the philosophically interesting differences between Western and Eastern religions; philosophical critiques of the role of religion in social life. Authors may include: Hume, Kant, Kierkegaard, Buber, Tillich, Daly, Nietzsche and Buddha. Suggested background: familiarity with basic religious concepts and terms (as in PY/RE 1731). This course will be offered in 2020-21, and in alternating years thereafter."
