  - courseId: MA|1120
    description: "Cat. I (14-week course) The topics for integral calculus (MA 1022) are covered in this course: the concept of the definite integral, the Fundamental Theorem of Calculus, integration techniques, and applications of integration. Applications include: area, volume, arc length, center of mass, work, force, and exponential growth and decay. Logarithmic and exponential functions are studied in depth. Arithmetic and geometric sequences and series will also be covered. Key historical events in the development of integral calculus are examined. Technology will be used as appropriate to support the material being studied.This course extends for 14 weeks and offers 1/3 unit of credit. It is designed for students who would benefit from additional contact hours and who need to strengthen their mathematical background. Although the course will make use of computers, no programming experience is assumed. Students may not receive credit for both MA 1120 and MA 1022 or MA 1102."
    clauses: []
    noCreditWith:
      - MA|1022
      - MA|1102
  - courseId: MA|1801
    description: "Problem-solving is a fundamental mathematical skill. In this course, students will be exposed to problems coming from a wide range of mathematical disciplines; and will work together in a collaborative environment to explore potential solutions. Discussion problems may be inspired by the research of faculty leading the discussion, by past mathematical competitions (such as the Putnam Competition), or elsewhere. This course meets once per week, with an emphasis on discussion and exploration of problems. There will be no exam and no assigned homework. Grading is by participation only. This course may be taken multiple times; content will vary depending on the speakers. Grading for this course will be on a Pass/NR basis. Recommended background: Curiosity about Mathematics"
    clauses:
      - strength: recommended
