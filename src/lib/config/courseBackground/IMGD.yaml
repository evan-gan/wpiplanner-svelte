  - courseId: IMGD|1000
    description: Cat. I This course introduces non-technical studies of computer-based interactive media and games. The course develops a vocabulary for discussing games and other interactive media, and tools for analyzing them. Students are expected to provide written critiques using the critical approaches presented in the course. The games and other interactive media critiqued may be commercially available or under development.
    clauses: []
    noCreditWith: []
  - courseId: IMGD|1001
    description: Cat. IThis course discusses the process of game development. It examines the roles ofdifferent participants in the development process and how the technicaldevelopment and the artistic development proceed in tandem. Group work isemphasized, especially the importance of collaboration between technical andartistic efforts. Students are expected to participate in game development usingappropriate game development tools.
    clauses: []
    noCreditWith: []
  - courseId: IMGD|1002
    description: Cat. IThis course explores different types of story within gaming and other interactivemedia. It delineates between linear, branching, and emergent storytelling,identifies hybrids, and finds new modes of making compelling narrative. Avariety of games are discussed, including early text-based adventures, role-playinggames, shooters, and strategy games. Students will construct characters situations, and narratives through game play and scripted cut scenes. Studentswill explore and use visual storytelling techniques.
    clauses: []
