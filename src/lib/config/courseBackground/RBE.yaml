    description: "This course provides an introduction to robotics and Robotics Engineering through completion of a topical, hands-on project in modern robotics. Students will work on teams and draw from material presented in lecture, consultations with experts, and individual research to develop and test novel solutions to a problem drawn from active research in the discipline. Students will develop skills in mechanics, electronics, controls, and algorithms and the ability to integrate those concepts through an active design project. Undergraduate credit may not be earned for both this course and RBE 1001. Recommended background : Programming experience in Python or C/C++ (such as found in CS 1005). Experience with fundamentals of mechanics (such as found in PH 1110 or 1111)."
