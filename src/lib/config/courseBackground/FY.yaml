  - courseId: FY|1800
    description: (1/12 unit) This course is open to all students who are undecided about or are thinking about changing their academic major. Students will conduct a self-assessment utilizing career assessment tools, research majors of interest and career paths, attend major panels, speak to students/faculty in majors of interest, and participate in informational interviews with alumni. Students will meet individually with Peer Advisors and/or a CDC staff member at least three times throughout the course.
