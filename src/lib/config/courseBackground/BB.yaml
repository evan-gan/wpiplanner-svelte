  - courseId: BB|3840
    description: "BB 3840 Design and Expression of Biomolecules Laboratory Students will gain experience in several fundamental skills applicable to academic and industrial research and development. Producing a biologic product is of paramount interest in both basic and applied research and requires the ability to both design and produce a functional product. There are numerous potential variables that influence the amount, quality, and cost of producing these molecules. This course will explore some of those variables which allow students to design, test, and evaluate strategies for product and process optimizations. Students will learn how DNA sequences are designed, constructed, and analyzed. A model organism will be grown and induced to express a protein product using common fermentation principles and techniques. Students will evaluate efficiency of the fermentation and output of the gene product through an original research project of their design. Students may not receive credit for BB 3840 and either BB 3512 or BB 3517. Units: 1/3 Category I Recommended background: Working knowledge of the principles of molecular biology (BB 1101, BB 2920, or 3950 or equivalent) and cell biology (BB 2550 or equivalent), as well as relevant biology laboratory experience (BB 1801, 3827, or equivalent)."
