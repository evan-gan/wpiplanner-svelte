    description: "Cat. II This course will provide an overview of municipal solid waste (MSW) engineering with specific attention to municipal solid waste quantities and characteristics, refuse collection systems, landfilling, recycling and material processing, pollution prevention, biological processing, and energy recovery. Recommended background: Basic knowledge of general chemistry (CH 1010, CH 1020 or equivalent), differential equations (MA 2051 or equivalent), fluid mechanics (ES 3004 or equivalent), thermodynamics (ES 3001, or equivalent), and Environmental Engineering (CE 3059)."
