  - courseId: MU|2502
    description: "What are the connections between music and science, and what can be achieved when they come together? This course will teach students to create science-inspired musical compositions, providing the opportunity to explore the humanistic side of their STEM experiences at WPI. Students will learn interdisciplinary techniques such as data sonification, analyze works of science-art in society, and explore the philosophical questions that arise when differing disciplines are brought together. These activities will culminate in the creation of multimedia compositions performed live in a concert of instrumental and electronic music. Those with a science focus at WPI will have the opportunity to explore their work in a musical context, and those with a humanities background will be empowered to compose works inspired by science. Recommended Background: some background in musical performance and/or composing. Cat II"
    clauses:
