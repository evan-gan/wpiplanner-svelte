  - courseId: CHE|2014
    description: "Cat. I This course builds on prior work in material and energy balances, chemical engineering thermodynamics, and stagewise separation processes to facilitate student mastery and design of more complex processes. Topics covered include chemical reaction equilibria, material and energy balances for non-steady state systems, combined material and energy balances, humidification, and batch distillation. Recommended background: Elementary college chemistry and calculus and some familiarity with the topics listed in CHE 2011, CHE 2012, and CHE 2013. Students may not receive credit towards CHE distribution requirements for both CHE 2014 and CM 2002. Some sections of this course may be offered as Writing Intensive (WI)."
