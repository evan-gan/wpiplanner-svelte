    description: (0 credits) Topics in biomedical engineering are presented both by authorities in the field and graduate students in the program. Provides a forum for the communication of current research and an opportunity for graduate students to prepare and deliver oral presentations. Students may meet the attendance requirement for this course in several ways, including attendance at weekly biomedical engineering seminars on the WPI campus, attendance at similar seminar courses at other universities or biotech firms, attendance at appropriate conferences, meetings or symposia, or in any other way deemed appropriate by the course instructor.
