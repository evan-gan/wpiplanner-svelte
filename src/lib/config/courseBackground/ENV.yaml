department: ENV
entries:
  - courseId: ENV|1500
    description: "Cat. II This course introduces Geographic Information Systems (GIS) as a powerful mapping and analytical tool. Topics include GIS data structure, map projections, and fundamental GIS techniques for spatial analysis. Laboratory exercises concentrate on applying concepts presented in lectures and will focus on developing skills using ArcGIS. These exercises include examples of GIS applications in environmental modeling, socio-demographic change and site suitability analyses. Although the course is computer-intensive, no programming background is required. This course will be offered in 2019-20, and in alternating years thereafter. Note: Students may not receive credit for both ENV 150X and ENV 1500."
    clauses: []
    noCreditWith:
      - ENV|150X
  - courseId: ENV|2110
    description: "Sustainability traditionally focuses on reducing harm to the environment and maintaining balance by using resources responsibly. Regenerative sustainability goes further. Inspired by nature’s ability to heal and renew itself, it promotes systems that restore and regenerate – helping landscapes and communities co-adapt, grow, and thrive over time. This approach is systemsoriented, action-driven, and self-sustaining. It allows natural and human systems to continuously evolve and renew themselves. In this course, students will explore practical strategies for restoring ecosystems, strengthening resilience, and creating self-sustaining systems. Key topics include conservation, reforestation, combating desertification, restoring watersheds, mines, and fostering ethical resource management. Students will compare large-scale sustainability initiatives—such as Africa’s Great Green Wall and China’s Three-North Shelterbelt Program—to community-led efforts like agroforestry and agroecology in the Sahel and Sahara, which leverage local knowledge, participatory governance, and adaptive technologies. This comparison will highlight why topdown policies often fall short, while decentralized, community-driven solutions tend to succeed. Through case studies, workshops, and hands-on projects, students will examine governance models and restoration strategies, exploring both government-led approaches and grassroots solutions. By the end of the course, students will be equipped to apply regenerative sustainability principles across policy, governance, agriculture, hydrology, energy, business, and technology to tackle global challenges. This course equips students with the skills needed for IQP projects and future graduate studies. Recommended background: None"
    clauses: []
    noCreditWith: []
  - courseId: ENV|2120
    description: "This course leverages documentary filmmaking as a powerful medium for communicating change processes, disseminating information, advocating for action, and influencing policy at the local, state, and national levels. Students will develop the skills to craft compelling narratives that simplify complex issues for diverse audiences while driving social and political change. They will learn the art of designing and creating films strategically tailored to shape policy discussions and policymaking. Students will base their films on archival work, fieldwork in Worcester, IQP projects, or graduate research in the US and abroad. They will engage in collaborative research and filmmaking processes, gaining hands-on experience at every stage of production, from concept development to final editing. They will work in teams to explore environmental documentary genres, analyze case studies of impactful films, and create their own short documentaries aimed at influencing public opinion and policy decisions. The course covers storytelling techniques, advocacy strategies, ethical considerations, and the integration of audiovisual media into policy advocacy campaigns. By exploring how documentaries can inform and inspire actionable policy responses, students will develop a deeper understanding of the intersection between communication, activism, and governance. This course will be useful for students who wish to engage with digital communication and those who wish to make a documentary of their projects, such as MQP and IQP, for sharing with the broader community. Recommended background: None"
    clauses: []
    noCreditWith: []
  - courseId: ENV|2600
    description: "Cat. II Environment and development are often seen as incompatible, in part because many poor people in the developing world depend directly on natural resources for their livelihoods. At the same time, poor people are often seen as responsible for causing environmental degradation because they lack the knowledge, skills and resources to manage the environment effectively. The vicious circle is completed as environmental degradation exacerbates poverty. However, optimists argue that poor people can and do contribute positively to environmental outcomes, that states and organizations can facilitate their efforts and that environmental interventions can coincide with development. This course will examine these different perspectives on environmental problems in the developing world through the insights and critiques of social science. Subjects covered include sustainable development, population, environmental risks, gender, urbanization, environmental decision making, and non-governmental organizations (NGOs). The goals of this course are to think critically about the various links between environment and development and the role of governmental and non-governmental organizations in promoting sustainable development in the developing world. Recommended Background: ENV 1100 This course will be offered in 2019-20, and in alternating years thereafter."
