  - courseId: IMGD|3450
    description: "IMGD/WR 3450 - Writing Characters for Interactive Media & Games Course description: This writing-intensive course reinforces narrative skills to achieve proficiency in character creation and dialogue for interactive media, including a survey of character writing techniques across different media and an examination of what changes when interactivity is added. Coursework will involve major forms of game writing, suitable for inclusion in a portfolio. Topics covered may include character exposition, development of rich playable and non-playable characters, short voice-over audio, interactive dialogue and interactive character arcs, and game character design. Recommended background: previous experience with story structure and writing for interactive media, such as that provided by IMGD/WR 2450 (formerly numbered IMGD/WR 3400). Students may not receive credit for both IMGD/WR 3450 and IMGD/WR 2400"
