  - courseId: CH|555
    description: "This course is designed for students to attain a broad and in-depth acquaintance with the mechanism, platform and targets of various sensors, with a focus on biosensors and chemical sensors. Topical concepts covered include: sensor components and characteristics; synthetic, biological and biomimetic materials used in sensor development; miniaturization and nanotechnology involved in sensor fabrication; various sensing modalities, data analysis and device prototyping. Students will be required to partner with others and consult with academic and industrial scientists to design sensors of their own interests as a final project for assessment."
    clauses: []
    noCreditWith: []
  - courseId: CH|562
    description: How do Food and Drug Administration (FDA) regulations and guidelines drive the drugdevelopment pathway for small-molecule products? We will outline the guidelines and regulations for pharmaceutical products including requirements for non-Good Laboratory Practice (GLP) and GLP safety studies, Absorption, Distribution, Metabolism and Excretion (ADME), Pharmacokinetic-Pharmacodynamic (PK/PD), and other pharmacokinetic and toxicological studies to establish the safety and efficacy of drugs as dictated by FDA regulations. Students will learn how to utilize safety (NOEL/”No Observed Effect Level” and NOAEL/”No Observed Adverse Effect Level”), efficacy, and pharmacokinetic studies to determine first in human doses and a therapeutic index, and requirements for Good Manufacturing Practices (GMP). Students will also learn about small, niche FDA regulatory pathways to include the animal rule (in which humans cannot be included in efficacy studies for safety reasons)/animal model development through discussions of biological warfare and outbreak pathogen therapeutic development.
    clauses: []
    noCreditWith: []
  - courseId: CH|563
    description: The course describes the evolution of the regulations that govern the pharmaceutical industry and examines how the resultant regulatory framework influences and guides pharmaceutical companies in the development, manufacture, testing and commercial distribution of drugs. Multiple aspects in the drug development process influenced by the regulations including quality system design and operation, regulatory affairs group structure and activities, compliance, good practices (GxPs), and ethics will be covered. The course will explore the global regulatory environment but will focus on the US Food and Drug Administration (FDA) and the European Medicines Agency (EMA) as primary study cases when examining the regulations, processes and controls for clinical development, marketing authorization approvals and post-approval changes for drugs, biologics and vaccines.
    clauses: []
    noCreditWith: []
  - courseId: CH|1010
    description: Cat. IThe CH1010 course is an introduction to chemistry using the fundamental structures of atoms as a starting point. Emphasis is placed on discussing how all properties of matter as well as bonding mechanisms arise from atomic structure. Lewis structures and molecular orbitals are used to understand bonding, and the intermolecular forces present in chemicals systems are used as a prelude to reactivity patterns covered in future courses.
    clauses: []
    noCreditWith: []
  - courseId: CH|1040
    description: Cat. I We will examine the nature of molecular motions and their interaction with electromagnetic radiation, which provides us with all our structural information about molecules. In addition, students will be introduced to to important techniques such as the fundamentals of infrared (I.R.), nuclear magnetic resonance (N.M.R.), UV-Vis absorption and fluorescence spectroscopies, and electrochemistry. The concepts of these techniques will be discussed in the context of structural organic chemistry and polymer characterization.
    clauses: []
