  - courseId: AE|2330
    description: "This course focuses on fundamental concepts in dynamics most relevant to aerospace engineering. Topics in kinematics include three-dimensional particle kinematics in Cartesian and cylindrical coordinates, general relative motion analysis using translating and rotating reference frames, and two- and three-dimensional rigid body kinematics in general motion. Topics in two- and three-dimensional particle and rigid-body kinetics include linear momentum, moments of inertia and angular momentum, translational and rotational equations of motion, kinetic energy, and the principle of work and energy. Whenever possible, examples will be taken from orbital mechanics, navigation, and aircraft and spacecraft dynamics. Recommended Background: introductory mechanics (PH 1110 or PH 1111, or equivalent) and differential and integral calculus (MA 1021, MA 1022, MA 1023, and MA 1024, or equivalent)."
