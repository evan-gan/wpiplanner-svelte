  - courseId: MKT|3650
    description: Cat. I Knowing how to manage and interact with customers is a key component for business success. Today, customer needs are continuously evolving as well as how products and services are purchased and consumed. Understanding consumer behavior concepts allows firms to investigate consumption habits and make better informed managerial decisions. The goal of this course is to provide an introduction to various theories and dimensions of consumer behavior, such as the consumer decision-making process, the influence of attitude towards the product, brand, and/or firm, and the impact of culture and subculture. Students will be exposed to how these concepts are linked and applied to marketing, to our roles as consumers, and to everyday decisions.
    clauses: []
    noCreditWith: []
  - courseId: MKT|4040
    description: "Data and its analysis are at the heart of this new era of marketing. The goal of this course is to provide the skills needed to make intelligent use of marketing data about customers, products purchased, competitors, and the industry. The focus will be on the application of analytics techniques to enhance marketing decision-making in organizations. The course blends the art and science of marketing analytics and prepares students to generate marketing insights from data in areas such as segmentation, targeting, positioning, customer churn prediction, pricing, and customer lifetime value analysis. This will be a hands-on course, in which students apply the concepts and techniques studied in class to solve real-world business problems. Recommended background: Foundational knowledge in Marketing or Consumer Behavior (equivalent to MKT 1100 or MKT 2640) and Knowledge of Statistics (equivalent to that in MA2611 or MA2612). Cat I"
