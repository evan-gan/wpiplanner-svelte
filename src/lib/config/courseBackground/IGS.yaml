  - courseId: IGS|590
    description: "This seminar analyzes core themes in climate adaptation and action from a comparative perspective, bridging geography, anthropology, and the built & natural environmental design disciplines. Through a combination of readings, case studies, and an individual depth project, the course provides an opportunity for students to explore theoretical frameworks for climate adaptation strategies in a way that is informed by diverse places and practices, both locally and globally. We work across scales to consider explore similarities and differences observed in different regions to foster skills and perspectives essential for empirically grounded, comparative, and holistic analysis of community engaged climate adaptation in urban and rural contexts. In doing so, we investigate both positive resonances between theoretical frameworks and demonstrated outcomes in discrete places, while we also critically probing any gaps or tensions, that may emerge from site or project specific considerations. Guests will provide additional content for consideration. Suggested background: Undergraduate students interested in this course should have junior standing. Recommended background: Completion of 12 credits in 3 Core CCA courses and 8 credits of GQP."
