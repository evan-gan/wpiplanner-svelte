department: TH
entries:
  - courseId: TH|1221
    description: Introduction to Theatre on Page and Stage. Cat I (1/3 units) This introductory course gives students a basic understanding of theatrical productions and theatre vocabulary through an investigation of how a play moves from the page to the stage. By touching on the various sub-disciplines of theatre (including playwriting, design, performance, and more), this course explores the role of theatre and art in the world. Students may not receive credit for EN 1221 & TH 1221
    clauses: []
    noCreditWith:
      - EN|1221
  - courseId: TH|205X
    description: "TH205X: Dance for Musical Theatre This course builds dance skills related to musical theatre. Topics may include jazz, contemporary, and other styles, reflecting the wide range of choreography used onstage both historically and today. Emphasis will be placed on stage presence, body awareness, musicality, acting, and character development. (This course may count toward either the HUA requirement [for 1/6 unit] or the WPE requirement [for 1/12 unit], but may not count toward both. It may not be repeated for credit.) Recommended Background : (none)"
    clauses: []
    noCreditWith: []
  - courseId: TH|2100
    description: "Cat. I This course is designed to give students fundamental tools and techniques for acting in the theatre. These include concentration, relaxation, imagination, observation, communication, sensory awareness, and basic script analysis. Drawing on the “Stanislavski Method,” and using character analysis and scene study, it will include exploration of objectives, tactics, obstacles, action, conflict, subtext, and characterization. It will do this through in-class exercises, as well as monologue and scene work from a variety of plays. Beyond acting skills, the student will learn valuable skills in public speaking and in conveying clear, complex ideas. Recommended background: Some theatre or acting experience is desirable but the course is suitable for anyone with interest in the subject. Students may not receive credit for TH 2100 and TH 1100."
    clauses:
      - strength: suggested
        timing: prior
        sourceText: Some theatre or acting experience is desirable but the course is suitable for anyone with interest in the subject.
        requirement:
          kind: topic
          topic: some theatre or acting experience
