  - courseId: ETR|1100
    description: Cat. I In the modern competitive and global world confronting today’s engineers, innovation and entrepreneurship (I&E) are increasingly important perspectives for every engineering career. Individuals proficient in I&E are likely to possess unique competitive advantage over those who do not. This course develops the foundation for developing such proficiency by examining the functional roles of the business/commercial aspects of engineering disciplines as well as establishing a basis for innovative thinking. Specific cases where I&E has led to new products innovation and new enterprise development will supplement course materials.
    clauses: []
    noCreditWith: []
  - courseId: ETR|500
    description: Entrepreneurship and Innovation Entrepreneurship involves many activities, including identifying and exploiting opportunities, creating and launching new ventures, introducing new products and new services to new markets. It is based on implementing innovations within existing organizations and creating new opportunities. This course is intended to introduce students to entrepreneurial thinking and methods of executing their ideas. Topics include recognizing and evaluating opportunities, forming new venture teams, preparing business and technology commercialization plans, obtaining resources, identifying execution action scenarios, and developing exit strategies.
    clauses: []
    noCreditWith: []
  - courseId: ETR|593
    description: In the modern world of global competition the ability to utilize technological innovation is increasingly important. This course will examine the sources of new technology, the tools to evaluate new technologies, the process of intellectual property transfer, and the eventual positioning of the resultant products and services in the commercial market. Its purpose is to improve the probability of success of this discipline in both existing organizational models and early stage ventures. Specific cases studies of successful technology commercialization processes will be used to supplement the course materials.
    clauses: []
    noCreditWith: []
