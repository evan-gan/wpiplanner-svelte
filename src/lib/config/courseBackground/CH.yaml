  - courseId: CH|3550
    description: Cat. I This course deals in a general way with the interactions between energy and molecules, and considers how energetic and structural considerations affect the outcome of molecular interactions. The manipulation of kinetic data and results is stressed. Selected topics from both organic and inorganic chemistry are analyzed in terms of reaction thermodynamics, rates and mechanisms. Students are expected to be familiar with thermodynamics, equilibria, reaction rates and the Periodic Table of the elements. The following three courses, CH 4110, CH 4120, and CH 4130, are a three-term sequence intended to provide a strong emphasis in biochemistry. As background for this sequence, CH 1010, CH 1020, CH 1030, CH 1040, CH 2310, CH 2320, and CH 2330, or their equivalents, are recommended.
