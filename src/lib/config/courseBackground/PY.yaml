  - courseId: PY|2718
    description: "Cat. I This course focuses on two important movements in nineteenth and twentieth century philosophy, existentialism and phenomenology. Readings might include works by Kierkegaard, Dostoyevsky, Nietzsche, Husserl, Heidegger, Beauvoir, Sartre, Merleau-Ponty, Levinas, and Fanon, as well as contemporary readings by feminist, critical race, and queer theorists working within these traditions. Students will also encounter some of the great works of existentialist fiction and cinema. Themes that may be explored include the relationship between self and other, the tension between freedom and responsibility, the possibility of ethics after World War II, and the problem of ethical and political commitment in an alienating world. Recommended Background: none"
    clauses: []
    noCreditWith: []
  - courseId: PY|2719
    description: "Cat. I This course is an in-depth consideration of the meaning, value, and consequences of scientific inquiry. Questions explored may include: Does science yield truth? Are the results of scientific inquiry more a reflection of the workings of the human mind than of those of the external world? Do pivotal scientific concepts like gene, electron, photon, species, and ecosystem point to entities that actually exist? Does the history of science, which includes many refutations of theories once believed to be true, raise questions about whether currently accepted theories should be trusted? By what methods does a scientific community validate knowledge claims and how are these processes affected by social, political, and economic contexts? Does a scientist have a responsibility to conduct morally conscientious research? How does the development of technology affect our spiritual and moral characters? In what ways is science similar to religion and in what ways is it different? The focus of this course may vary each time it is offered from an examination of science in general to an investigation of the foundations of specific branches of science such as physics, biology, environmental science, or social science. Recommended Background: PY/RE 1731, Introduction to Philosophy and Religion or PY/RE 2731, Introduction to Ethics."
