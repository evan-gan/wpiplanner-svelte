  - courseId: CH|1020
    description: "Cat. I Bonding theories introduced earlier in the sequence are applied to chemical reactions, including reduction/oxidation reactions, to demonstrate patterns in reactivity. Solution thermodynamics, concentration scales, and colligative properties are discussed in the context of balanced chemical reactions both in aqueous solution and in the gas phase. Recommended background: Properties of matter, basic bonding theory, Lewis structures and molecular orbitals, intermolecular forces. See CH1010."
