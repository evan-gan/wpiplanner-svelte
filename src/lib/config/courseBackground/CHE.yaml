  - courseId: CHE|3702
    description: "Cat. II The goal of this course is to prepare students for future work in energy-related fields by providing an overview of the challenges related to energy production. Students will study several major energy systems. The details of such energy systems will be examined using engineering principles, particularly focusing on relevant chemical processes. For example, the details and processes of a typical power plant or a refinery will be examined. Students will also become familiar with environmental and economic issues related to energy production. Topics to be covered may include: fossil fuels, the hydrogen economy, biofuels, nuclear energy, fuel cells, batteries, and the electricity grid. Recommended background: knowledge of chemistry (CH 1010, 1020, 1030), differential and integral calculus, and chemical processes (CHE 2011). Students may not receive credit for both CHE 3702 and CHE 320X. This course will be offered in 2019-20, and in alternating years thereafter."
