    description: "Cat. IThis course uses a project-based approach to build confidence and competence in the use of chemical engineering thermodynamics for the analysis and design of chemical processes. Topics covered include extractive separation systems, solution thermodynamics and nonreacting multicomponent mixtures, phase equilibria and property changes on mixing.Recommended background: Elementary college chemistry and calculus and some familiarity with the topics listed in CHE 2011 and CHE 2012.Students may not receive credit towards CHE distribution requirements for both CHE 2013 and CM 2102."
