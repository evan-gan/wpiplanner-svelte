  - courseId: FP|582
    description: "FP 582: Quantitative Risk Analysis (3 credits) This course will cover fundamentals of facility siting studies (FSS), quantitative risk assessments (QRA) and mitigation techniques. The primary objectives are to provide a thorough foundation and knowledge of the inputs, methodologies and typical types of results for FSS and QRAs. It will also provide knowledge of how QRAs can be used to identify and prioritize risk mitigation strategies to make informed and effective risk mitigation decisions. This course is ideal for PSM managers, process safety engineers, facility siting coordinators / SMEs, and anyone involved in the facility siting decision making process."
    clauses: []
    noCreditWith: []
  - courseId: FP|3070
    description: Cat. I This course teaches students of different technical disciplines the fundamentals of fire protection engineering including combustion chemistry, fire behavior, compartment fire dynamics, toxicity, human behavior in fire, and fire modelling. Students have an opportunity to conduct and view fire experiments in both the WPI Fire Safety Engineering and the WPI Fire Fundamentals laboratories. Fire models are used to aid in use of the scientific method to determine cause and origin of a fire. This course is intended for both majors and non-majors as an introduction into Fire Protection Engineering (FPE) and how engineering knowledge can be used to save lives and property around the world.
    clauses: []
    noCreditWith: []
  - courseId: FP|555
    description: Principles of fire detection using flame, heat and smoke detector technology are described. Fire alarm technology and the electrical interface with fire/smoke detectors are reviewed in the context of contemporary equipment and installation standards. Smoke control systems based on buoyancy and HVAC principles are studied in the context of building smoke control for survivability and safe egress.
    clauses: []
    noCreditWith: []
  - courseId: FP|570
    description: This course focuses on the presentation of qualitative and quantitative means for firesafety analysis in buildings. Fire test methods, fire and building codes and standards of practice are reviewed in the context of a systematic review of firesafety in proposed and existing structures.
    clauses: []
    noCreditWith: []
  - courseId: FP|575
    description: Principles of combustion explosions are taught along with explosion hazard and protection applications. Topics include a review of flammability limit concentrations for flammable gases and dusts; thermochemical equilibrium calculations of adiabatic closed-vessel deflagration pressures, and detonation pressures and velocities; pressure development as a function of time for closed vessels and vented enclosures; the current status of explosion suppression technology; and vapor cloud explosion hazards.
    clauses: []
    noCreditWith: []
  - courseId: FP|580
    description: One of the biggest ways that you can influence the quality of your life is by improving the quality of your decisions. Complex Decision Making is intended for professionals in management positions and/ or those individuals, regardless of industry, who seek to enhance both their career potential and their overall quality of life. Based on logical principles, and informed by what we know about the limitations of human judgment and decision-making in complex situations, the course trains managers how to think about and structure decisions. These decisions incorporate both their everyday decisions as well as the tough, complex decisions that involve uncertainty, risk, several possible perspectives, and multiple competing objectives, thus improving the quality of the resulting decisions. In addition to teaching formal decision theory and application, we will explore cognitive biases that prevent us from being completely rational in our thinking and deciding. Exit this course able to define the right decision problem, clearly specify your objectives, create imaginative alternatives, understand consequences, grapple with trade-offs, clarify uncertainties, and think hard about your individual values and risk tolerance.
    clauses: []
    noCreditWith: []
  - courseId: FP|585
    description: "FP 585: Explosion Dynamics (3 credits) This course will focus on fundamentals of explosions due to the combustion of flammable gas-air mixtures and combustible dust cloud Some generic questions that will be answered in an explosion dynamics context are: 1. How does a flammable mixture of gas or vapor or a suspension of powder or dust particles or droplets form in the industrial processing of these materials? 2. What are gas or dust cloud limits of ignitability, or in other words, what is the range of temperature, pressure, and concentration in which a flame can ignite and propagate? 3. What is the relationship between the flame propagation rate and the associated explosion pressure, and how is it influenced by the combustibility properties of the gas or dust cloud? 4. How does the “rate-of-pressure-rise” affect the overall explosion hazard and the viability of various explosion protection measures? 5. How does pressure development within the flammable gas or combustible dust cloud relate to the blast wave pressures propagating away from the cloud and away from the equipment in which the explosion originated? The course explains the physical and thermochemical phenomena pertinent to these questions and provides a mathematical framework for characterizing and applying the answers."
    clauses: []
    noCreditWith: []
  - courseId: FP|588
    description: "FP 588 Practical Explosion Analysis: Case Studies in Energy Industry (3 credits) This course will focus on new and renewable energy technologies, hydrogen, battery storage, electrical arc explosions, and transformer safety. Tailored for professionals navigating the evolving energy landscape, this course explores the fundamentals of explosions in unique applications in renewable energy facilities and the challenges posed by electrical arc explosions. The course is case study driven, where the lecturers will provide 5 – 6 in-depth case studies related to electrical arc explosions, explosions in batteries, hydrogen, and geothermal energy and explosion risks in space. Compliance measures are explored with a specific lens on the regulatory landscape governing these cutting-edge technologies. Practical components include emergency response planning, ensuring the safety and resilience of renewable energy assets, and addressing transformer explosion risks. Geared towards engineers, safety professionals, and managers in the energy industry, this course teaches participants to master explosion analysis and risk management tailored to the nuanced challenges of new energy technologies, including electrical arc explosions and transformer safety."
    clauses: []
    noCreditWith: []
