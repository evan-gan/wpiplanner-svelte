  - courseId: PY|2717
    description: "Cat. IThis course will focus on the following questions:What is the scope of the current environmental crisis? What does this crisisreveal about the philosophical presuppositions and dominant values of ourintellectual worldviews and social institutions? How can existing social theorieshelp explain the environmental crisis? What implications does the crisis have forour sense of personal identity? What moral and spiritual resources can help usrespond to it?Readings will be taken from contemporary and historical philosophers andnaturalists.Suggested background: familiarity with basic concepts in philosophy (as inPY/RE 1731)."
