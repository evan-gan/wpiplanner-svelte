  - courseId: PSY|501
    description: "This course covers readings that represent the foundation of the learning sciences, including: Foundations (Constructivism, Cognitive Apprenticeship, & Situated Learning); Approaches (Project-based Learning, Model-based reasoning, Cognitive Tutors); and Scaling up educational interventions. The goal of this course is for students to develop an understanding of the foundations and approaches to the Learning Sciences so that they can both critically read current literature, as well as build on it in their own research. (Prerequisites: None)"
    clauses: []
    noCreditWith: []
  - courseId: PSY|506
    description: This course will cover selected topics related to learning and creativity— including measurement, memory, semantic networks, sleep, analogies, problem-solving, divergent thinking, and insight moments. Students will critically review journal articles and other forms of media to gain a better understanding of the processes involved in learning and creative cognition. Students will also learn about prominent theories of learning and creativity and identify ways to utilize these frameworks to improve education and student experiences in the classroom.
    clauses: []
    noCreditWith: []
  - courseId: PSY|1504
    description: "PSY 1504: Strategies for Improving Cognitive Skills (Cat I) This course is intended for anyone interested in learning more about how the mind works and how to make it work better. The purpose of this course is (1) to provide students with the basic psychological knowledge needed to understand and evaluate such important cognitive skills as memory, problem solving, and decision making, and (2) to provide students the practical skills and experience necessary to improve and assess their cognitive performance. Topics will include but not be limited to: memory improvement, study skills, problem solving techniques, creativity training, brainstorming, making effective choices, evaluating claims about the mind, and cognitive health. No previous experience with psychology is needed."
    clauses: []
    noCreditWith: []
