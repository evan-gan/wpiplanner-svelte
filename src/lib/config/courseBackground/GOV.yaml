entries:
  - courseId: GOV|1303
    description: Cat. I American Public Policy focuses on the outcomes or products of political institutions and political controversy. The course first addresses the dynamics of policy formations and stalemate, the identification of policy goals, success and failure in implementation, and techniques of policy analysis. Students are then encouraged to apply these concepts in the study of a specific policy area of their choosing, such as foreign, social, urban, energy or environmental policy. This course is an important first step for students wishing to complete IQPs in public policy research. Students are encouraged to complete GOV 1303 prior to enrolling in upper level policy courses such as GOV 2303, GOV 2304 or GOV 2311. There is no specific preparation for this course, but a basic understanding of American political institutions is assumed. Some sections of this course may be offered as Writing Intensive (WI).
    clauses: []
    noCreditWith: []
  - courseId: GOV|2120
    description: "This course leverages documentary filmmaking as a powerful medium for communicating change processes, disseminating information, advocating for action, and influencing policy at the local, state, and national levels. Students will develop the skills to craft compelling narratives that simplify complex issues for diverse audiences while driving social and political change. They will learn the art of designing and creating films strategically tailored to shape policy discussions and policymaking. Students will base their films on archival work, fieldwork in Worcester, IQP projects, or graduate research in the US and abroad. They will engage in collaborative research and filmmaking processes, gaining hands-on experience at every stage of production, from concept development to final editing. They will work in teams to explore environmental documentary genres, analyze case studies of impactful films, and create their own short documentaries aimed at influencing public opinion and policy decisions. The course covers storytelling techniques, advocacy strategies, ethical considerations, and the integration of audiovisual media into policy advocacy campaigns. By exploring how documentaries can inform and inspire actionable policy responses, students will develop a deeper understanding of the intersection between communication, activism, and governance. This course will be useful for students who wish to engage with digital communication and those who wish to make a documentary of their projects, such as MQP and IQP, for sharing with the broader community. Recommended background: None"
    clauses: []
    noCreditWith: []
  - courseId: GOV|2311
    description: "Cat. I This course deals with environmental law as it relates to people, pollution and land use in our society. A case method approach will be used to illustrate how the courts and legislators have dealt with these social-legal problems. The course is designed to have the student consider: 1) the legal framework within which environmental law operates; 2) the governmental institutions involved in the formulation, interpretation and application of environmental law; 3) the nature of the legal procedures and substantive principles currently being invoked to resolve environmental problems; 4) the types of hazards to the environment presently subject to legal constraints; 5) the impact that the mandates of environmental law have had, and will have, on personal liberties and property rights; 6) the role individuals and groups can play within the context of our legal system to protect and improve man’s terrestrial habitat and the earth’s atmosphere; and 7) some methods and sources for legal research that they may use on their own. Recommended background: GOV 1303 or GOV 1310."
