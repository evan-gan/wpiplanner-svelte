  - courseId: WR|3210
    description: "Technical writing combines technical knowledge with writing skills to communicate technology to the world. This course introduces the fundamental principles of technical communication and the tools commonly used in the technical writing profession. Topics include user and task analysis, information design, instructional writing, and usability testing. Students learn to use the technical writing process to create user-centered documents that combine text, graphics, and visual formatting to meet specific information needs. Students create a portfolio of user documentation appropriate for both hardcopy and online delivery. Recommended Background: WR 1010, or equivalent writing course."
