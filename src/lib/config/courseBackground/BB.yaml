  - courseId: BB|3060
    description: "BB 3060 Animal Behavior This course will provide an introduction to the scientific study of animal behavior. A combination of lecture, reading, and videos will be used to illustrate how proximate and ultimate forces interact to shape animal behavior in complex and fascinating ways. Behavioral phenomena in all members of the animal kingdom will be discussed and analyzed from ecological, evolutionary, cognitive, and neurobiological perspectives to highlight how the use of an integrative approach has greatly accelerated our ability to solve complex behavioral problems. Primary scientific literature will be used to outline experimental tools and techniques used to investigate behavior in different contexts, including communication, foraging, navigation, mate choice, predation, and social behavior. Students may not earn credit for both BB2050 and BB3060. Units: 1/3 Category: Category I Recommended Background: A thorough understanding of ecology (BB 2040 Ecology or equivalent)."
