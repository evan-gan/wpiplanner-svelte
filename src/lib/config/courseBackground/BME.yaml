  - courseId: BME|531
    description: Biomaterials are an integral part of medical devices, implants, controlled drug delivery systems, and tissue engineered constructs. Extensive research efforts have been expended on understanding how biologic systems interact with biomaterials. Meanwhile, controversy has revolved around biomaterials and their availability as a result of the backlash to the huge liability resulting from controversies related to material and processing shortcomings of medical devices. This course specifically addresses the unique role of biomaterials in medical device design and the use of emerging biomaterials technology in medical devices. The need to understand design requirements of medical devices based on safety and efficacy will be addressed. Unexpected device failure can occur if testing fails to account for synergistic interactions from chronic loading, aqueous environments, and biologic interactions. Testing methodologies are readily available to assess accelerated effects of loading in physiologic-like environments. This combined with subchronic effects of animal implants is a potential tool in assessing durability. It is difficult to predict the chronic effects of the total biologic environment. The ultimate determination of safety comes not only from following the details of regulations, but with an understanding of potential failure modes and designs that lowers the risk of these failures. This course will evaluate biomaterials and their properties as related to the design and reliability of medical devices.
    clauses: []
    noCreditWith: []
  - courseId: BME|532
    description: This course provides an overview of regulations that guide the medical devices industry. Primary focus is on the Food, Drug and Cosmetic Act (FD&C Act) and its associated regulations. The course covers the FD&C Act, including definitions, prohibited acts, penalties and general authority. The course also covers regulations, including establishment registration, premarket approval (PMA) and current good manufacturing practices. Requirements of other federal agencies (NRC, FCC, EPA) will also be discussed.
    clauses: []
    noCreditWith: []
  - courseId: BME|533
    description: The goal of this course is to introduce medical device innovation strategies, design and development processes, and provide students with an understanding of how medical device innovations are brought from concept to clinical adoption. Students will have opportunities to practice medical device innovation through a team-based course project. Specific learning outcomes include describing and applying medical device design and development concepts such as value proposition, iterative design, concurrent design and manufacturing, intellectual property, and FDA regulation; demonstrating an understanding of emerging themes that are shaping medical device innovation; demonstrating familiarity with innovation and entrepreneurship skills, including customer discovery, market analysis, development planning, and communicating innovation; and gaining capability and confidence as innovators, problem solvers, and communicators, particularly in the medical device industry but transferable to any career path.
    clauses: []
    noCreditWith: []
  - courseId: BME|535
    description: "An introduction to the fundamentals of medical device design controls from concept generation to manufacturing. Students work in teams to navigate through the medical device design and development lifecycle on various device types, fulfilling design control requirements while learning what is required to bring a concept to life in industry. Students may not receive credit if they previously completed this course as BME 595: Special Topics. *Does not fulfil technical depth requirement."
