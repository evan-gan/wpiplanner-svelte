  - courseId: AREN|3003
    description: "The course introduces principles and applications of mechanical systems that are required for environmental comfort, health, and safety of building occupants with a focus on energy efficiency and conservation. Topics include psychometrics, thermal comfort, building heating and cooling loads, fluid flow basics, HVAC components and systems, building envelop heat transfer, and energy requirements. In the course, students develop the ability to design and conduct computational modelling experiments and to analyze and interpret output data for selection between system alternatives in order to optimize energy use. Recommended background: Thermodynamics. Some sections of this course may be offered as Writing Intensive (WI)"
    clauses:
      - strength: recommended
        timing: prior
        sourceText: "Recommended background: Thermodynamics."
        requirement:
          kind: topic
          topic: thermodynamics
    noCreditWith: []
  - courseId: AREN|3006
    description: "Cat. I Analysis of heating and cooling load requirements, considering building construction type, geometry, infiltration, occupancy effects, and daily load variations. Heating design addresses water heating systems, electrical heating, central heating, heating of low and high-rise buildings, selection of heaters, boilers, pumps, piping design. Cooling design addresses refrigerants, refrigeration cycle, evaporator, compressor, condenser, thermostatic expansion valves, refrigeration system control equipment, motor and motor control equipment, refrigeration accessories, calculation of refrigeration piping and absorption systems. Computer applications for heating and cooling load analysis will be introduced to develop energy saving solutions. Analytical techniques and building codes are discussed through case studies and design projects. Recommended background: AREN 3003, ES 3004."
