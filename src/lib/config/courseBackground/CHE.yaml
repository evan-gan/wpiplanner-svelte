    description: "Cat. IThe consolidation of the methods of mathematics into a form that can be used for setting up and solving chemical engineering problems. Mathematical formulation of problems corresponding to specific physical situations such as momentum, energy and mass transfer, and chemical reactions. Analytical and numerical techniques for handling the resulting ordinary and partial differential equations and finite difference equations.Recommended background: ordinary differential equations, partial derivatives and vectors, momentum heat and mass transfer."
