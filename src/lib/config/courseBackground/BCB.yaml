  - courseId: BCB|3010
    description: "Cat. II Computer simulations are becoming increasingly important in understanding and predicting the behavior of a wide variety of biological systems, ranging from metastasis of cancer cells, to spread of disease in an epidemic, to management of natural resources such as fisheries and forests. In this course, students will learn to use a technique classed 'agent-based modeling (ABM)' to simulate biological systems. Most of the classroom time will be spent working individually or in groups, first learning a language (either the block-based language Starlogo Nova, or the text-based language Netlogo), and then creating simulation projects. We will also discuss several papers on biological simulations from the primary scientific literature. In constructing and comparing their simulations, students will demonstrate for themselves how relatively simple behavioral rules followed by individual molecules, cells, or organisms can result in complex system behaviors. Recommended background: Students taking this course should have background in a biological area they would like to simulate, at about the depth provided by a BB 2000 or BB 3000 level class. No programming experience is assumed. This course will be offered in 2023-24, and in alternating years thereafter."
