  - courseId: IMGD|2905
    description: "This course will cover basic concepts of probability and data analysis as they apply to the design and analysis of interactive media and games. Students will study appropriate use of probability distributions in the design of interactive experiences, and the use of data analysis methods to understand user behavior in games and other interactive experiences. Topics will include discrete and continuous probability distributions, programming techniques to produce samples from different distributions, descriptive statistics, exploratory data analysis and using existing tools to collect and analyze data from gameplay. This course counts toward the Quantitative Science component of the university-wide Mathematics and Science Requirement for IMGD majors only. Recommended background: High school algebra"
