  - courseId: WPE|1712
    description: "This class deepens the connection between mind, body, and spirit through intentional breath and mindful movement. Building on foundational postures, we explore longer holds, more complex sequences, and refined alignment to enhance strength, flexibility, balance, and focus. Participants will develop greater body awareness and inner stillness while cultivating resilience and relaxation. CAT I Recommended Background: Foundation knowledge of yoga practice (e.g. WPE1612 or regular Yoga practice)"
