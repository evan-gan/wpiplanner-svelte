  - courseId: MIS|4720
    description: "Cat. I This course integrates students’ background in MIS in a one-term project focusing on development of creative solutions to open-ended business and manufacturing problems. The project will utilize systems analysis and design tools such as systems development life cycle, feasibility study, cost-benefit analysis, structured analysis and design. Students will acquire the skills necessary to analyze, develop, implement, and document real-life information systems. Students must be able to organize themselves and the project to complete their work within a seven week term. It is recommended that MIS majors take this course in preparation for their MQP. Recommended background: MIS 3720."
    clauses:
