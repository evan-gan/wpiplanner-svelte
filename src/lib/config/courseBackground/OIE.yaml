  - courseId: OIE|511
    description: "This graduate course is designed to equip the next generation of supply chain leaders with the technical fluency and strategic vision required to manage and leverage the powerful digital forces that are the foundation of the emerging \"tech-heavy world of supply chain management\". The intellectual foundation of this curriculum is framed by the concept of \"technology clock speed”. This model provides a valuable lens for understanding the different rates at which technologies like AI, blockchain, and digital twins are being adopted and integrated into a business's operations to transform supply chain management. The course combines theory with practical approaches such as case studies, guest speakers, software demos, or projects. Students will learn the strategic opportunities and operational challenges of implementing these technologies in supply chains. Recommended background: introduction to operations and supply chain management equivalent to OIE 501: Operations Management or OIE 544: Supply Chain Analytics"
    clauses:
      - strength: recommended
        timing: prior
        sourceText: "Recommended background: introduction to operations and supply chain management equivalent to OIE 501: Operations Management or OIE 544: Supply Chain Analytics"
