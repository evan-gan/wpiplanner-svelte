  - courseId: ID|2314
    description: Cat. II Rapidly developing technologies for computing, information management and communications have been quickly adopted in schools, businesses and homes. The growth of the Internet and of e-commerce, in particular, have given rise to an entirely new set of legal issues as the courts, Congress and international bodies struggle to keep pace with changing technology. This course addresses the government's role in the development of these technologies and the legal issues that result including questions regarding privacy rights, speech and defamation, and the application of patent and copyright law. Policy questions such as surveillance of e-mail, regulation of content, mandates on the use of filters, and the responsibilities and liability of internet service providers are also discussed. Additional policies studied include attempts to control Internet content and enforce international judgments (resulting from e-commerce or cyber-crime) by foreign states and/or international organizations. Students are expected to integrate knowledge of technology with law, politics, economics and international affairs.
    clauses: []
    noCreditWith: []
  - courseId: ID|3531
    description: "Contemporary U.S. Latino Literature and Culture aims to introduce you to the field of Latino Studies, which emerged around the 1990s. We’ll pay particular attention to the English-language cultural production—literature, autobiography, film, music, and criticism—of Latinos linked to four main territories: Mexico, Cuba, Puerto Rico, and the Dominican Republic. While our transnational framework will help us understand the continuum between U.S. Latinos and Latin American/Caribbean communities, we will also closely examine more U.S.-based arguments supporting and contesting the use of Latino as an ethnic racial term uniting all U.S. Latino communities. Indeed, part of our challenge will be to define what the label “Latino” even means. What is Latino literature? In what language do Latinos write? What makes a work Latino? We will thus examine the ways in which U.S. Latinos have manufactured identities within dominant as well as counter-cultural registers. Using identity as a base, we will grapple with collective concerns regarding race, gender, place, exile, immigration, and language. Our readings and discussions will be in English and Spanglish. This course satisfies the Inquiry Seminar to complete the HUA requirement in Spanish and would also count toward International and Global Studies and Latin American and Caribbean studies. In addition, this course would benefit students interested in WPI’s Project Centers in Latin America and the Caribbean. This course will be offered in 2026-2027, and in alternating years thereafter"
    clauses: []
    noCreditWith: []
  - courseId: ID|527
    description: A ten session course run each summer for graduate students and postdocs to bolster teaching proficiency through in depth and interactive sessions on the science behind student learning, scientific teaching, assessments and rubrics, active learning, project based learning, teaching technology, inclusive teaching and universal design, classroom and course management, and course design. Participants will learn through both lecture and practicum sessions each week, and will work in small groups to develop a short teachable unit incorporating the techniques learned throughout the course, which they will ultimately present at the conclusion of the series. Students will also individually develop their own statement of teaching philosophy and receive feedback on this document, a required document for most faculty job applications.
    clauses: []
    noCreditWith: []
