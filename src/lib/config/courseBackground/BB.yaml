  - courseId: BB|2003
    description: "BB 2003 Fundamentals of Microbiology (Cat. I; 1/3 unit) This course will introduce the basic principles of microbiology through lectures, discussion, readings, and projects. The course will explore both the fundamental biology of microbes and the ways in which microbes influence society and the world. Topics will include the morphology, physiology, and genetics of unicellular organisms with a primary focus on bacteria. Special attention will be given to organisms known to have important roles in health, research, industry, and the environment. This course is designed for life sciences majors. Students may not receive credit for both BB 2002 and BB 2003. Recommended background: A working knowledge of concepts of cellular and molecular biology (BB 1101 or equivalent), and knowledge of chemical properties and reactions (CH 1010 and CH 1020 or equivalent). Suggested background: a working knowledge of chemical kinetics, equilibrium, and thermodynamics (CH 1030 or equivalent)"
