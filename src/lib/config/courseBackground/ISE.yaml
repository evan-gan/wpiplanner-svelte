  - courseId: ISE|2820
    description: "ISE 2820 Critical Reading of Our World for English Language Learners (1/3 Unit; Cat. II) The goal of this course is to provide non-native English language students the skills to work with the highest levels of academic and professional reading. Students will develop active and critical reading skills by annotating self-selected academic journal articles, research reports, current news reports and autobiographical literature. Students will create annotated bibliographies, summaries, literature reviews, and critical reaction papers. Students will learn to analyze, synthesize and cite multiple sources when doing academic work. Students will also increase their vocabulary of high-level academic and professional terms. This course will be offered in 2021-22, and in alternate years thereafter. Recommended Background: ISE 1801 or equivalent skills."
