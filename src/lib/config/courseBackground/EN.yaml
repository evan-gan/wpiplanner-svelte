department: EN
entries:
  - courseId: EN|1219
    description: "Cat. I In this introductory course, students will learn about the craft of writing poetry, creative nonfiction, and fiction. They will study contemporary published poems, essays, and stories written by international masters and use these texts as inspiration for their own creative work across genres. They will also read and respond to the work of their peers. Through an equally balanced studio/research approach, this course will develop students’ skills as literary critics and creative writers. Students may not receive credit for both EN1219 and EN121X. Recommended Background: None"
    clauses: []
    noCreditWith:
      - EN|121X
  - courseId: EN|1251
    description: Cat. I This course introduces the student to a variety of critical perspectives necessary to an understanding and appreciation of the major forms, or genres, of literary expression (e.g., novel, short story, poetry, drama, and essay). Writing and class discussion will be integral parts of this course.
    clauses: []
    noCreditWith: []
  - courseId: EN|1259
    description: "EN1259: Introduction to Contemporary Chicana/o Literature. Cat. II This course examines literary works of multiple genres produced by Chicana/o writers from WWII to today, with particular emphasis on the Mexican American Civil Rights Movement of the 1960s and the contemporary relevance of issues such as land and education rights for immigrants. Writers studied may include the novelist Sandra Cisneros, the cultural critic Gloria Anzaldúa, the memoirist JP Brammer, and the short-story writer Silvia Moreno-Garcia. This course will emphasize civic involvement and will offer students the opportunity to engage with political activists and other public groups involved with immigration in America. Students cannot receive credit for both this class (EN 1259) and EN125x, Intro to Contemporary Chicana/o Literature. This course will be first offered in 2024-2025 and alternate years thereafter. Recommended Background: None, though introductory coursework in English (e.g. EN1251 Introduction to Literature), History (e.g. HI1312 Introduction to American Social History), or SP courses that stress literature and culture could be useful preparation."
