    description: "Cat. I (1/6 unit) This laboratory-driven solid biomechanics course provides hands-on experience in characterizing the mechanical properties of biological tissues such as bone, tendons, ligaments, skin, and blood vessels and their synthetic analogs, in the context of an authentic challenge. Students gain an in-depth understanding of the course material from personal observations, measurements, and analysis of biological tissues and synthetic replacement/fixation materials using industry-standard testing equipment. A challenge-based laboratory project will be assigned which will require the students to determine and execute effective test methods at their own pace in a team setting and communicate their findings effectively. Recommended background: Ability to independently perform tensile and bending tests using a uniaxial mechanical testing machine and to perform mechanical and statistical analysis of test data (BME3505). Students who have previously taken BME3504 may not receive credit for this course. Some sections of this course may be offered as Writing Intensive (WI). ~Note: Students who previously took BME 3506 will not get credit for BME 4505"
    clauses: []
    noCreditWith: []
  - courseId: BME|4507
    description: "BME 4507. Skeletal Biomechanics Laboratory: Applications (1/6 units; Cat. I) This application lab is a sequential extension of the corresponding techniques lab (BME 3507). This course provides hands-on experience with applying/utilizing state-of-the-art mechanical testing equipment and software to characterize whole-body biomechanics, including balance, strength, and movement, in the context of an authentic real-world challenge. Students will work in teams to design and execute experiments, utilize appropriate testing equipment, analyze, and interpret data, and effectively communicate results. Recommended Background: A demonstrated ability to independently use skeletal biomechanics equipment to measure balance, kinetics, and kinematics is essential (BME 3507) and the ability to perform statistical analysis of test data."
