    description: "(2 credits) An introductory course on corrosion; aqueous corrosion, stress corrosion cracking and hydrogen effects in metals will be presented. High-temperature oxidation, carburization and sulfidation will be discussed. Discussions focus on current corrosive engineering problems and research. (Prerequisites: MTE 511 and MTE 512 or consent of the instructor.) Note: Students cannot receive credit for this course if they have taken the Special Topics version of the same course."
