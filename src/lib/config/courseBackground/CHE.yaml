  - courseId: CHE|4402
    description: "Cat. I Overall format and procedure are essentially the same as in Unit Operations of Chemical Engineering I. Laboratory projects include experiments in heat and mass transfer such as: heat transfer in two heaters and a cooler, climbing film evaporation, multiple effect evaporation, absorption, extraction, distillation and rotary drying of solids. Recommended background: familiarity with techniques and procedures emphasized in CHE 4401."
