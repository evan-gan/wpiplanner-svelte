    noCreditWith: []
  - courseId: CH|2330
    description: "Cat. IThis course fully explores three most important analytical methods in organic chemistry: infrared spectroscopy, mass spectrometry, and nuclear magnetic resonance spectroscopy. It will continue the coverage of aromatic chemistry. New topics to be introduced include structures, properties, and reactivities of aldehydes and ketones, carboxylic acids and their derivatives, amines, and the interaction among polyfunctional compounds. It reinforces the retrosynthetic analysis and multistep synthesis of organic compounds and revisits reaction mechanisms and stereochemistry of all the new functional groups studied.Recommended background: CH2310 and CH2320. The course is intended for biochemists, chemists, chemical engineers and bioscience majors."
