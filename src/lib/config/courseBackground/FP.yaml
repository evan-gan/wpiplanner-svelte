  - courseId: FP|3080
    description: "This course introduces principles and applications of building fire safety design. Topics include the interaction between fire, the building, and building occupants; systems that are used to detect, suppress, and control the spread of fire; and systems that facilitate the safe evacuation of occupants during fire. Building code requirements and engineering methods for analysis and design of building fire safety systems will be explored. Recommended background: Thermodynamics."
