    noCreditWith: []
  - courseId: CHE|2012
    description: "Cat. I This course aims to build a strong foundation in analysis of chemical processes via a project-based approach. Topics covered include analysis and design of stagewise separation processes such as distillation, 1st and 2nd law (of thermodynamics) analysis of power and refrigeration cycles, and application of material and energy balances in industrial chemical processes, including those with recycle and non-ideal systems. Recommended background: Elementary college chemistry and calculus and some familiarity with the topics listed in CHE 2011. Students may not receive credit towards CHE distribution requirements for both CHE 2012 and ES 3000."
