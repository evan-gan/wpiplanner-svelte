  - courseId: OIE|3460
    description: "Cat. I This course covers the application of simulation to a variety of managerial problems with examples from operations management, industrial engineering and manufacturing engineering. It introduces the student to the concepts of computer simulation, with an emphasis on the design of a simulation experiment and statistical interpretation of its results. It will discuss simulation of queueing models, inventory and industrial dynamics, and gaming situations. The role and use of computers for the execution of simulations will also be highlighted. A commercial simulation language such as Arena will be used to solve problems from the manufacturing and service industries. Recommended background: CS 1004 and MA 2612."
