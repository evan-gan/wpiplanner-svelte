  - courseId: ECE|5532
    description: "This course introduces the characteristics and challenges of interconnecting increasing numbers of Distributed Energy Resources (DERs) to the Electric Power System (EPS). Topics include: challenges to distribution and transmission system protection; local voltage control; ride through; optimal interconnection transformer configurations; and practical engineering approaches to maintain system reliability and protection. The current and evolving interconnection standard (IEEE 1547) is included. Prerequisites: Since the course material builds on power system analysis capabilities, including system protection and controls, ECE 5500 Power System Analysis and either ECE 5520 Power System Protection & Control or ECE 5521 Protective Relaying are required. Also, it is recommended that students take this course after completing ECE 5530 Power Distribution."
