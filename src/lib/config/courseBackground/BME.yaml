  - courseId: BME|4828
    description: "Cat. I This course examines the principles of materials science and cell biology underlying the design of medical devices, artificial organs and scaffolds for tissue engineering. Molecular and cellular interactions with biomaterials are analyzed in terms of cellular processes such as matrix synthesis, degradation and contraction. Principles of wound healing and tissue remodeling are used to study biological responses to implanted materials and devices. Case studies will be analyzed to compare tissue responses to intact, bioresorbable and bioerodible biomaterials. Additionally, this course will examine criteria for restoring physiological function of tissue and organs and investigate strategies to design implants and prostheses based on control of biomaterial-tissue interactions. Recommended background: BB 2550 or equivalent, ES 2001 or equivalent, PH 1110 or PH 1111."
