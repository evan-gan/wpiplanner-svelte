  - courseId: EDU|500
    description: "EDU 500: Foundations of Integrated STEM Education (3 credits) This introductory online synchronous course surveys the landscape of PK-12 STEM education at the school, classroom, and learner levels. Students analyze research and STEM education frameworks to determine the critical elements of high-quality STEM related to teaching & learning, learner’s mindset, agency, and identity. Students consider their own teaching & learning experience, learning theories, and best practices as they synthesize a personalized framework of high-quality STEM education pertaining to their own educational setting. A special emphasis is given to the problem-solving process (otherwise known as the “engineering design process”), stewardship to community & earth, and classroom climate, as students consider the desired outcomes of integrated STEM pedagogy. Recommended Background: This course is intended for practicing PK-12 educators. Students who are aspiring educators or with prior teaching experience should consult with the program director prior to registration."
    clauses:
      - strength: recommended
        timing: prior
        sourceText: This course is intended for practicing PK-12 educators.
        requirement:
          kind: standing
          text: practicing PK-12 educators
    noCreditWith: []
    needsReview: Audience statement rather than a course prerequisite. Aspiring educators or those with teaching experience are told to consult the program director; not modelled.
  - courseId: EDU|510
    description: "EDU 510: Classroom Climate that Supports Diverse STEM Learners (3 credits) This online synchronous course addresses several elements of high-quality teaching, as well as laying the foundation for the variety of teaching & learning styles in different contexts (PreK-12 classrooms, out of school time settings, etc.). Students will discuss research related to family & community, culturally & linguistically sustaining practices, social & emotional learning, Universal Design for Learning, and engaging all learners in STEM. The course will also address different ways of knowing & learning and connecting STEM learning to learners’ culture and place. Students will develop concrete plans to apply course topics into their practice, aligned with professional standards. Recommended Background: This course is intended for practicing PK-12 educators. Students who are aspiring educators or with prior teaching experience should consult with the program director prior to registration."
