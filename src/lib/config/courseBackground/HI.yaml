    noCreditWith: []
  - courseId: HI|3331
    description: "HI 3331 Topics in the History of European Science and Technology (Cat. II) A seminar course on the relationships among science, technology, and society in European culture, examined through a series of case studies. Topics from which the case studies might be drawn include: global scientific expeditions, mapmaking, and European imperialism; the harnessing of science for industrial purposes; the role of the physical sciences in war and international relations; the function of the science advisor in government; the political views and activities of major scientists such as Einstein. Students will use primary sources and recently published historical scholarship to analyze the case studies. This course may be repeated for different topics . This course will be offered in 2022-23, and in alternating years thereafter. Recommended Background: Courses in European history and the history of science and technology"
    clauses:
