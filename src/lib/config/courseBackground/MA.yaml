  - courseId: MA|2212
    description: "This course covers topics in fixed income securities. Topics are chosen to cover the mechanics and pricing of modern-day fixed income products and can include: yield curve theories; forward rates; interest rate swaps; credit-default swaps; bonds with credit risk and options; bond duration and convexity; bond portfolio construction; asset- backed securities, including collateralized debt obligations and mortgage-backed securities with prepayment risk; asset-liability hedging; applications of binomial interest rate trees.Recommended background: An introduction to theory of interest (MA 2211 or equivalent) and the ability to work with appropriate computer software."
    clauses: []
    noCreditWith: []
  - courseId: MA|2251
    description: "Cat. I This course provides an introduction to tensor and vector calculus, an essential tool for applied mathematicians, scientists, and engineers. Topics covered include: scalar and vector functions and fields, tensors, basic differential operations for vectors and tensors, line and surface integrals, change of variable theorem in integration, integral theorems of vector and tensor calculus. The theory will be illustrated by applications to areas such as electrostatics, theory of heat, electromagnetics, elasticity and fluid mechanics. Recommended background: MA 1024."
