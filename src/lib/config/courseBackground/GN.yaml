  - courseId: GN|3512
    description: "GN 3512: Advanced German II: National Identities and Stories (Cat. I) How are national identities communicated, contested, and settled? This course foregrounds the diversity of German culture as disseminated through various media. Students will interpret and present on longer texts (e.g. film, music, literature), and discuss these in the form of complex written and oral discourse. At the end of the course students will be able to communicate in German about topics and issues (e.g. history, citizenship, migration) central to cultural discourse in the German-speaking world. Special emphasis on the development of written communication. This course satisfies the Inquiry Practicum Requirement. Recommended background: GN 3511"
    clauses:
