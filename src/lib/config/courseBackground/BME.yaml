  - courseId: BME|3607
    description: "BME 3607, Biotransport Laboratory: Techniques. Computational Biomechanics, and Course Category (Cat. I). This course provides students with a basic understanding of fluid and mass transport in biologically relevant systems through a combination of hands-on experimentation and theoretical discussions. Students will gain basic knowledge and competency in measuring, calculating, and predicting key aspects of fluid flow and diffusion, such as pressure, tube resistance, viscosity, and concentration. This course will provide the basic skills used extensively in BME 4607. Note: Students who received credit for BME 360X cannot receive credit for BME 3607."
    clauses: []
    noCreditWith:
