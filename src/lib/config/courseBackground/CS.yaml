  - courseId: CS|573
    description: "This course exposes students to the field of data visualization, i.e., the graphical display of data and information for the purposes of communication exploration, and analytics. The course introduces the stages of the visualization pipeline. This includes data shaping, mapping data to graphical attributes, key visualization techniques, modern tools, paradigms, and the perceptual, cognitive, and social dimensions of visualization. Students learn to evaluate the effectiveness of visualizations for specific data, task, and user types. Students' complete visualization design activities, prototypes, and undertake projects that use both commercial and open-source visualization tools, complete a final project which builds on state-of-the-art research in visualization as it intersects with their field of interest. Recommended Background: Students are expected to have programming skills. Examples include CS 5007 at the graduate level, or similar department specific introductory programming courses."
