  - courseId: AB|1600
    description: AB 1600 Moroccan Colloquial Arabic (1/3 Unit; Cat. III) This course presents the rudiments of the spoken Moroccan Colloquial Arabic (MCA) with an emphasis on speaking and listening skills and functional aspects of the language. The course will be taught using phonetic transliteration and Modern Standard Arabic (MSA) script. By the end of the course, students are expected to master a set of social and communicative functions, including introductions, asking for and receiving information, describing persons, objects, and places, requests, describing events with respect to tense, and more. To help students grasp the various functions of MCA, class materials such as songs, film clips, and Moroccan TV series will be used in class and assignments. This course is open to students with no Arabic language background; this course is closed to native speakers of Arabic and heritage speakers except with written permission from the instructor.
