  - courseId: PH|101X
    description: "This is a seminar-based course intended for students that seek to understand the breadth of activities, opportunities, and career pathways that are available to students in areas related to physics. Students at any academic level considering Physics or Applied Physics as a major, both those who are decided as well as those who are undecided, should enroll in PH 101X. This course will not substitute for a PH course in the distribution requirements."
