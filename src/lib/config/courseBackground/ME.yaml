  - courseId: ME|4512
    description: "Cat. I This course serves as an introduction to finite element analysis (FEA) for stress analysis problems. Finite element equations are developed for several element types from stiffness and energy approaches and used to solve simple problems. Element types considered include spring, truss, beam, two-dimensional (plane stress/strain and axisymmetric solid), three-dimensional and plates. Stress concentrations, static failures, and fatigue failures are considered for each element type. Emphasis will be placed on knowing the behavior and usage of each element type, being able to select a suitable finite element model for a given problem, and being able to interpret and evaluate the solution quality. A commercial, general-purpose finite element computer program is used to solve problems that are more complex. Projects are used to introduce the use of FEA in the iterative design process. Recommended background: Mathematics (MA 2051, MA 2071), Mechanics (ES 2501 & ES 2502 or CE 2000 & CE 2001)."
