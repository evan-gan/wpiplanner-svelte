  - courseId: BME|3112
    description: "BME 3112 Human Physiology for Biomedical Engineers 1/3 unit (Cat. I) This course provides students with an understanding of the structure, function and pathologies of physiological systems such as the cardiovascular, respiratory, and the renal system. The course will teach the mechanisms of organ function from an engineering standpoint that help students understand the principles and techniques employed in designing devices used to treat or correct pathological conditions in these organ systems. Students will gain a better understanding of the interface between physiology and device design used in medical devices such as stents, catheters, pacemakers, ECG machines, and other devices as applicable. Special emphasis will be given to group discussions where students will discuss disease pathologies and review the devices used to treat those conditions. Students will be encouraged to review the device design and suggest improvements for better patient outcomes. Other topics covered in the course include regenerative medicine, biomedical ethics and the concept of “Bioinspired design”. This course will not count towards the “Biomedical Engineering and Engineering” course requirement for Biomedical Engineering majors. Students who have received credit for BME3111 cannot receive credit for BME3112. Recommended Background: A knowledge of Human biology (such as BB 1025 or equivalent) and Cell Biology (such as BB 2550 or equivalent)."
    clauses: []
    noCreditWith: []
  - courseId: BME|3113
    description: "In this laboratory course, students will conduct hands-on experiments to become familiar with medical devices used for research and clinical practice. Working with ultrasound, electrocardiogram, otoscope, spirometry, pulse oximetry, and other devices as available, students will design experiments to measure, model, and provide mathematical descriptions of biomedical activity. We will discuss appropriate equipment for assessing specific disease states or conditions and use computational modeling to interpret data. This course is appropriate for students with an interest in pursuing a clinical career, working in a medical research setting, or a career in medical devices. Students may not receive credit for both BME 3113 and BME 311X. This course will be offered, at a minimum, in academic years ending in odd numbers. Recommended Background: Basic knowledge of human physiology (e.g., BME 3112 or equivalent) and computer programming (e.g., BME 1004 or equivalent)."
