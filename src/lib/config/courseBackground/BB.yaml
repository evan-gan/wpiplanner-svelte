  - courseId: BB|504
    description: "This course will facilitate a student’s functional knowledge of living cells from a biological, biochemical and technological perspective. Topics covered will include the structure, organization, growth, regulation, movements, and interaction of cells, as well as details of cellular metabolism and molecular biology. Emphasis will be placed on visualizing cellular architecture, describing the structure of DNA, describing the fate of various cellular RNAs, articulating information flow in cells, and describing protein outcomes. This course is intended to achieve a homogenous level of student understanding and can be used as a foundation course for the program. This course is designed to familiarize students with basic concepts of molecular biology including structure, organization, growth, regulation, movements, and interactions within a cell. Details of metabolism and molecular biology will be covered through projects and study of the primary literature to achieve a homogenous level of student understanding and rigor. Weekly online assessments are designed to ensure understanding. Note: Students may not receive credit for BB 504 and BB 570-196."
    clauses: []
    noCreditWith: []
  - courseId: BB|508
    description: "Animal cell culture technology is about maintaining cells in vitro under controlled conditions. In recent decades this technology has advanced significantly, and animal cells are used in variety of application both in research and product development. The students in this course will be exposed to the different methodologies utilized to grow cells and how this technology is becoming critical in production of many of the health care products used to control human diseases. The course is covers four general skills (1) Basic techniques for culturing and sub-culturing animal cells and growth parameters, (2) Quality control of a cell culture laboratory/How to control contamination, (3) Primary cell culture and development of cell lines, and (4) Scale-up of cell culture from a T-Flask to a bioreactor. Note: Students may not receive credit for BB508 and BB570-198"
    clauses: []
    noCreditWith: []
