  - courseId: CH|4420
    description: "Cat. I The principles and applications of group theory as a tool in chemistry are presented with an emphasis on systems in inorganic chemistry. Topics covered include the development of symmetry group representations and character tables, applications of group theory in quantum-mechanical wavefunctions, molecular vibrations, ligand field theory, and molecular orbital theory. Particular emphasis will be placed on transition metal complexes, including classical coordination complexes, metal carbonyl complexes, and organotransition metal complexes. Recommended Background: CH 1010 - CH 1040, CH 2640 - CH 2670, CH 3410, CH 3530, and CH 3550, and a fundamental understanding of atomic, molecular and solid state structures and properties. Thermodynamic stabilities of inorganic species. Acidity, solubility and precipitation of inorganic compounds (see CH3410)."
