  - courseId: CHE|3301
    description: "Cat. II This course is an introduction to the chemical engineering principles involved in modern applications of biological engineering. Topics may include: an introduction to biology, biochemistry, physiology, and genomics; biological process engineering including fermentation, mammalian cell culture, biocatalysis, and downstream bioseparations; drug discovery, development, and delivery; environmental biotechnology; and chemical engineering aspects of biomedical devices. Recommended background: material and energy balances, thermodynamics, organic chemistry, and differential equations. This course will be offered in 2019-20, and in alternating years thereafter."
