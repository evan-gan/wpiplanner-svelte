department: MKT
entries:
  - courseId: MKT|1100
    description: "This course provides a foundational overview of marketing by exploring how firms create, communicate, deliver, and capture value for customers and stakeholders. Students will examine key topics including consumer behavior, market segmentation, the marketing mix (product, price, place, promotion), and the role of strategy within the broader business environment. Through active learning, the class emphasizes ethical, global, and digital marketing trends to prepare students for dynamic decision-making in modern markets. Recommended background: None."
    clauses: []
    noCreditWith: []
  - courseId: MKT|3630
    description: "The rapid evolution of technology has led to increasingly well-informed buyers who are connected, communicative, and more in control than ever. This course discusses digital technologies and their impact on the marketing mix, branding, communication strategies, and distribution channels. Emphasis is placed on contemporary topics that face today’s marketing managers – with a focus on how analytics can be employed in digital and social media marketing to build brands, conduct business, support causes, rally the masses, and create and maintain customer relationships. Recommended background: Foundational knowledge in Marketing or Consumer Behavior (equivalent to MKT 1100 or MKT 2640) and Knowledge of Statistics (equivalent to that in MA2611 or MA2612). Cat II"
