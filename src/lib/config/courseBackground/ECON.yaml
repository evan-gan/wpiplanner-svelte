  - courseId: ECON|2910
    description: "Cat. I This course is designed to provide an introduction to economics, an introduction to entrepreneurship, and an understanding of the linkages between economics and entrepreneurship. Students will apply these concepts to the assessment of opportunities that might arise from participation in WPI projects. Students will engage in exploring how economics and entrepreneurship can inform opportunity assessment within an ambiguous and uncertain context. These decisions are always made with incomplete information and there is typically no single correct answer but rather multiple possible answers -- each with pluses and minuses. Recommended background: None"
    clauses: []
    noCreditWith: []
  - courseId: ECON|1120
    description: Cat. I This course is designed to acquaint students with the ways in which macroeconomic variables such as national income, employment and the general level of prices are determined in an economic system. It also includes a study of how the techniques of monetary policy and fiscal policy attempt to achieve stability in the general price level and growth in national income and employment. The problems of achieving these national goals (simultaneously) are also analyzed. The course stresses economic issues in public policy and international trade.
    clauses: []
    noCreditWith: []
