  - courseId: MTE|520
    description: "(3 credits) This course begins with elements axiomatic design, the theory and practice. Design applications are considered primarily, although not exclusively, for the design of manufacturing processes and tools. Axiomatic design is based on the premise that there are common aspects to all good designs. These commons aspects, stated in the independence and information axioms, facilitate the teaching and practice of engineering design as a scientific discipline. Analysis of processes and products is considered from the perspective of supporting product and process design. Fundamental methods of engineering analysis of manufacturing processes with broad applicability are developed. Attention is given to examples from one or more of the following: machining (traditional, nontraditional and grinding), additive manufacturing, and to the production of surface topographies. The ability to generalize from detailed examples is emphasized in order to facilitate the students’ ability to development analyses and design methods with broader applicability"
    clauses: []
    noCreditWith: []
  - courseId: MTE|5420
    description: (2 credits) The course starts with an in-depth study of axiomatic design. Applications of axiomatic design are considered primarily, although not exclusively, for the design of manufacturing processes and tools. Axiomatic design is a design methodology based on the premise that there are two axioms that apply to all good designs. These axioms facilitate the teaching and practice of engineering design as a scientific discipline. Manufacturing process analysis is considered from the perspective of supporting design. Methods of analysis of manufacturing processes with broad applicability are sought. Special attention is given to examples in machining (traditional, nontraditional and grinding), additive manufacturing, and to the production of surfaces. The ability to find commonalities across applications and generalize is emphasized to facilitate further development of principles with broad applicability. The content is delivered in video lectures and in readings from the technical literature. Homework and quizzes are given and delivered online. There is a project to design a manufacturing process. The topics can be from work or dissertations that can be interpreted as manufacturing processes and tools. Credit cannot be given for this course and any of the similar, in-class versions for 3 credits, MFE 520, MTE 520 and ME 543.
    clauses: []
    noCreditWith:
      - MFE|520
      - MTE|520
      - ME|543
  - courseId: MTE|558
    description: "(2 credits) This course will provide an integrated overview of the design, selection and use of synthetic plastics. The basic chemistry associated with polymerization and the structure of commercial plastics will be described. Various aspects of polymer crystallization and glass transition will be outlined. Salient aspects of fluid flow and heat transfer during the processing of plastics will be highlighted. Fundamentals of the diverse processing operations used to shape plastics and the resulting structures that develop after processing will be discussed. The mechanical behavior of plastics including elastic deformation, rubber elasticity, yielding, viscoelasticity, fracture and creep will be discussed. Plastic 164 Mechanical Engineering Return to Table of Contents Mechanical Engineering 165 degradation and environmental issues associated with recycling and disposal of plastics will be examined. Typical techniques used in the analysis and testing of plastics will be described and a working knowledge of various terminologies used in commercial practice will be provided. Note: Students cannot receive credit for this course if they have taken the Special Topics version of the same course (MTE 594A)."
    clauses: []
    noCreditWith: []
    needsReview: No credit with the Special Topics version (MTE 594A); that code has a letter suffix, which the course-id pattern cannot store, so noCreditWith omits it.
  - courseId: MTE|580
    description: Reports on the state-of-the-art in various areas of research and development in materials science and engineering will be presented by the faculty and outside experts. Reports on graduate student research in progress will also be required.
    clauses: []
    noCreditWith: []
  - courseId: MTE|5843
    description: (2 Credits) Surface Metrology is about measuring, characterizing, and analyzing surface topographies or textures. This course covers conventional and developing measurement and characterization of roughness. It emphasizes research and covers a wide variety of applications, including, adhesion, friction, fatigue life, mass transfer, scattering, wear, manufacturing, food science, wetting, physical anthropology, and archeology. Surface metrology has applications in practically all engineering disciplines and sciences. Research principles are applied to critical evaluations of research methods. Students learn multiscale methods for discovering correlations between processing, textures, and behavior , and for discriminating surface textures supposed to be different because of their performance or manufacture. Results support product and process design, and quality assurance. Students create detailed project proposals on topics of their choosing, including literature reviews, preparation and testing of surfaces, measurements, characterizations, and analyses. Students cannot receive credit for this course if they have received credit for the Special Topics (ME 593/MTE 594/MFE 594) version of this course, or for ME 5370/MTE 5841/MFE 5841 Surface Metrology.
    clauses: []
    noCreditWith:
      - ME|5370
      - MTE|5841
      - MFE|5841
