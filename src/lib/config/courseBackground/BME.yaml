  - courseId: BME|2210
    description: "Cat I. This course is an introduction to the instrumentation methods used to measure, store and analyze the signals produced by biomedical phenomena. The goal of this course is to familiarize students with the basic design and implementation of techniques for measuring a broad scope of signal types for molecular, cellular and physiological research. Sensors used for acquiring electrical, magnetic, optical/spectral and chemical signals will be covered. Topics include the underlying physics and chemistry of biomedical signals, biosensor types and usage, amplification and signal conditioning, data acquisition methods, and sources of artifact and noise. Recommended background: PH 1120/21, CH 1010 or equivalent."
