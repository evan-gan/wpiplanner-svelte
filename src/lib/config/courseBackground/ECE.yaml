  - courseId: ECE|4576
    description: "This course introduces the foundational concepts and practical considerations of hardware security, a rapidly evolving field at the intersection of electrical engineering, computer architecture, and cybersecurity. The course focuses on how computing systems can be compromised or protected at the hardware level. The threats across the hardware/software boundary are covered, highlighting the importance of abstraction layers in both exposing and mitigating security flaws. Particular attention will be given to vulnerabilities that arise in hardware/software co-design processes, such as insecure IP integration, misconfigured logic, and timing-related side effects that propagate across system layers. Further topics include risks in the electronics supply chain. Special attention is given to emerging threats in AI accelerators and reconfigurable platforms. The course combines lectures with hands-on lab exercises using hardware platforms to reinforce practical skills. Category: Cat I Recommended Background: A prior course in computer programming, such as ECE 2039 (preferred for ECE majors), CS 2301, or CS 2303; a course in embedded computing (e.g., ECE 2049); and a course in digital circuit design (e.g., ECE 2029)."
