  - courseId: HI|3343
    description: "This course examines topics in the cultural, socio-economic, and political history of East Asia. Topics can vary each year and may include the following: nationalism, travel narratives, cross-cultural contact, the role of religion and/or ideology in political history, development and the environment, film and history, China’s global footprint, and the place of minorities and women in Asian societies. This course may be repeated for different topics. No background in Asian history necessary"
    clauses: []
    noCreditWith: []
  - courseId: HI|3510
    description: "In this seminar course, students will explore one aspect of U.S. political history in more depth. Topics will vary each year but may include liberalism, conservatism, fascism and the far Right, left-wing traditions, transformations in the political-economic order, legal history, the party system, or protest movements. Students will have the opportunity to complete self-directed research projects. This course may be repeated for different topics. This course will be offered in academic years ending in odd numbers. Recommended background: No prerequisites. One previous course in history or U.S. history is strongly recommended."
    clauses:
