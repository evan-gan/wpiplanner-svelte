  - courseId: CS|4402
    description: "This course focuses on reverse engineering software and computing systems in the context of cybersecurity. Students will learn how to analyze compiled programs, binaries, and system components to understand their structure, functionality, and potential vulnerabilities. Topics include disassembly, decompilation, debugging, and dynamic analysis, as well as techniques for reconstructing program logic and uncovering hidden or malicious functionality. The course highlights applications such as malware analysis, vulnerability discovery, and security auditing, while also addressing the ethical and legal considerations of reverse engineering. Hands-on labs and projects provide students with practical experience. Recommend Background: This course assumes a substantive understanding of machine organization and assembly language (CS 2011), systems programming concepts (CS 2303), and operating systems (CS 3013)."
    clauses:
