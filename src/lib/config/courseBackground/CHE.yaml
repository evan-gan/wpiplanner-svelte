  - courseId: CHE|501
    description: "CHE 501: Professional Development for Chemical Engineering Doctoral Students (0 Credits) This course provides professional development for chemical engineering students in the Ph.D. program. Topics covered may include: developing professional identities and networks, exploring chemical engineering career paths, setting career goals, improving technical and non-technical communication skills, analyzing ethical challenges in chemical engineering, and supporting diversity, equity, inclusion, and wellness in professional environments. Must be taken for eight semesters during Ph.D. program."
    clauses: []
    noCreditWith: []
  - courseId: CHE|502
    description: "CHE 502: Professional Development for Chemical Engineering Master’s Students (0 Credits) This course provides professional development for chemical engineering graduate students in the M.S. program. Topics covered may include: developing professional identities and networks, exploring chemical engineering career paths, setting career goals, improving technical and nontechnical communication skills, analyzing ethical challenges in chemical engineering, and supporting diversity, equity, inclusion, and wellness in professional environments. Must be taken for two semesters during M.S. program."
    clauses: []
    noCreditWith: []
  - courseId: CHE|504
    description: An essential skill of an engineer is to provide analytical and numerical solutions to relevant problems. This course will provide students with a solid mathematical background required to solve chemical engineering problems in fields such as fluid mechanics, reactor design, thermodynamics, and process design. Methods of mathematical analysis relevant to engineering will be selected from such topics as vector analysis, matrices, eigenvalue problems, Fourier analysis, Fourier transforms, Laplace transformation, solution of ordinary and partial differential equations, integral equations, calculus of variation, optimization methods, and numerical methods. Students should have a background in undergraduate calculus and differential equations.
    clauses:
