  - courseId: CS|4344
    description: "This course introduces the core principles, models, and real-world applications of Natural Language Processing (NLP) and Large Language Models (LLMs) in the context of modern data science. Students will explore NLP tasks, build deep learning models for language understanding and generation, and apply LLMs to solve problems such as information extraction, conversational AI, summarization, and data querying. Students will interact with state-of-the-art LLMs using industry-standard APIs, gaining practical skills in prompt design, system integration, and application development. The course also includes a critical focus on LLM trust, safety, and ethical deployment, preparing students to responsibly build and evaluate generative AI systems. Through projects, students will emerge with both conceptual understanding and practical fluency in applied NLP and LLM development. Recommended background: Programming skills equivalent to (CS 1004 or CS 1101 or CS 1102) and (CS 2102 or CS2103 or CS 2119); and machine learning equivalent to (DS 3010, CS 4445, or CS4342). Units: 1/3 Category: II"
    clauses: []
    noCreditWith: []
  - courseId: CS|4345
    description: "This course introduces foundational concepts and solution strategies for designing intelligent systems composed of multiple autonomous agents. Students will learn about agent-based modeling, coordination, communication, and decision-making in cooperative and competitive environments. The course introduces core theories and algorithms for multi-agent decision-making. It also covers how contemporary AI techniques—such as deep learning and generative models—can be applied to enhance multi-agent system capabilities. Through hands-on projects, students will gain practical experience in analyzing and designing multi-agent systems for real-world applications. Recommended background: Basic knowledge of linear algebra, probability theory, and Python programming. Familiarity with machine learning and deep learning equivalent to (DS 3010, CS 4445, CS4342). Familiarity with deep learning equivalent to CS/DS 4343 encouraged. Units: 1/3 Category: II"
    clauses:
