  - courseId: ME|621
    description: A laboratory-based course which applies Fourier and cepstral signal analysis techniques to mechanical engineering problems. The theory and application of the Fourier series, Fast Fourier Transform (FFT) and the cepstrum to the analysis of mechanical and acoustical systems is presented. Digital sampling theory, windowing, aliasing, filtering, noise averaging and deconvolution are discussed. Limitations of and errors in implementation of these techniques are demonstrated. Students will perform weekly experiments in the Structural Dynamics and Vibration Laboratory, which reinforce the theories presented in lectures. Application will include structures, acoustics, rotating machinery and cams.
