              text: consent of instructor
    noCreditWith: []
  - courseId: MKT|4030
    description: Cat. I Every successful business has a strategy for how it provides value and earns profit within its particular industry. Focusing on the contexts of technology, innovation and entrepreneurship, this course develops analytic approaches for assessing the various aspects of strategy such as the competitive environment, the network of stakeholders, ethical implications, investor motivation, operational execution, and financial projections that are necessary to create a complete business plan. Students cannot receive credit for both BUS 4030 and MKT 4030.
    clauses: []
    noCreditWith:
      - BUS|4030
  - courseId: MKT|500
    description: This course focuses on the development and marketing of products and services that meet customer needs. Topics covered include management and the development of distinctive competence, segmentation and target marketing, market research, competitor analysis and marketing information systems, product management, promotion, pricing strategy, and channel management. Students will learn how the elements of marketing strategy are combined in a marketing plan based on marketing analytics, and the challenges associated with managing products and services over the life cycle, including strategy modification and market exit.
    clauses: []
    noCreditWith: []
  - courseId: MKT|561
    description: We are living in a data-driven world. Everything we do from getting our news in the morning, to buying goods, and searching for information leaves trails of data across the Internet. Consumers have changed and companies need to find new ways to engage with consumers in order to stay profitable and relevant. As a working professional, you will be tasked to use data to make business decisions and develop strategy that create value for consumers and your organization. This course will introduce traditional theories of consumer behavior and then take you on a beginning journey through the dynamic practices of how to use consumer data and analytics in the digital age. Topics covered include consumer behavior theory, an examination of attitude formation and value creation, the challenges of consumer protection, market research, and the influence of technology on consumer decision making.
    clauses: []
    noCreditWith: []
  - courseId: MKT|562
    description: This course is designed to equip students with research methods and tools that are used for marketing decision making. Students will learn to conduct, use, apply, interpret, and present marketing research in order to become effective decision makers. The topics covered in this course include problem formulation, research design, data collection methods, data analysis, and finally presentation of a research plan. This course will be an activity-based course involving design, implementation, and presentation of a marketing research plan. Basic knowledge of marketing and statistical concepts is assumed.
    clauses:
      - strength: recommended
        timing: prior
        sourceText: Basic knowledge of marketing and statistical concepts is assumed.
        requirement:
          kind: allOf
          of:
            - kind: topic
              topic: marketing
            - kind: topic
              topic: statistical concepts
    noCreditWith: []
  - courseId: MKT|565
    description: "The rapid evolution of technology has led to increasingly well-informed buyers who are connected, communicative, and more in control than ever. This course discusses digital technologies and their impact on the marketing mix, branding, communication strategies, and distribution channels. Emphasis is placed on contemporary topics that face today’s marketing managers – with a focus on how social media can be employed to build brands, conduct business, support causes, rally the masses, and create and maintain customer relationships. Students who have previously taken MKT 565 (Digital Marketing) or MKT 598 (Special Topics: Social Media Marketing) cannot earn credit for taking MKT 565 (Digital and Social Media Marketing)."
    clauses: []
    noCreditWith:
      - MKT|598
    needsReview: The excluded MKT 598 is the Special Topics offering titled Social Media Marketing; catalog id MKT|598 covers all MKT special topics, so the exclusion may be narrower.
  - courseId: MKT|568
    description: "MKT 568: Marketing Analytics (3 credits) Data is at the heart of this new era of marketing. The goal of this course is to provide the skills needed to make intelligent use of marketing data about customers, competitors, and the industry. The focus will be on the application of analytics techniques to enhance marketing decision-making in organizations. The course blends the art and science of marketing and prepares students to generate marketing insights from data in areas such as segmentation, targeting, positioning, product choice, customer satisfaction, and customer lifetime value analysis. This will be a hands-on course, in which students apply the concepts and techniques studied in class to actual business situations."
    clauses: []
    noCreditWith: []
