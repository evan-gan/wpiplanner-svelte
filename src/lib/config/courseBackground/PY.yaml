  - courseId: PY|2711
    description: "Cat. II Epistemology is the branch of philosophy inquiring into the nature and conditions of knowledge and truth. Epistemologists ask such questions as: How should we define knowledge? Is knowledge generated by reason or experience? How has knowledge of nature been represented in Western philosophy and science? Is knowledge objective? What constitutes adequate justification for holding a belief? Do attributions of epistemic credibility vary among knowers from different social, cultural, and economic locations? How do power and ideology shape our experiences of the world? Students explore questions such as these and others as they submit their own beliefs about the nature of knowledge to philosophical examination. The course readings and situating context for inquiry will vary each time the course is taught, with each iteration focusing on a particular period or school of philosophical thought. Possible contexts include seventeenth century philosophy or other periods in the history of philosophy, critical theory, pragmatism, analytic philosophy, phenomenology, and feminist philosophy. Recommended Background: none This course will be offered in 2020-21, and in alternating years thereafter."
    clauses: []
    noCreditWith: []
  - courseId: PY|2713
    description: "Cat. II The purpose of this course is to evaluate the social impact of technology in the areas of biology/biotechnology, biomedical engineering and chemistry. The focus of the course will be on the human values in these areas and how they are affected by new technological developments. The course will deal with problems such as human experimentation, behavior control, death, genetic engineering and counseling, abortion, and the allocation of scarce medical resources. These problems will be examined through lectures, discussions and papers. Suggested background: knowledge of key terms and concepts as given in PY/RE 1731 and PY/RE 2731. This course will be offered in 2019-20, and in alternating years thereafter."
