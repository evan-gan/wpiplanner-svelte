  - courseId: RE|2726
    description: "RE 2726 Global Religions (Cat. II) This course will consider, from historical, doctrinal, spiritual and/or philosophical perspectives, either one religious tradition (Islam, Daoism or indigenous traditions, for example) or a constellation of traditions in the same time period or place. Attention will be given to the social context in which these traditions developed and their continuing influence. This course may be repeated for different topics. Recommended background: None."
    clauses: []
    noCreditWith: []
  - courseId: RE|3711
    description: "PY 3711/RE 3711 Topics in Philosophy (Cat. I) This course is organized around an advanced or specialized topic in philosophy and provides preparation for HU 3900 Inquiry Seminars in philosophy and religion. Emphasis on topics and authors will vary with instructor, but will typically involve the study of: a particular philosopher (e.g., Plato, Marx, Dewey, Arendt); a particular philosophical tradition (e.g., Pragmatism, Analytic Philosophy, Buddhism, Feminism); a particular philosophical problem or topic (free will, globalization, consciousness, social movement, justice); or a particular philosophical classic (Aristotle’s Ethics, Hobbes’s The Leviathan, Beauvoir’s The Second Sex). The topical theme of the course will be provided as a modified course title in the course description posted online. This course may be repeated for different topics. Recommended Background: None."
    clauses: []
    noCreditWith: []
  - courseId: RE|3721
    description: "Cat. I This course is organized around an advanced or specialized topic in religion and provides preparation for HU 3900 Inquiry Seminars in philosophy and religion. The focus will vary, but the material will be drawn from a particular religious thinker, a particular religious tradition or a particular historical or contemporary problem. The topical theme of the class will be provided as a modified course title in the course description posted online. Recommended background: none"
    clauses: []
