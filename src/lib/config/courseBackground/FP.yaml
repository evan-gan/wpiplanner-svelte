  - courseId: FP|553
    description: This course provides an introduction to automatically activated fire suppression and detection systems. A general overview is presented of relevant physical and chemical phenomena, and commonly used hardware in automatic sprinklers, gaseous agent, foam and dry chemical systems. Typical contemporary installations and current installation and approval standards are reviewed.
    clauses: []
    noCreditWith: []
  - courseId: FP|554
    description: Advanced topics in suppression systems analysis and design are discussed with an aim toward developing a performance-based understanding of suppression technology. Automatic sprinkler systems are covered from the standpoint of predicting actuation times, reviewing numerical methods for hydraulic analyses of pipe flow networks and understanding the phenomenology involved in water spray suppression. Special suppression systems are covered from the standpoint of two-phase and non-Newtonian pipe flow and simulations of suppression agent discharge and mixing in an enclosure.
    clauses: []
    noCreditWith: []
  - courseId: FP|571
    description: "This course covers practical applications of fire protection engineering principles to the design of buildings. Both compartmented and non-compartmented buildings will be designed for criteria of life safety, property protection, continuity of operations, operational management and cost. Modern analytical tools as well as traditional codes and standards are utilized. Interaction with architects and code officials, and an awareness of other factors in the building design process are incorporated through design exercises and a design studio. (Prerequisites: FPE 553, FPE 521 and FPE 570 or special permission of the instructor.)"
