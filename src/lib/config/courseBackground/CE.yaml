  - courseId: CE|3060
    description: "Cat. I This course provides in-depth coverage of processes used in water treatment. Topics include: review of water chemistry and drinking water standards, impurities in natural waters, aeration, water softening coagulation, flocculation, sedimentation, filtration, disinfection, taste and odor control, corrosion control, and iron and manganese removal. Recommended background: CE 3059 and ES 3004."
