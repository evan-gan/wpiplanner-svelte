  - courseId: BCB|402X
    description: "This course will introduce quantitative approaches to address outstanding questions from various biological disciplines. A combination of lectures, readings, and computational exercises will be used to illustrate how to use simple mathematical models to understand complex biological phenomena. We will discuss and examine different biological problems from diverse areas of biological research, including cell biology, genetics, and public health to highlight the broad applicability of these approaches. Primary scientific literature will be used to introduce these topics, as well as the quantitative experimental techniques used to test these models. Units: 1/3 Recommended Background: A strong background in cell biology and genetics ( BB 2 5 50 , BB2920 , or equivalent) ."
