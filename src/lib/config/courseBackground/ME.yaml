  - courseId: ME|5304
    description: "Demands for increased performance and efficiency of components in the nano/micro-, meso-, and macro-scales, impose challenges to their engineering design, study, and optimization. These challenges are compounded by multidisciplinary applications to be developed inexpensively in short time while satisfying stringent design objectives. As a consequence, effective quantitative engineering methodologies, such as optical techniques, are frequently used in the study and optimization of advanced components and systems. In this course, modern laser metrology techniques are discussed and their practical applications to solve problems, with emphasis on nondestructive testing (NDT), are illustrated with laboratory demonstrations. Topics covered include wave and Fourier optics, classic and holographic interferometry, speckle techniques, solid-state lasers, fiber optics, CCD cameras, computer vision, camera calibration methods, and image processing and data reduction algorithms as required in quantitative fringe analysis. Detail examples of nondestructive testing and coherent optical metrology in solid mechanics, vibrations, heat transfer, electromagnetics, and reverse engineering are given. Students are required to work on projects depending on their background and interests. Recommended background: mechanics, materials, physics, knowledge of a high-level computer programming language. Students cannot receive credit for this course if they have taken the Special Topics (ME 593J) version of the same course or ME 534."
    clauses: []
    noCreditWith: []
  - courseId: ME|5311
    description: "(2 credits) This course, (along with its companion course MTE 512 Properties and Performance of Engineering Materials), is designed to provide a comprehensive review of the fundamental principles of Materials Science and Engineering for incoming graduate students . In the first part of this 2 course sequence, the structure in materials ranging from the sub-atomic to the macroscopic including nano, micro and macromolecular structures will be discussed to highlight bonding mechanisms, crystallinity and defect patterns . Representative thermodynamic and kinetic aspects such as diffusion, phase diagrams, nucleation and growth and TTT diagrams will be discussed . Major structural parameters that effect of performance in materials including plastics, metallic alloys, ceramics and glasses will be emphasized . The principal processing techniques to shape materials and the effects of processing on structure will be highlighted. (Prerequisites: senior or graduate standing or consent of the instructor.) Note: Students cannot receive credit for this course if they have taken the Special Topics version of the same course (MTE 594S)."
