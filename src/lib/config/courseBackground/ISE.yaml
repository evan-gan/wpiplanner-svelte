  - courseId: ISE|1800
    description: The goal of this course is to provide international students for whom English is not their native language the necessary skills for academic success through reading and writing assignments . Students will focus on developing vocabulary, critical reading, paragraph, and essay writing skills . Emphasis is also given to a review of English grammar through intensive written and oral practice to promote accurate and appropriate language use . Strongly recommended for first-year international non-native English speakers . Admission determined by Writing Placement or consent of the instructor.
