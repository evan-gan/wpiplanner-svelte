  - courseId: FIN|331X
    description: "The course will cover the theoretical and practical applications of investments . Within this context, students will review various approaches used in the valuation of stocks, bonds, and derivative securities . Students are expected to master both the theoretical constructs of investments and their application to current industry practice . Topics covered include portfolio and diversification theory, short-term investments, long-term investments, investment banking, security trading, international investing, mutual funds versus ETFs, basic derivatives such as stock options and futures contracts, and government and corporate bonds . By the end of the course, students will be proficient in recommending appropriate asset mixes to achieve clients’ investment goals and monitoring the performance of these assets relative to expectations, benchmarks, and overall market behavior. Recommended background : Knowledge of Finance fundamentals (equivalent to that in FIN 2070)"
    clauses:
      - strength: recommended
        timing: prior
