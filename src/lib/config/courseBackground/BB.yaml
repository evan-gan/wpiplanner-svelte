  - courseId: BB|2030
    description: "BB 2030 Plant Diversity (Cat. I; 1/3 unit) This course focuses on general concepts as they relate to the vast array of plant species and their taxonomic links. Current uses of major plant phyla in both society and the biotechnology industry will be explored. Some emphasis will be given to economically important species chosen from agronomic and non-agronomic situations with examples related to society and climate change. Recommended background: a working knowledge of concepts in biodiversity ( BB1102, BB1002, or equivalent). Students may not receive credit for both BB 2030 and BB 1040 (no longer offered)."
