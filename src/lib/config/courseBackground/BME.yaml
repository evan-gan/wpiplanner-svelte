  - courseId: BME|4701
    description: "Cat. I This course examines the principles of molecular and cell biology applied to the design of engineered molecules, cells and tissues. Topics will include the basic structural, chemical and physical properties of biomolecules (proteins, lipids, DNA and RNA), application of biomolecules to monitor and alter cellular processes in vitro and in vivo, and design considerations for engineering cell and molecular therapeutics. Case studies will be used to examine specific applications of molecular and cellular bioengineering technologies to treat disease and promote tissue repair and regeneration. Recommended background: Cell biology (BB 2550). Additional coursework in molecular biology (BB 2950) and/or genetics (BB 2920) would be beneficial. Students who earned credit for BME 37XX may not receive credit for BME 4701."
