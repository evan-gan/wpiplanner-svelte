  - courseId: CH|4170
    description: "Cat. I This laboratory course focuses on modern DNA technologies and general applications of gene manipulation. Topics include gene amplification and recombination, promoter and plasmid engineering, gene expression and analysis, model systems, CRISPR, genomics and transgenics. Experiments in this course are integrated into an overall genetic engineering project throughout the term that will involve techniques such as electrophoresis, quantitative spectrofluorimetry, and real-time quantitative PCR. Methods of data analysis, common statistical approaches and technical writing will be emphasized throughout the course. Recommended background: Knowledge of organic chemistry fundamentals as well as biochemical concepts including DNA replication and recombination, RNA synthesis and protein synthesis. Familiarity with cellular architecture is also recommended. See CH 2310, BB 2550, BB 4010 and CH 4110 or equivalent."
