  - courseId: ID|500
    description: The purpose of this zero credit course is to familiarize pre-doctoral and postdoctoral trainees with basic ethical issues in research confronting scientists and engineers. The course includes five lectures and five student-led discussion sessions on topics such as experimental design best practices, research involving animal subjects, authorship, and research misconduct. Student learning will be assessed through in-class formative assessments as well as small group presentations during the discussion sessions. The course is recommended for all graduate students and postdocs who are engaged in research and will be offered in 2018 and each year thereafter.
    clauses: []
    noCreditWith: []
  - courseId: ID|1000
    description: Offered during A and C terms, this online, module-based course supports students in developing the skills and learning strategies necessary to confidently navigate academic challenges and succeed in a rigorous academic environment. Students will explore key topics central to college success, including time management, effective study strategies, test‑taking skills, motivation, goal setting, organization, self‑reflection, and the effective use of campus academic and wellness resources. Students are encouraged to evaluate their academic habits, practice new strategies, and create a personalized plan for continued improvement. The course is coordinated by the Office of Academic Advising.
    clauses: []
    noCreditWith: []
  - courseId: ID|2050
    description: Cat. I This course is open to students accepted to off-campus IQP centers and programs . The course introduces students to research design, methods for social science research, and analysis . It also provides practice in specific research and field skills using the project topics students have selected in conjunction with sponsoring agencies . Students learn to develop social science hypotheses based upon literature reviews in their topic areas and apply concepts drawn from social psychology, anthropology, sociology, economics and other areas as appropriate . Students make presentations, write an organized project proposal, and develop a communication model for reporting their project findings . Some sections of this course may be offered as Writing Intensive (WI).
