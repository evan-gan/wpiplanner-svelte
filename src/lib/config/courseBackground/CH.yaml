  - courseId: CH|2650
    description: "Cat. I This laboratory course emphasizes principles, techniques, and instrumentation employed in modern physical chemistry with a view towards applications throughout the molecular sciences. Investigations include chemical thermodynamics and phase equilibria; gas-phase, solution-phase, and interfacial reaction kinetics and dynamics; and molecular modeling of small molecules. Emphasis includes data collection, interpretation, error analysis, and write-up. Recommended background: Fundamentals in chemistry (see CH 1010 – CH 1040), knowledge in thermodynamics (see CH 3510)."
