    description: "MU 2501: Conducting (1/6 unit or 0 unit per semester depending on grading option; Cat. I) This course will introduce students to the basic elements of conducting, such as gesture, music analysis, score preparation, and rehearsal techniques. Each section of the course is paired with a large ensemble to provide practical experience and opportunities between the areas of choral, band, orchestral, and jazz music. Course meeting times include during and outside of these set rehearsal times. Recommended Background: A basic reading knowledge of music and simultaneous enrollment in the corresponding large music ensemble"
