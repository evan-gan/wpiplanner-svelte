    description: "Cat. II This team-oriented, project-based course will provide opportunities for students to deepen their experience and understanding of digital game design concepts through a combination of thorough design, practical implementation, playtesting and in-class game critique . Students will prepare and present design treatments, develop hands-on expertise with game scripting, and study methods of collecting and analyzing gameplay data . A final project and presentation will test their creativity and demonstrate their practical mastery of game design concepts . Recommended background: IMGD 2900: Digital Game Design I, and basic knowledge of statistical data analysis such as that provided by IMGD 2905: Data Analysis for Game Development."
