  - courseId: FIN|3300
    description: "Cat. I This course develops expertise in Finance, Technology, Innovation, leadership, and decision-making by focusing on real-world challenges in the field of FinTech. We will be actively discussing and learning how to analyze, identify, and manage/innovate FinTech across many functional disciplines including Financial, Insurance, Banking, Trading, Information Technology, Regulation, and Budgeting. Students are introduced to the Financial industry and the FinTech ecosystem. The course adopts a decision-maker and leadership perspective (business, operational, functional, and technical leadership) by emphasizing the relationships among financial data, their underlying economic events, risk profiles, challenges/opportunities, and the responses by all stakeholders in a business/corporation. Recommended Background: Introductory business and finance topics such as those found in ACC courses or BUS 2060."
