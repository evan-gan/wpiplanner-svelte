    description: "An introduction to fundamental principles in cell biology and physiology designed to provide the necessary background for advanced work in biomedical engineering. Quantitative methods of engineering and the physical sciences are stressed. Topics include cell biology, DNA technology and the physiology of major organ systems. NOTE: This course can be used to satisfy a life science requirement in the biomedical engineering program. It cannot be used to satisfy a biomedical engineering course requirement."
