  - courseId: ME|5420
    description: (2 credits) The course starts with an in-depth study of axiomatic design. Applications of axiomatic design are considered primarily, although not exclusively, for the design of manufacturing processes and tools. Axiomatic design is a design methodology based on the premise that there are two axioms that apply to all good designs. These axioms facilitate the teaching and practice of engineering design as a scientific discipline. Manufacturing process analysis is considered from the perspective of supporting design. Methods of analysis of manufacturing processes with broad applicability are sought. Special attention is given to examples in machining (traditional, nontraditional and grinding), additive manufacturing, and to the production of surfaces. The ability to find commonalities across applications and generalize is emphasized to facilitate further development of principles with broad applicability. The content is delivered in video lectures and in readings from the technical literature. Homework and quizzes are given and delivered online. There is a project to design a manufacturing process. The topics can be from work or dissertations that can be interpreted as manufacturing processes and tools. Credit cannot be given for this course and any of the similar, in-class versions for 3 credits, MFE 520, MTE 520 and ME 543.
    clauses: []
    noCreditWith:
      - MFE|520
      - MTE|520
      - ME|543
  - courseId: ME|543
    description: "(3 credits) This course begins with elements axiomatic design, the theory and practice. Design applications are considered primarily, although not exclusively, for the design of manufacturing processes and tools. Axiomatic design is based on the premise that there are common aspects to all good designs. These commons aspects, stated in the independence and information axioms, facilitate the teaching and practice of engineering design as a scientific discipline. Analysis of processes and products is considered from the perspective of supporting product and process design. Fundamental methods of engineering analysis of manufacturing processes with broad applicability are developed. Attention is given to examples from one or more of the following: machining (traditional, nontraditional and grinding), additive manufacturing, and to the production of surface topographies. The ability to generalize from detailed examples is emphasized in order to facilitate the students’ ability to development analyses and design methods with broader applicability"
    clauses: []
    noCreditWith: []
  - courseId: ME|5441
    description: "(2 Credits) The problems of cost determination and evaluation of processing alternatives in the designmanufacturing interface are discussed. Approaches for introducing manufacturing capability knowledge into the product design process are covered. An emphasis is placed on part and process simplification, and analysis of alternative manufacturing methods based on such parameters as: anticipated volume, product life cycle, lead time, customer requirements, and quality yield. Lean manufacturing and Six-Sigma concepts and their influence on design quality are included as well. Note: Students cannot receive credit for this course if they have taken the Special Topics version of the same course (MFE594M)."
    clauses: []
