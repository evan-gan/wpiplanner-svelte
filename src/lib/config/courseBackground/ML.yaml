    noCreditWith: []
  - courseId: ML|2022
    description: "Cat. I (1/12 unit) This course covers small unit movement and military tactics. It combines previous study in weapons, movement and communications to teach the combination of firepower and maneuver to the student. This course also teaches the student the elements of how the military trains its personnel. A written decision paper and practical exercise in conducting training is included in this course. Participation in weekly training leadership laboratories; off campus training sessions (field training exercises) and other special events is required. Recommended background: ML 2021"
    clauses:
      - strength: recommended
        timing: prior
        sourceText: "Recommended background: ML 2021"
