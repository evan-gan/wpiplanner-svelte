  - courseId: MU|3230
    description: Cat. II This course introduces students to selected musical cultures of the world, e.g., Africa, Asia, the Middle East, and Latin America, from the ethnomusicological perspective by examining their musical styles as well as cultural and social contexts. Students will be expected to read materials in interdisciplinary areas, including musical ethnographies. No prior background in music is necessary. This course will be offered in 2019-20, and in alternating years thereafter.
