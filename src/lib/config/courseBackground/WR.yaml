  - courseId: WR|3214
    description: "Cat. I This writing workshop focuses on the purposed and genres of writing about disease and public health . We will consider how biomedical writers communicate technical information about disease and public health to general audiences; how writers capture the human experience of disease and health care; how writers treat the public policy implications of disease; and how writers design publicity to promote public health . We will examine such genres as the experimental article, news reports, medical advice, profiles, commentary, and public health messages . Recommended background: WR 1010 Elements of Writing or equivalent writing courses."
