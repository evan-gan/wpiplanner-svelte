    description: "Cat. I This course will build upon the techniques learned in IMGD/AR 2222. Students will learn to apply the animation principles to character animation. Students are taught how to tell a compelling, character-driven story through a focus on character acting techniques such as body language, lip-syncing, facial animation, and micro-expressions. Additional topics covered may include sprites for games, biped and quadruped animation, and 2D animation pipelines. Students will create animated sequences that are intended to serve as a narrative structure for games and other media. Recommended background: Knowledge of digital 2D animation techniques and classical animation principles (IMGD/AR 2222)."
