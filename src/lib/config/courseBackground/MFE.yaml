  - courseId: MFE|5385
    description: (2 Credits) Additive Manufacturing (AM), popularly known as 3D printing, is a technique in which parts are fabricated in a layer-by-layer fashion. The focus of this course is on direct metal AM processes that are used in aerospace, automobile, medical, and energy industries. The objective of the course is to enable students to understand the working principles of various additive manufacturing processes, assess the suitability of metal AM processes for different designs and applications, apply process design concepts to metal AM processes via analytical and finite element modeling approaches, and have an introductory-level understanding of design for AM. Through the course project, students will have the opportunity to experience hands-on design, manufacturing, and characterization of additively manufactured materials, and will work in an interdisciplinary team of mechanical, materials, and manufacturing engineers. The economics of the manufacturing process will also be addressed, with an emphasis on determining the major cost drivers and discussing cost minimization strategies. Students cannot receive credit for this course if they have received credit for the Special Topics (ME 593/MTE 594) version of the same course.
    clauses: []
    noCreditWith:
      - ME|593
      - MTE|594
  - courseId: MFE|545
    description: "This course provides an introduction to artificial intelligence (AI) and machine learning (ML) methods with a focus on applications in manufacturing engineering. Students will gain both theoretical foundations and practical experience with key techniques, including data preparation, exploratory data analysis, data visualization, supervised and unsupervised learning, deep learning, reinforcement learning, and large language models. Emphasis will be placed on understanding how these methods can be leveraged to solve real-world challenges in manufacturing, such as process optimization, defect detection, prediction, and intelligent automation. In addition to lectures, students will engage in hands-on exercises and a course project that allows them to apply the concepts learned. Projects may involve developing models, analyzing datasets, or exploring novel applications of AI/ML tools in engineering contexts. Students are encouraged to design a project that aligns with their interests and may choose to work independently or collaboratively in teams. Recommended Background: Prior knowledge in manufacturing science, materials processing, computer science, or data science is helpful but not required. Prior coding or programming experience is not required. Basic coding (for loops, functions, if/else statements) is helpful."
