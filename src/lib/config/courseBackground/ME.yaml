department: ME
entries:
  - courseId: ME|1800
    description: Cat. I This course introduces students to manufacturing science and engineering and prototype part production. It emphasizes CNC (computer-controlled) machining. Students will learn how to go from a solid (CAD, computer-aided design) model to a machined part, using CAM software (computer-aided manufacturing) and CNC machining. They will also be exposed to associated issues in manufacturing process analysis, engineering design, material science, and in dimensional and surface metrology. Using machining as an example, the science of manufacturing processes is developed in a combination of class work and laboratory experience. The laboratory experience includes an experimental component that relates process variables in machining with performance and machined part quality. Students whose project work will necessitate fabrication of parts and those who want a background in manufacturing process science and engineering should take this course.
    clauses: []
    noCreditWith: []
  - courseId: ME|2300
    description: "Cat. I This project based course introduces students to the engineering design process including; identifying the need, benchmarking, writing design specifications, evaluating alternative designs and selecting a final design. Student groups will construct and evaluate a working prototype of their design. Additional topics include; creativity, product liability, reverse engineering, patents, and codes of ethics for engineers. Extensive written reports and oral presentations are required. Recommended background: computer-aided design (ES 1310), mechanics (ES 2501, ES 2502), and manufacturing (ME 1800)."
