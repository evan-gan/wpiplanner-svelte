department: NEU
entries:
  - courseId: NEU|501
    description: In this course, students will develop an understanding of neurobiology at several levels, from the physiology of individual neurons, through the functioning of neural circuits, and finally to the behavior of neural systems such as vision, motion, and memory . Topics covered include spatial orientation and sensory guidance, neuronal control of motor output, neuronal processing of sensory information, sensorimotor integration, neuromodulation, circadian rhythms and cellular mechanisms of learning and memory . Furthermore, students will learn about artificial intelligence and machine learning approaches to creating computational models of the brain using artificial neural networks and deep learning . The class will be based on lectures accompanied by in-class activities and will include weekly discussion of papers from the scientific literature . The class will focus on a guiding theme, such as neurotransmitter systems, with emphasis on research of human neurological problems, such as schizophrenia, addiction, and neurodegenerative disorders.
    clauses: []
    noCreditWith: []
  - courseId: NEU|504
    description: This course will provide an in-depth under standing of what psychophysiology is and the common methods used to understand psychophysiological responses. Common psychophysiological methods will be discussed in-depth, such as sympathetic and parasympathetic nervous system, facial electromyography, electroencephalography (EEG), respiration, blood pressure, pulse rate, skin temperature, electrodermal responses, cortisol, and other neuroendocrine monitoring methods . The social, cognitive, emotional, and motivational responses to different psychological events will be explored in detail. Computational methods will be described from the fields of artificial intelligence, machine learning, and mobile computing for capturing, processing and discovering patterns in physiological and behavioral data . In addition, the course will examine how biofeedback works in educational, clinical, and experimental settings. Students may not receive credit for both PSY 2502 and NEU 504
    clauses: []
    noCreditWith:
      - PSY|2502
  - courseId: NEU|506
    description: Human neuroscience is a rapidly changing, interdisciplinary field that focuses on the reciprocal relationships between brain functioning and human behavior. This course will provide in-depth understanding of the functional neuroanatomy of the human brain, as well as working knowledge of various brain recording techniques and other emerging technologies used by neuroscientists that help establish and qualify brain-behavior relationships. Students will learn what these methods can (and cannot) tell us about the neural bases of various cognitive phenomena and behaviors, as well as how to align research questions with appropriate methods and tools to ensure sound interpretations about brain function. The course will also include hands-on and interactive activities such as tutorials involving data collection, analysis, and/or interpretation and live demos of data acquisition tools and modalities commonly used in human neuroscience, including but not limited to EEG, fNIRS, fMRI.
    clauses: []
    noCreditWith: []
  - courseId: NEU|503
    description: Computational neuroscience explores the brain at many different levels, from single cell activity, to small local network computation, to the dynamics of large neuronal populations across the brain. This course will introduce students to a multifaceted array of approaches that span biology, physics, mathematics and computer science as well as facilitate the integration of modeling (on both the single molecule and neuron level) and quantitative techniques to investigate neural activity at these different levels. Where possible, this course has a tripartite organization. First, the theory is presented from a text or journal article. Second, students read and critique a paper that uses the technique. Finally, simulations and/or problem sets are assigned to fix the knowledge learned in the course. Pertinent examples will be drawn from research done by WPI students and faculty.
    clauses: []
    noCreditWith: []
