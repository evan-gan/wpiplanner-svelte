  - courseId: OIE|3420
    description: "Cat. I This course provides students with the analytical and management tools necessary to solve manufacturing and service quality problems. Topics include customer needs and quality, quality and cost relationships, process capability analysis, statistical process control, control charts for variables and attributes, design of experiments, and other Six Sigma problem solving methodology. Recommended background: BUS 3020 and MA 2612 or consent of the instructor."
