  - courseId: WR|3011
    description: "Cat. II. Teaching Writing introduces students to the theory and practice of written composition . Students research and read about the writing process and how best to support it through the practice of explicit teaching and tutoring . They learn specific strategies that can support writers as they plan, draft, and revise written work in a number of genres, and they study effective ways to provide helpful feedback on drafts . They also learn about and practice navigating the social, political and interpersonal dynamics of the teacher/tutor-student relationship through a tutoring internship at the Writing Center and through assignments prompting them to develop lesson plans and instructional handouts . This course will help students improve their own writing and read their own and others’ writing more critically . It will be especially useful for those who plan to teach or tutor writing in the future . Recommended background: WR 1010 Elements of Writing This course will be offered in 2019-20, and in alternating years thereafter ."
    clauses:
