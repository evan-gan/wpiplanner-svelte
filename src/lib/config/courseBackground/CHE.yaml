  - courseId: CHE|503
    description: Presentations on scientific advances by recognized experts in various fields of chemical engineering and related disciplines. The course will be graded on a Pass/Fail basis.
    clauses: []
    noCreditWith: []
  - courseId: CHE|521
    description: The course emphasizes the basic concepts of biological systems which are relevant to study by chemical engineers. Topics covered include Ligand binding and membrane transport processes, growth kinetics of animal cells and micro-organisms, kinetics of interacting multiple populations, biological reactor design and analysis, soluble immobilized enzyme kinetics, optimization and control of fermentation, biopolymer structure and function, properties of biological molecules, biological separation processes, scale-up of bioprocesses; laboratory work may be included when possible.
    clauses: []
    noCreditWith: []
  - courseId: CHE|561
    description: Thermodynamics is at the heart of many systems of interest to chemical engineers, from the efficiency of simple mechanical processes to the equilibria of complex reactions. This course is a rigorous treatment of classicalthermodynamics, with reference to the field of statistical thermodynamics. Key modules include First and Second Law analysis; behavior and interrelationships of thermodynamic properties; and fluid phase and chemical equilibria. Exampletopics may include analysis of open and dynamic systems; fundamental relationships; Legendre transforms and generalized potentials; Maxwell relationships; stability theory; thermodynamics of mixtures; fugacity, activity, and chemical potential; phase equilibria of systems containing two or more components; and generalized treatment of chemical equilibria.
    clauses: []
    noCreditWith: []
  - courseId: CHE|580
    description: This course will focus on various topics of current interest related to faculty research experience.
    clauses: []
