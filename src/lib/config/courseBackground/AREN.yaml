  - courseId: AREN|402X
    description: "This course explores the integration of AI technologies into design thinking process es across a wide range of technical and creative disciplines. Students will learn how AI can assist engineers and designers in ideation, prototyping, optimization, and innovation, while emphasizing the indispensable human role in understanding customer needs, problem framing, and strategic decision-making. The course combines a lecture and workshop format, with a majority of the class time devoted to hands-on design tutoring and project work. Students will have the opportunity to propose their own design problems. Special emphasis will be placed on ideation and innovation in an interdisciplinary context, encouraging students to explore creative solutions that bridge traditional technical boundaries. Through case studies, hands-on projects, and exposure to state-of-the-art AI tools, students will critically examine how AI enhances creativity, accelerates iteration, and improves design outcomes. The course emphasizes not only technical application but also addresses ethical considerations, human-AI collaboration, and the challenges of balancing speed, quality, and cost-effectiveness in today's global economy. By the end of the course, students will develop skills to leverage AI in the design process, making them more innovative, efficient, and impactful contributors to modern engineering challenges. Recommended background: This course is open to students from all majors who are passionate about exploring innovative and emerging design approaches. While prior experience in architecture, urban design, user interface design, product design, or related fields is helpful, it is not required . Familiarity with basic drafting software such as Rhino, CAD, or SolidWorks, as well as a foundational understanding of programming concepts, is advantageous but optional."
