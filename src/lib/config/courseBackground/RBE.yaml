  - courseId: RBE|400X
    description: "Introduction to Robot Control, introduces the principles and applications of linear systems in the context of robotic systems, with a focus on time-domain modeling, state-space representation, and feedback control. Students will learn to model dynamic systems using ordinary differential equations and represent them in state-space form, analyze system response and stability, and apply fundamental algebra and linear algebra tools to control design. The course covers core concepts such as regulation of time response, time-to-set-point, stability, controllability, observability, and observer-based state estimation for robotic systems using sensing modalities such as cameras, GPS, and inertial sensors. Emphasis is placed on robotic system dynamics, including mechanical subsystems commonly encountered in manipulators and mobile robots. Students will complete a project by applying modeling, control, and estimation techniques to a robotic manipulator. Numerical analysis and simulation tools such as MATLAB and/or Python will be used throughout the course. Recommended Background: Knowledge of classical control as covered in ES 3011, Linear algebra as covered in MA 2073, Ordinary Differential Equations as covered in MA 2051, and Fundamental principles of programming to program microcontrollers as covered in CS 1005, RBE 2020, or ECE 2049."
