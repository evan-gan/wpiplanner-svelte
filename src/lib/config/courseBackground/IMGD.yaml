  - courseId: IMGD|5000
    description: This is a “studio” course in which the instructor will guide and mentor the students on individual and/or joint projects . The focus of the course will be on the design of interactive media and games, with the students designing (and optionally implementing) one or more games or interactive experiences . There will also be readings and discussion of design theory as it relates to student projects . This course can be taken for M .S . credit twice if desired.
    clauses: []
    noCreditWith: []
  - courseId: IMGD|5100
    description: Tangible and embodied interaction sees humans at the center of the designed experience . A number of systems continue to emerge to immerse the body into a system, such as virtual reality, augmented reality, mixed reality, alternative controls in the forms of guitars or cockpits, sewing machines, mobile phones and technologies, and even more . Through a combination of traditional lecture, literature review, and hands-on work, students will learn to critically evaluate different alternatives, build prototype systems, and design comparative evaluations to test the effectiveness of various techniques . Students will be expected to implement several techniques as part of this course.
    clauses: []
    noCreditWith: []
  - courseId: IMGD|5600
    description: This course covers research methods used in computational and interactive media. As an interdisciplinary field, computational media relies on multiple research methods, such as qualitative, quantitative, design-based research, iterative design methodology, player and user-testing, historical and cultural research methods, computational reasoning, data analysis, and visual analysis. Students will read broadly in research methodologies and discuss applicability and adaptability for particular processes and research questions.
