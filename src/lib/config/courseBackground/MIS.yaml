              orEquivalent: true
            - kind: permission
              text: instructor consent
    noCreditWith: []
  - courseId: MIS|582
    description: This course introduces students to the fundamentals of Information Security Management. It is designed to develop in students an understanding of and appreciation for the importance of information security to all enterprises, and to enable current and future managers to understand the important role that they must play in securing the enterprise. This course is appropriate for any student interested in gaining a managerial-level understanding of information security. A combination of readings, lectures, case studies, guest speakers, and discussion of real world events will be used to bridge the gap between theory and practice. The course will primarily explore the Common Body of Knowledge (CBK) of information security, along with other related topics. It will also explore the interaction between People, Process and Technology as the cornerstone of any effective information security program. Upon completion of this course, the student will have an in-depth understanding of the essential components of a comprehensive information security program, as well as an understanding of the technology at work behind the scenes.
    clauses: []
    noCreditWith: []
  - courseId: MIS|3010
    description: Cat. I This course focuses on the ways value can be created and captured through innovation. Focusing on the assessment of customers, organizational capabilities, and competition, students will consider a variety of different types of innovations and their associated ethical and financial value propositions. Students will learn analytic tools to successfully assess and commercialize technology, product, and service innovations in a variety of contexts. Students cannot receive credit for both BUS 3010 and MIS 3010.
    clauses: []
    noCreditWith:
      - BUS|3010
  - courseId: MIS|3787
    description: Cat. I This course offers a business focused data analytics introduction. Using cutting-edge tools and approaches to the analysis of data through supervised machine learning, the course teaches how to utilize “big data” for effective decision-making. The course creates data analytics skills through hands-on exposure to data and analytic techniques embedded in Automated Machine Learning tools. Application areas covered include Marketing (pricing and marketing of luxury shoes), Supply Chain (predicting parts backorders), Finance (predicting safe loans), Talent Management (predicting and explaining attrition), Service Delivery (predicting hospital readmissions), as well as student-centric topics (college grades and starting salaries). This course provides foundations required to successfully apply the machine learning approaches to many of the most common business problems.
    clauses: []
    noCreditWith: []
  - courseId: MIS|500
    description: This course focuses on information technology and innovation. Topics covered are information technology and organizations, information technology and individuals (privacy, ethics, job security, job changes), information technology and information security, information technology within the organization (technology introduction, and implementation, and data analytics for competitive analysis), business process engineering and information technology between organizations (electronic data interchange and electronic commerce). This course provides the knowledge and skills to utilize existing and emerging information technology innovatively to create business opportunities.
    clauses: []
    noCreditWith: []
  - courseId: MIS|502
    description: This course develops the skills business students need for handling data. It focuses on student skills in (1) cleaning and preparing data for analysis, (2) writing SQL queries to access and manipulate data, and (3) ethical uses of data and data privacy issues. It also covers the types of data typically found in organizations, e.g., employee, customer, product, marketing, operations, and financial data.
    clauses: []
    noCreditWith: []
  - courseId: MIS|510
    description: Business Applications of Blockchain Technology provides students with a foundation of blockchain technology examining its applications across various disciplines such as engineering, law, and economics. Throughout the course, students will delve into diverse blockchain and distributed ledger technologies, popular cryptocurrencies such as Bitcoin and Ethereum, and the implementation and security concerns surrounding them. Students will learn how these systems work, explore the regulatory challenges associated with blockchain technology, and assess its impact on financial services and other industries. The course will also provide students with the component and structures of blockchain business networks such as smart contracts, consensus, certificate authorities, security protocols, role of nodes, transaction processes, participants, and underlying frameworks. Furthermore, the course will examine the Bitcoin (BTC) ecosystem, Ripple (XRP), Ethereum (ETH), tokens (e.g., NFT’s), Initial Coin Offerings (ICOs), and Central Bank Digital Currencies (CBDC). Students will also gain hands-on experience, such as creating basic Blockchain contracts, enabling them to discuss the practical capabilities and limitations of blockchain technology.
    clauses: []
    noCreditWith: []
  - courseId: MIS|520
    description: MIS 520 – Artificial Intelligence and its Ethical Applications in Business (3 credits) This course provides students with a comprehensive introduction to the recent developments in AI, with a focus on their current and potential practical applications in business. The course covers fundamental AI concepts such as search methods, logic, knowledge representation, and natural language processing in sufficient detail to understand how these concepts and associated tools can be applied to solve practical business problems in ways that create fair and ethical solutions. Students will learn about bias in data, algorithms, and human decision making, and methods of avoiding the transfer of those biases to AI-based solutions. They will gain practical experience though a project about the opportunities of AI-based solutions to assist with making decisions and predictions and transforming business and work, as well as the challenges of doing so in a fair and ethical manner that benefits individuals, the environment, and society at large.
    clauses: []
    noCreditWith: []
  - courseId: MIS|576
    description: This course presents the specific concepts, techniques and tools for managing projects effectively. The role of the project manager as team leader is examined, together with important techniques for controlling cost, schedules and performance parameters. Lectures, case studies and projects are combined to develop skills needed by project managers in today’s environment.
    clauses: []
    noCreditWith: []
  - courseId: MIS|581
    description: This course focuses on the core IS capabilities that IS managers must consider when managing technology within an organization, such as IT strategy, policy development, management, and IT’s role in data analytics. Fast-paced changes in technology require IT managers to quickly understand, adapt, and apply technology. Successful companies are those that can react quickly by introducing innovative technologies and respond to market demands using data driven solutions. Students will learn how IT managers engage data to develop and enhance their departments’ strategies.
    clauses: []
    noCreditWith: []
  - courseId: MIS|583
    description: The UX Applications course provides an introduction to using UX methods to study user experience. The course teaches students how to use the newest research tools, including eye tracking and emotion detection, to study user experiences of technological products and services. Students will learn how businesses can benefit from these techniques. Both theoretical concepts and practical skills will be addressed within the scope of the class through hands-on projects, class exercises, and assignments.
    clauses: []
    noCreditWith: []
  - courseId: MIS|584
    description: This course provides students with the knowledge and skills to design, develop, and use business dashboards for monitoring organizational performance and making data-driven decisions. On the technical side, students will learn and apply business intelligence software to organize, represent, and analyze data about customers, products, sales, marketing, operations, and financials. They will learn to create strategic, operational, and analytical dashboards displaying key performance indicators (KPIs) for managerial decision-making. On the business side, students will learn the connections between business strategy and plans, the KPIs that measure performance compared to those plans, and how to use dashboards to manage organizational performance. Students will also learn the technical and managerial challenges of creating and deploying these business intelligence best practices so that organizations gain value from their data. The course includes business cases and hands-on analyses of business data. It is designed for any student interested in learning about data-driven business performance management, including students whose primary focus is Business Management, Data Science, IT, Marketing, or Operations.
    clauses: []
    noCreditWith: []
  - courseId: MIS|585
    description: Designing positive user experiences is becoming increasingly important in staying competitive in the marketplace. This UX Design course offers students hands-on experiences, through the use of real-world projects, that provide them with a strong portfolio of work that showcases their skills in UX/UI, visual, service, experience, and product design. Throughout this course, students will create innovative experiences that enrich their technical fluency in both web and interactive development. The course provides a foundation in art and design in order to help students articulate their work to stakeholders and translate outcomes as business value.
    clauses: []
    noCreditWith: []
  - courseId: MIS|587
    description: This course explores how Machine Learning (ML) and Artificial Intelligence (AI) is applied to solve business problems, to satisfy specific business needs, or to discover new opportunities for businesses. Applications of ML and AI are constantly evolving across many industries. This course utilizes existing AutoML solutions to address issues identified in business case studies (e.g. predicting hospital readmissions, loans likely to default, customer churn). The course covers the machine learning project life cycle starting with defining ML project objectives, acquiring and exploring data, modeling using AutoML tools, interpretation of models and communication of outcomes, and implementation and deployment of predictive models in organizations.
    clauses: []
    noCreditWith: []
