    description: "This course introduces the fundamentals of computer system architecture and organization. Topics include CPU structure and function, addressing modes, instruction formats, memory system organization, memory mapping and hierarchies, concepts of cache and virtual memories, storage systems, standard local buses, high-performance I/O, computer communication, basic principles of operating systems, multiprogramming, multiprocessing, pipelining and memory management. The architecture principles underlying RISC and CISC processors are presented in detail. The course also includes a number of design projects, including simulating a target machine, architecture using a high-level language (HLL). Prerequisites: Undergraduate course in logic circuits and microprocessor system design, as well as proficiency in assembly language and a structured high-level language such as C or Pascal."
